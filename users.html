<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Users</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}
header{
    background:#0b7a0b;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}
.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    background:#0b7a0b;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
}
th{
    background:#0b7a0b;
    color:white;
}
</style>
</head>

<body>

<header>Goldbizna User Management</header>

<div class="container">

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<select id="role">
<option>Admin</option>
<option>Cashier</option>
</select>

<button onclick="addUser()">Add User</button>

<table>
<thead>
<tr>
<th>Username</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

</div>

<script>

let users = JSON.parse(localStorage.getItem("goldbizna_users") || "[]");

function displayUsers(){

userTable.innerHTML="";

users.forEach((u,index)=>{

userTable.innerHTML += `
<tr>
<td>${u.username}</td>
<td>${u.role}</td>
<td><button onclick="deleteUser(${index})">Delete</button></td>
</tr>
`;

});

}

function addUser(){

users.push({
username:username.value,
password:password.value,
role:role.value
});

localStorage.setItem("goldbizna_users",JSON.stringify(users));

username.value="";
password.value="";

displayUsers();

}

function deleteUser(index){

users.splice(index,1);

localStorage.setItem("goldbizna_users",JSON.stringify(users));

displayUsers();

}

displayUsers();

</script>

</body>
</html>
