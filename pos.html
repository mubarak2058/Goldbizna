<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goldbizna POS</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f3f6f4;
    color:#222;
}

header{
    background:#0b7a0b;
    color:white;
    padding:18px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

nav{
    background:#075f07;
    padding:8px;
    display:flex;
    gap:6px;
    overflow-x:auto;
}

nav a{
    color:white;
    text-decoration:none;
    padding:9px 12px;
    border-radius:6px;
    white-space:nowrap;
}

nav a:hover{
    background:#0b7a0b;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
}

h1,h2{
    color:#0b7a0b;
    margin-top:0;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

select,
input{
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    flex:1;
    min-width:150px;
}

button{
    padding:13px 18px;
    border:0;
    border-radius:7px;
    background:#0b7a0b;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#086108;
}

.danger{
    background:#b00020;
}

.print{
    background:#1558a6;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#0b7a0b;
    color:white;
    padding:11px;
}

td{
    padding:11px;
    border:1px solid #ddd;
}

.total{
    text-align:right;
    color:#0b7a0b;
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

@media(max-width:600px){

    header{
        font-size:22px;
    }

    th,td{
        font-size:13px;
    }

}

</style>
</head>

<body>

<header>
    Goldbizna POS
</header>

<nav>

<a href="dashboard.html">Dashboard</a>
<a href="pos.html">POS</a>
<a href="inventory.html">Inventory</a>
<a href="customers.html">Customers</a>
<a href="savings.html">Savings</a>
<a href="reports.html">Reports</a>
<a href="users.html">Users</a>
<a href="settings.html">Settings</a>

<a href="#" onclick="logout();return false;">
Logout
</a>

</nav>


<div class="container">


<!-- PRODUCT SECTION -->

<div class="card">

<h1>Sales POS</h1>

<div class="row">

<select id="product"></select>

<input
id="qty"
type="number"
min="1"
value="1"
placeholder="Quantity"
>

<button onclick="addToCart()">
Add To Cart
</button>

</div>

</div>


<!-- CART -->

<div class="card">

<h2>Shopping Cart</h2>

<div style="overflow-x:auto;">

<table>

<thead>

<tr>

<th>Product</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>

<tbody id="cartList">

</tbody>

</table>

</div>


<div class="total" id="grandTotal">

Total: KSh 0

</div>


<div class="actions">

<button onclick="completeSale()">
Complete Sale
</button>

<button
class="print"
onclick="printReceipt()"
>
Print Last Receipt
</button>

</div>

</div>


</div>


<script>

/* =========================
   LOGIN PROTECTION
========================= */

if(sessionStorage.getItem("gb_login") !== "1"){
    window.location.href="login.html";
}


/* =========================
   DATA
========================= */

let inventory =
JSON.parse(
    localStorage.getItem("gb_inventory") || "[]"
);

let cart = [];

let lastReceipt = null;


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(){

    const productSelect =
        document.getElementById("product");

    if(inventory.length === 0){

        productSelect.innerHTML =
        "<option>No products available</option>";

        return;
    }

    productSelect.innerHTML =
        inventory.map(function(item){

            return `
            <option value="${item.id}">
                ${escapeHTML(item.name)}
                - KSh ${Number(item.sell).toLocaleString()}
                (Stock: ${item.qty})
            </option>
            `;

        }).join("");

}


/* =========================
   ADD TO CART
========================= */

function addToCart(){

    const productId =
        document.getElementById("product").value;

    const quantity =
        Math.max(
            1,
            Number(document.getElementById("qty").value) || 1
        );

    const item =
        inventory.find(
            product => product.id == productId
        );

    if(!item){

        alert("Please add products to Inventory first.");

        return;
    }

    if(item.qty <= 0){

        alert("This product is out of stock.");

        return;
    }

    const existing =
        cart.find(
            product => product.id === item.id
        );

    const existingQuantity =
        existing ? existing.qty : 0;

    if(existingQuantity + quantity > item.qty){

        alert(
            "Not enough stock available. Available: "
            + item.qty
        );

        return;
    }

    if(existing){

        existing.qty += quantity;

    }else{

        cart.push({

            id:item.id,

            name:item.name,

            price:Number(item.sell) || 0,

            qty:quantity

        });

    }

    document.getElementById("qty").value = 1;

    renderCart();

}


/* =========================
   REMOVE CART ITEM
========================= */

function removeFromCart(index){

    cart.splice(index,1);

    renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

    const cartList =
        document.getElementById("cartList");

    if(cart.length === 0){

        cartList.innerHTML = `
        <tr>
            <td colspan="5" class="empty">
                Cart is empty.
            </td>
        </tr>
        `;

        document.getElementById("grandTotal").textContent =
            "Total: KSh 0";

        return;
    }


    cartList.innerHTML =
        cart.map(function(item,index){

            const total =
                item.price * item.qty;

            return `
            <tr>

                <td>${escapeHTML(item.name)}</td>

                <td>${item.qty}</td>

                <td>
                    KSh ${item.price.toLocaleString()}
                </td>

                <td>
                    KSh ${total.toLocaleString()}
                </td>

                <td>

                    <button
                    class="danger"
                    onclick="removeFromCart(${index})"
                    >
                    Remove
                    </button>

                </td>

            </tr>
            `;

        }).join("");


    const grandTotal =
        cart.reduce(
            (sum,item) =>
            sum + (item.price * item.qty),
            0
        );


    document.getElementById("grandTotal").textContent =
        "Total: KSh " +
        grandTotal.toLocaleString();

}


/* =========================
   COMPLETE SALE
========================= */

function completeSale(){

    if(cart.length === 0){

        alert("Your cart is empty.");

        return;
    }


    const grandTotal =
        cart.reduce(
            (sum,item) =>
            sum + (item.price * item.qty),
            0
        );


    const receiptNumber =
        "GB-" +
        Date.now().toString().slice(-8);


    const now =
        new Date();


    /* CREATE RECEIPT */

    lastReceipt = {

        number:receiptNumber,

        date:now.toLocaleDateString(),

        time:now.toLocaleTimeString(),

        items:cart.map(item => ({

            name:item.name,

            qty:item.qty,

            price:item.price,

            total:item.price * item.qty

        })),

        total:grandTotal

    };


    /* UPDATE INVENTORY */

    inventory =
        inventory.map(function(product){

            const sold =
                cart.find(
                    item => item.id === product.id
                );

            if(sold){

                return {

                    ...product,

                    qty:
                    Number(product.qty)
                    -
                    Number(sold.qty)

                };

            }

            return product;

        });


    localStorage.setItem(
        "gb_inventory",
        JSON.stringify(inventory)
    );


    /* SAVE SALE */

    const sales =
        JSON.parse(
            localStorage.getItem("gb_sales") || "[]"
        );


    sales.push({

        id:Date.now(),

        date:now.toISOString(),

        receiptNumber:receiptNumber,

        items:lastReceipt.items,

        total:grandTotal

    });


    localStorage.setItem(
        "gb_sales",
        JSON.stringify(sales)
    );


    /* CLEAR CART */

    cart = [];


    renderCart();

    loadProducts();


    /*
       ASK WHETHER TO PRINT
    */

    const printNow =
        confirm(
            "Sale completed successfully!\n\n" +
            "Receipt: " + receiptNumber +
            "\nTotal: KSh " +
            grandTotal.toLocaleString() +
            "\n\nPrint receipt now?"
        );


    if(printNow){

        printReceipt();

    }

}


/* =========================
   PRINT RECEIPT
========================= */

function printReceipt(){

    if(!lastReceipt){

        alert(
            "There is no receipt available yet. " +
            "Complete a sale first."
        );

        return;
    }


    const receipt =
        lastReceipt;


    const itemsHTML =
        receipt.items.map(function(item){

            return `
            <tr>

                <td>
                    ${escapeHTML(item.name)}
                </td>

                <td>
                    ${item.qty}
                </td>

                <td>
                    KSh ${item.price.toLocaleString()}
                </td>

                <td>
                    KSh ${item.total.toLocaleString()}
                </td>

            </tr>
            `;

        }).join("");


    const receiptHTML = `

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Goldbizna Receipt</title>

<style>

body{

    font-family:Arial,sans-serif;

    width:80mm;

    margin:0 auto;

    padding:10px;

    color:#000;

}

.center{

    text-align:center;

}

.logo{

    font-size:24px;

    font-weight:bold;

}

.small{

    font-size:12px;

}

.line{

    border-top:1px dashed #000;

    margin:10px 0;

}

table{

    width:100%;

    border-collapse:collapse;

    font-size:11px;

}

th,td{

    padding:4px 2px;

    text-align:left;

}

.total{

    font-size:17px;

    font-weight:bold;

    text-align:right;

    margin-top:10px;

}

.footer{

    text-align:center;

    margin-top:20px;

    font-size:12px;

}

@media print{

    body{

        width:80mm;

    }

}

</style>

</head>

<body>


<div class="center">

<div class="logo">
GOLDBIZNA
</div>

<div>
Business Management System
</div>

</div>


<div class="line"></div>


<div class="small">

Receipt No:
${receipt.number}

<br>

Date:
${receipt.date}

<br>

Time:
${receipt.time}

</div>


<div class="line"></div>


<table>

<thead>

<tr>

<th>Item</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

</tr>

</thead>


<tbody>

${itemsHTML}

</tbody>

</table>


<div class="line"></div>


<div class="total">

TOTAL:
KSh ${receipt.total.toLocaleString()}

</div>


<div class="line"></div>


<div class="footer">

Thank you for shopping with Goldbizna!

<br><br>

Please come again.

</div>


<script>

window.onload=function(){

    setTimeout(function(){

        window.print();

    },300);

};

<\/script>


</body>

</html>

`;


    const printWindow =
        window.open(
            "",
            "_blank",
            "width=420,height=700"
        );


    if(!printWindow){

        alert(
            "Printing was blocked by your browser. " +
            "Allow pop-ups for this Goldbizna website."
        );

        return;
    }


    printWindow.document.open();

    printWindow.document.write(
        receiptHTML
    );

    printWindow.document.close();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    sessionStorage.removeItem("gb_login");

    window.location.href =
        "login.html";

}


/* =========================
   SECURITY / DISPLAY HELPER
========================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadProducts();

renderCart();

</script>

</body>
</html>
