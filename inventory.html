<style>

    padding:0;

body{

}

header{
    background:#087a0b;
    color:white;

}

.header{

    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.logo{

    font-weight:bold;
}

.subtitle{

    opacity:.9;
    margin-top:4px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

.dashboard{
    background:#075c07;
    color:white;
}

.logout{
    background:#c62828;
    color:white;
}

.container{
    max-width:1400px;
    margin:20px auto;
    padding:0 14px;

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{

    font-size:20px;

    margin-bottom:15px;

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd5cf;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

input:focus{

}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.add{

    color:white;
}

.cancel{
    background:#777;
    color:white;
}

.export{
    background:#1565c0;
    color:white;
}

.message{
    margin-top:12px;
    min-height:22px;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.summary-card h3{
    color:#087a0b;
    margin-bottom:8px;
}

.summary-card strong{
    font-size:25px;
}

.search-box{
    margin-bottom:18px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

.table-wrap{
    overflow-x:auto;
}

th{
    background:#087a0b;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f7faf7;
}

.low{
    color:#c62828;
    font-weight:bold;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:800px){
    .form-grid{
        grid-template-columns:1fr 1fr;
    }

    .summary{

    }

@media(max-width:550px){

        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:20px;
    }

</head>

<script>

/* =====================================================
   GOLDBIZNA INVENTORY
   Shared with POS
   ===================================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];
let editingId = null;


/* =====================================================
   NUMBER
   ===================================================== */

function safeNumber(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;
}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return safeNumber(value).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );
}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory(){

    const saved =
        localStorage.getItem(INVENTORY_KEY);

    if(!saved){

        inventory = [];

        return;
    }

    try{

        const data = JSON.parse(saved);

        if(Array.isArray(data)){

            inventory = data;

        }else{

            inventory = [];

        }

    }catch(error){

        console.error(
            "Inventory error:",
            error
        );

        inventory = [];
    }
}


/* =====================================================
   SAVE INVENTORY
   ===================================================== */

function saveInventory(){

    try{

        localStorage.setItem(
            INVENTORY_KEY,
            JSON.stringify(inventory)
        );

        /* Verify that saving actually worked */

        const check =
            localStorage.getItem(INVENTORY_KEY);

        if(!check){

            throw new Error(
                "Storage verification failed"
            );
        }

        return true;

    }catch(error){

        console.error(
            "Save error:",
            error
        );

        alert(
            "Could not save the product. Please check your browser storage."
        );

        return false;
    }
}


/* =====================================================
   SAVE PRODUCT
   ===================================================== */

function saveProduct(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const buyingValue =
        document.getElementById("buyingPrice")
        .value;

    const sellingValue =
        document.getElementById("sellingPrice")
        .value;

    const quantityValue =
        document.getElementById("quantity")
        .value;

    const lowStockValue =
        document.getElementById("lowStock")
        .value;


    /* VALIDATION */

    if(name === ""){

        alert("Please enter the product name.");

        document.getElementById("name").focus();

        return;
    }


    if(category === ""){

        alert("Please enter the category.");

        document.getElementById("category").focus();

        return;
    }


    if(
        buyingValue === "" ||
        Number(buyingValue) < 0
    ){

        alert("Please enter a valid buying price.");

        document.getElementById("buyingPrice").focus();

        return;
    }


    if(
        sellingValue === "" ||
        Number(sellingValue) < 0
    ){

        alert("Please enter a valid selling price.");

        document.getElementById("sellingPrice").focus();

        return;
    }


    if(
        quantityValue === "" ||
        Number(quantityValue) < 0
    ){

        alert("Please enter the stock quantity.");

        document.getElementById("quantity").focus();

        return;
    }


    if(
        lowStockValue === "" ||
        Number(lowStockValue) < 0
    ){

        alert("Please enter the low-stock level.");

        document.getElementById("lowStock").focus();

        return;
    }


    const buyingPrice =
        Number(buyingValue);

    const sellingPrice =
        Number(sellingValue);

    const quantity =
        Number(quantityValue);

    const lowStock =
        Number(lowStockValue);


    /* DUPLICATE CHECK */

    const duplicate =
        inventory.some(function(product){

            return(
                String(product.name || "")
                .toLowerCase()
                ===
                name.toLowerCase()
                &&
                String(product.id)
                !==
                String(editingId)
            );

        });


    if(duplicate){

        alert(
            "This product already exists."
        );

        return;
    }


    /* UPDATE EXISTING */

    if(editingId !== null){

        const index =
            inventory.findIndex(function(product){

                return String(product.id)
                    ===
                    String(editingId);

            });


        if(index === -1){

            alert(
                "Product could not be found."
            );

            return;
        }


        inventory[index].name =
            name;

        inventory[index].category =
            category;

        inventory[index].buyingPrice =
            buyingPrice;

        inventory[index].sellingPrice =
            sellingPrice;

        inventory[index].quantity =
            quantity;

        inventory[index].lowStock =
            lowStock;

    }

    /* ADD NEW */

    else{

        const product = {

            id:
                Date.now().toString()
                +
                Math.random()
                .toString(36)
                .substring(2,8),

            name:
                name,

            category:
                category,

            buyingPrice:
                buyingPrice,

            sellingPrice:
                sellingPrice,

            quantity:
                quantity,

            lowStock:
                lowStock,

            created:
                new Date().toISOString()

        };


        inventory.push(product);
    }


    /* SAVE */

    const saved =
        saveInventory();


    if(!saved){

        return;
    }


    /* SUCCESS */

    showMessage(
        editingId === null
        ? "✓ Product added successfully!"
        : "✓ Product updated successfully!",
        "#087a0b"
    );


    editingId = null;

    clearForm();

    updateForm();

    displayProducts();
}


/* =====================================================
   DISPLAY PRODUCTS
   ===================================================== */

function displayProducts(){

    const body =
        document.getElementById(
            "inventoryBody"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        inventory.filter(function(product){

            const name =
                String(
                    product.name || ""
                )
                .toLowerCase();

            const category =
                String(
                    product.category || ""
                )
                .toLowerCase();

            return(
                name.includes(search)
                ||
                category.includes(search)
            );

        });


    body.innerHTML = "";


    if(filtered.length === 0){

        body.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    ${
                        inventory.length === 0
                        ?
                        "No products yet. Add your first product above."
                        :
                        "No products match your search."
                    }

                </td>

            </tr>

        `;

        updateSummary();

        return;
    }


    filtered.forEach(function(product,index){

        const stock =
            safeNumber(
                product.quantity ??
                product.qty ??
                product.stock
            );

        const buying =
            safeNumber(
                product.buyingPrice ??
                product.buy
            );

        const selling =
            safeNumber(
                product.sellingPrice ??
                product.sell ??
                product.price
            );

        const low =
            safeNumber(
                product.lowStock ?? 5
            );


        const profit =
            (selling - buying) * stock;


        const isLow =
            stock <= low;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                <strong>
                    ${escapeHTML(product.name)}
                </strong>
            </td>

            <td>
                ${escapeHTML(product.category)}
            </td>

            <td>
                KSh ${money(buying)}
            </td>

            <td>
                KSh ${money(selling)}
            </td>

            <td
                class="${isLow ? "low" : "good"}">

                ${stock}

            </td>

            <td
                class="${profit >= 0 ? "good" : "low"}">

                KSh ${money(profit)}

            </td>

            <td
                class="${isLow ? "low" : "good"}">

                ${
                    isLow
                    ?
                    "LOW STOCK"
                    :
                    "IN STOCK"
                }

            </td>

            <td>

                <button
                    type="button"
                    class="edit"
                    onclick="editProduct('${escapeHTML(product.id)}')">

                    Edit

                </button>

                <button
                    type="button"
                    class="delete"
                    onclick="deleteProduct('${escapeHTML(product.id)}')">

                    Delete

                </button>

            </td>

        `;


        body.appendChild(row);

    });


    updateSummary();
}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    let totalStock = 0;
    let stockValue = 0;


    inventory.forEach(function(product){

        const quantity =
            safeNumber(
                product.quantity ??
                product.qty ??
                product.stock
            );

        const buying =
            safeNumber(
                product.buyingPrice ??
                product.buy
            );


        totalStock += quantity;

        stockValue +=
            quantity * buying;

    });


    document.getElementById(
        "totalProducts"
    ).textContent =
        inventory.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        totalStock;


    document.getElementById(
        "stockValue"
    ).textContent =
        "KSh " + money(stockValue);
}


/* =====================================================
   EDIT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id)
                ===
                String(id);

        });


    if(!product){

        alert(
            "Product not found."
        );

        return;
    }


    editingId =
        product.id;


    document.getElementById("name").value =
        product.name || "";

    document.getElementById("category").value =
        product.category || "";

    document.getElementById("buyingPrice").value =
        product.buyingPrice ?? "";

    document.getElementById("sellingPrice").value =
        product.sellingPrice ?? "";

    document.getElementById("quantity").value =
