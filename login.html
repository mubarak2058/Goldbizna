<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Login</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#087a0b,#003f06);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;
max-width:410px;
background:#fff;
padding:30px 25px;
border-radius:18px;
box-shadow:0 10px 35px #0006;
text-align:center
}
.logo{
font-size:27px;
font-weight:bold;
color:#087a0b;
margin-bottom:5px
}
.sub{
color:#666;
margin-bottom:25px
}
input{
width:100%;
padding:15px;
margin:7px 0;
border:1px solid #ccc;
border-radius:9px;
font-size:16px;
outline:none
}
input:focus{border-color:#087a0b}
button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:9px;
background:#087a0b;
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer
}
button:disabled{opacity:.6}
#status{
margin-top:16px;
padding:12px;
border-radius:9px;
display:none;
font-weight:bold;
word-break:break-word
}
.success{
background:#e5f7e7;
color:#087a0b
}
.error{
background:#ffe7e7;
color:#b00000
}
</style>
</head>

<body>

<div class="box">

<div class="logo">MABROUK TRADER'S</div>
<div class="sub">Business Management System</div>

<input
id="email"
type="email"
value="mubarakjumamasoud@gmail.com"
placeholder="Email"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password">

<button id="loginBtn">LOGIN</button>

<div id="status"></div>

</div>

<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
signInWithEmailAndPassword
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
doc,
setDoc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyA8XB6aY45-yHT0uZ6NUhptMoNkYqgwqOs",
authDomain:"goldbizna.firebaseapp.com",
projectId:"goldbizna",
storageBucket:"goldbizna.firebasestorage.app",
messagingSenderId:"559981054862",
appId:"1:559981054862:web:0635c689607d3baa3272df",
measurementId:"G-95XL3BNQJF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* YOUR OWNER ACCOUNT */

const OWNER_UID="szplJ5HPQWbysc7mkBWN1KPVwC22";
const OWNER_EMAIL="mubarakjumamasoud@gmail.com";


/* ALL OWNER PERMISSIONS */

const OWNER_PERMISSIONS={
Dashboard:true,
POS:true,
Inventory:true,
Customers:true,
"Sales History":true,
Reports:true,
Savings:true,
Payments:true,
Discounts:true,
"Refunds/Voids":true,
"Stock Adjustments":true,
"User Management":true,
Settings:true,
"Backup & Restore":true
};


const emailBox=document.getElementById("email");
const passwordBox=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const statusBox=document.getElementById("status");


function showStatus(text,success=false){

statusBox.textContent=text;
statusBox.style.display="block";

if(success){
statusBox.className="success";
}else{
statusBox.className="error";
}

}


/* LOGIN */

async function login(){

const email=emailBox.value.trim();
const password=passwordBox.value;

if(!email){
showStatus("Please enter your email.");
return;
}

if(!password){
showStatus("Please enter your password.");
return;
}

loginBtn.disabled=true;
loginBtn.textContent="LOGGING IN...";
statusBox.style.display="none";


try{

/* FIREBASE AUTH */

const result=await signInWithEmailAndPassword(
auth,
email,
password
);

const user=result.user;


/*
OWNER ACCOUNT
If Firebase UID matches your account,
automatically create/update the profile.
*/

if(
user.uid===OWNER_UID &&
user.email===OWNER_EMAIL
){

await setDoc(
doc(db,"users",OWNER_UID),
{
uid:OWNER_UID,
fullName:"Mubarak",
username:"admin",
email:OWNER_EMAIL,
phone:"",
role:"Owner/Admin",
status:"active",
permissions:OWNER_PERMISSIONS,
updatedAt:serverTimestamp()
},
{merge:true}
);


/* USERNAME */

await setDoc(
doc(db,"usernames","admin"),
{
uid:OWNER_UID,
email:OWNER_EMAIL,
username:"admin",
updatedAt:serverTimestamp()
},
{merge:true}
);


/* SAVE LOGIN SESSION */

localStorage.setItem(
"goldbizna_logged_in",
"true"
);

localStorage.setItem(
"goldbizna_uid",
OWNER_UID
);

localStorage.setItem(
"goldbizna_username",
"admin"
);

localStorage.setItem(
"goldbizna_role",
"Owner/Admin"
);


showStatus(
"✅ Welcome Mubarak — Owner/Admin",
true
);

loginBtn.textContent="LOGIN SUCCESSFUL";

setTimeout(()=>{
window.location.replace("index.html");
},1000);

return;
}


/*
OTHER USERS
*/

showStatus(
"Firebase login successful, but this account is not registered in MABROUK TRADER'S."
);

loginBtn.disabled=false;
loginBtn.textContent="LOGIN";


}catch(error){

console.error(error);

let message="Login failed.";

if(error.code==="auth/invalid-credential"){
message="❌ Incorrect email or password.";
}
else if(error.code==="auth/user-not-found"){
message="❌ Firebase account was not found.";
}
else if(error.code==="auth/wrong-password"){
message="❌ Incorrect password.";
}
else if(error.code==="auth/user-disabled"){
message="❌ This Firebase account is disabled.";
}
else{
message="❌ "+error.code+" — "+error.message;
}

showStatus(message);

passwordBox.value="";
passwordBox.focus();

loginBtn.disabled=false;
loginBtn.textContent="LOGIN";

}

}


/* BUTTON */

loginBtn.addEventListener("click",login);


/* ENTER KEY */

passwordBox.addEventListener("keydown",e=>{
if(e.key==="Enter"){
login();
}
});

</script>

</body>
</html>
