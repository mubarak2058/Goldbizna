</div></div><div class="container"><div id="message" class="message"></div><div class="summary"><div class="stat">
<div id="productCount" class="stat-number">0</div>
<div class="stat-label">Products</div>

<div class="table-wrapper"><table><thead><tr>
<th>Product</th>
<th>Category</th>
<th>Buying</th>
<th>Selling</th>
<th>Quantity</th>
<th>Low Stock</th>
<th>Action</th>
</tr></thead><tbody id="tableBody"><tr>
<td colspan="7" class="empty">
No products yet.
</td>
</tr></tbody></table></div></div></div><script>

/* =========================================
   GOLD BIZNA INVENTORY
   ========================================= */

const STORAGE_KEY = "goldbizna_inventory";

let products = [];

let editId = null;


/* =========================================
   LOGOUT
   ========================================= */

function logout(){

    localStorage.removeItem("loggedIn");

    sessionStorage.removeItem("gb_login");

    location.href = "login.html";

}


/* =========================================
   MONEY
   ========================================= */

function money(number){

    return Number(number || 0).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =========================================
   MESSAGE
   ========================================= */

function message(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent =
        text;

    setTimeout(function(){

        box.className =
            "message";

    },3000);

}


/* =========================================
   LOAD
   ========================================= */

function loadProducts(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(!saved){

        products = [];

    }

    else{

        try{

            const data =
                JSON.parse(saved);

            products =
                Array.isArray(data)
                ? data
                : [];

        }

        catch(error){

            products = [];

        }

    }

    displayProducts();

}


/* =========================================
   SAVE
   ========================================= */

function saveProducts(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(products)
    );

}


/* =========================================
   ADD PRODUCT
   ========================================= */

function addProduct(){

    const name =
        document.getElementById("name")
        .value.trim();

    const category =
        document.getElementById("category")
        .value.trim();

    const buying =
        parseFloat(
            document.getElementById("buying")
            .value
        );

    const selling =
        parseFloat(
            document.getElementById("selling")
            .value
        );

    const quantity =
        parseInt(
            document.getElementById("quantity")
            .value,
            10
        );

    const lowStock =
        parseInt(
            document.getElementById("lowStock")
            .value,
            10
        );


    /* VALIDATION */

    if(name === ""){

        message(
            "Enter the product name.",
            "error"
        );

        document
        .getElementById("name")
        .focus();

        return;

    }


    if(isNaN(buying) || buying < 0){

        message(
            "Enter a valid buying price.",
            "error"
        );

        return;

    }


    if(isNaN(selling) || selling < 0){

        message(
            "Enter a valid selling price.",
            "error"
        );

        return;

    }


    if(isNaN(quantity) || quantity < 0){

        message(
            "Enter a valid quantity.",
            "error"
        );

        return;

    }


    if(isNaN(lowStock) || lowStock < 0){

        message(
            "Enter a valid low-stock level.",
            "error"
        );

        return;

    }


    /* EDIT */

    if(editId !== null){

        const index =
            products.findIndex(function(product){

                return String(product.id) ===
                       String(editId);

            });


        if(index !== -1){

            products[index].name =
                name;

            products[index].category =
                category;

            products[index].buyingPrice =
                buying;

            products[index].sellingPrice =
                selling;

            products[index].quantity =
                quantity;

            products[index].lowStock =
                lowStock;

        }


        saveProducts();

        message(
            "Product updated successfully.",
            "success"
        );

    }

    else{

        /* NEW PRODUCT */

        const product = {

            id:
                "P-" +
                Date.now() +
                "-" +
                Math.floor(
                    Math.random() * 100000
                ),

            name:
                name,

            category:
                category,

            buyingPrice:
                buying,

            sellingPrice:
                selling,

            quantity:
                quantity,

            lowStock:
                lowStock

        };


        products.push(product);


        saveProducts();


        message(
            "✅ Product added successfully!",
            "success"
        );

    }


    clearForm();

    displayProducts();

}


/* =========================================
   DISPLAY
   ========================================= */

function displayProducts(){

    const body =
        document.getElementById("tableBody");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const results =
        products.filter(function(product){

            return (

                String(product.name || "")
                .toLowerCase()
                .includes(search)

                ||

                String(product.category || "")
                .toLowerCase()
                .includes(search)

            );

        });


    if(results.length === 0){

        body.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="empty">

                No products found.

            </td>

        </tr>

        `;

    }

    else{

        let html = "";


        results.forEach(function(product){

            const quantity =
                Number(product.quantity || 0);

            const low =
                Number(product.lowStock || 5);


            let stockClass =
                "good";

            let stockText =
                quantity;


            if(quantity <= 0){

                stockClass =
                    "out";

                stockText =
                    "OUT";

            }

            else if(quantity <= low){

                stockClass =
                    "low";

            }


            html += `

            <tr>

                <td>
                    <strong>
                    ${safe(product.name)}
                    </strong>
                </td>

                <td>
                    ${safe(product.category || "-")}
                </td>

                <td>
                    KSh ${money(product.buyingPrice)}
                </td>

                <td>
                    KSh ${money(product.sellingPrice)}
                </td>

                <td class="${stockClass}">
                    ${stockText}
                </td>

                <td>
                    ${low}
                </td>

                <td>

                    <button
                        class="edit"
                        onclick="editProduct('${product.id}')">

                        Edit

                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct('${product.id}')">

                        Delete

                    </button>

                </td>

            </tr>

            `;

        });


        body.innerHTML =
            html;

    }


    updateStats();

}


/* =========================================
   SAFE TEXT
   ========================================= */

function safe(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   EDIT
   ========================================= */

function editProduct(id){

    const product =
        products.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        return;

    }


    editId =
        product.id;


    document.getElementById("name")
        .value =
        product.name || "";

    document.getElementById("category")
        .value =
        product.category || "";

    document.getElementById("buying")
        .value =
        product.buyingPrice || 0;

    document.getElementById("selling")
        .value =
        product.sellingPrice || 0;

    document.getElementById("quantity")
        .value =
        product.quantity || 0;

    document.getElementById("lowStock")
        .value =
        product.lowStock ?? 5;


    document.getElementById("formTitle")
        .innerText =
        "✏️ Edit Product";


    document.getElementById("addButton")
        .innerText =
        "💾 UPDATE PRODUCT";


    document.getElementById("cancelButton")
        .style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   DELETE
   ========================================= */

function deleteProduct(id){

    const product =
        products.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        return;

    }


    if(!confirm(
        "Delete " +
        product.name +
        "?"
    )){

        return;

    }


    products =
        products.filter(function(item){

            return String(item.id) !==
                   String(id);

        });


    saveProducts();

    displayProducts();

    message(
        "Product deleted.",
        "success"
    );

}


/* =========================================
   CLEAR FORM
   ========================================= */

function clearForm(){

    document.getElementById("name")
        .value = "";

    document.getElementById("category")
        .value = "";

    document.getElementById("buying")
        .value = "";

    document.getElementById("selling")
        .value = "";

    document.getElementById("quantity")
        .value = "";

    document.getElementById("lowStock")
        .value = "5";


    editId = null;


    document.getElementById("formTitle")
        .innerText =
        "➕ Add New Product";


    document.getElementById("addButton")
        .innerText =
        "➕ ADD PRODUCT";


    document.getElementById("cancelButton")
        .style.display =
        "none";

}


/* =========================================
   CANCEL EDIT
   ========================================= */

function cancelEdit(){

    clearForm();

}


/* =========================================
   STATISTICS
   ========================================= */

function updateStats(){

    let units = 0;

    let value = 0;


    products.forEach(function(product){

        const quantity =
            Number(product.quantity || 0);

        const buying =
            Number(product.buyingPrice || 0);


        units +=
            quantity;

        value +=
            quantity *
            buying;

    });


    document.getElementById(
        "productCount"
    ).innerText =
        products.length;


    document.getElementById(
        "unitCount"
    ).innerText =
        units;


    document.getElementById(
        "stockValue"
    ).innerText =
        "KSh " +
        money(value);

}


/* =========================================
   SEARCH
   ========================================= */

document
.getElementById("search")
.addEventListener(
    "input",
    displayProducts
);


/* =========================================
   START
   ========================================= */

loadProducts();

</script></body>
