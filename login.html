<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Login</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#087a0b,#004d07);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.login{
width:100%;
max-width:400px;
background:#fff;
border-radius:18px;
padding:28px;
box-shadow:0 10px 35px #0005;
text-align:center
}
.logo{
font-size:27px;
font-weight:bold;
color:#087a0b;
margin-bottom:5px
}
.sub{
color:#666;
margin-bottom:25px
}
input{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ccc;
border-radius:9px;
font-size:16px;
outline:none
}
input:focus{border-color:#087a0b}
button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:9px;
background:#087a0b;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer
}
button:disabled{opacity:.6}
#msg{
margin-top:15px;
padding:11px;
border-radius:8px;
display:none;
font-weight:bold
}
.ok{background:#e5f7e7;color:#087a0b}
.err{background:#ffe7e7;color:#b00000}
</style>
</head>

<body>

<div class="login">

<div class="logo">MABROUK TRADER'S</div>
<div class="sub">Secure Business Login</div>

<input id="username" type="text"
placeholder="Username or Email"
autocomplete="username">

<input id="password" type="password"
placeholder="Password"
autocomplete="current-password">

<button id="loginBtn">LOGIN</button>

<div id="msg"></div>

</div>

<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
signInWithEmailAndPassword,
signOut
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
doc,
getDoc
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA8XB6aY45-yHT0uZ6NUhptMoNkYqgwqOs",
authDomain:"goldbizna.firebaseapp.com",
projectId:"goldbizna",
storageBucket:"goldbizna.firebasestorage.app",
messagingSenderId:"559981054862",
appId:"1:559981054862:web:0635c689607d3baa3272df",
measurementId:"G-95XL3BNQJF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const username=document.getElementById("username");
const password=document.getElementById("password");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function message(text,type="err"){
msg.textContent=text;
msg.className=type;
msg.style.display="block";
}

async function findEmail(value){

value=value.trim();

if(value.includes("@")) return value;

const ref=doc(db,"usernames",value.toLowerCase());
const snap=await getDoc(ref);

if(!snap.exists()) return null;

return snap.data().email||null;
}

async function login(){

const name=username.value.trim();
const pass=password.value;

if(!name||!pass){
message("Enter your username and password.");
return;
}

btn.disabled=true;
btn.textContent="LOGGING IN...";
msg.style.display="none";

try{

const email=await findEmail(name);

if(!email){
throw new Error("Username was not found.");
}

const result=await signInWithEmailAndPassword(
auth,
email,
pass
);

const user=result.user;

const profileRef=doc(db,"users",user.uid);
const profileSnap=await getDoc(profileRef);

if(!profileSnap.exists()){

await signOut(auth);

throw new Error(
"Your Firebase account exists, but your MABROUK TRADER'S user profile has not been created yet."
);
}

const profile=profileSnap.data();

if(profile.status==="disabled"){

await signOut(auth);

throw new Error(
"Your account has been disabled. Contact the Owner."
);
}

localStorage.setItem(
"goldbizna_username",
profile.username||name
);

localStorage.setItem(
"goldbizna_uid",
user.uid
);

localStorage.setItem(
"goldbizna_role",
profile.role||""
);

localStorage.setItem(
"goldbizna_logged_in",
"true"
);

message(
"Welcome "+(profile.fullName||profile.username||"")+
" — "+(profile.role||"User"),
"ok"
);

setTimeout(()=>{
window.location.href="index.html";
},700);

}catch(error){

console.error(error);

let text=error.message;

if(error.code==="auth/invalid-credential"){
text="Incorrect username/email or password.";
}

if(error.code==="auth/user-disabled"){
text="This Firebase account has been disabled.";
}

message("❌ "+text);

password.value="";
password.focus();

btn.disabled=false;
btn.textContent="LOGIN";
}

}

btn.addEventListener("click",login);

password.addEventListener("keydown",e=>{
if(e.key==="Enter")login();
});

username.addEventListener("keydown",e=>{
if(e.key==="Enter")password.focus();
});

</script>

</body>
</html>
