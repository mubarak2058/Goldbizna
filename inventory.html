<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#087a0b;
    color:white;
    padding:14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px #0002;
}

.header{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.9;
    margin-top:3px;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.header-buttons button{
    border:0;
    padding:10px 14px;
    border-radius:6px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.dashboard{
    background:#075f08;
}

.logout{
    background:#c62828;
}

.container{
    width:95%;
    max-width:1400px;
    margin:18px auto;
}

.card{
    background:white;
    border-radius:10px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 9px #00000012;
}

.title{
    color:#087a0b;
    font-size:20px;
    font-weight:bold;
    margin-bottom:14px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccd4ce;
    border-radius:6px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#087a0b;
    box-shadow:0 0 0 2px #087a0b18;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:6px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}

.save{
    background:#087a0b;
    color:white;
}

.cancel{
    background:#777;
    color:white;
    display:none;
}

.export{
    background:#1565c0;
    color:white;
}

.search-box{
    margin-bottom:15px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    padding:17px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px #00000012;
}

.summary-card h3{
    color:#087a0b;
    font-size:14px;
    margin-bottom:7px;
}

.summary-card strong{
    font-size:22px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#087a0b;
    color:white;
    padding:11px;
    text-align:left;
    font-size:13px;
}

td{
    padding:10px;
    border-bottom:1px solid #e3e7e4;
    font-size:13px;
}

tr:hover{
    background:#f7faf7;
}

.low{
    color:#c62828;
    font-weight:bold;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:4px;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

#message{
    margin-top:10px;
    font-weight:bold;
    min-height:18px;
}

@media(max-width:900px){
    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr 1fr;
    }

    .logo{
        font-size:20px;
    }
}
</style>
</head>

<body>

<script>
/* LOGIN PROTECTION */
if(
    localStorage.getItem("loggedIn") !== "true" &&
    sessionStorage.getItem("gb_login") !== "1"
){
    window.location.href="login.html";
}
</script>

<header>
    <div class="header">

        <div>
            <div class="logo">GOLDBIZNA INVENTORY</div>
            <div class="subtitle">Fast Product & Stock Management</div>
        </div>

        <div class="header-buttons">
            <button
                class="dashboard"
                onclick="location.href='dashboard.html'">
                Dashboard
            </button>

            <button
                class="logout"
                onclick="logout()">
                Logout
            </button>
        </div>

    </div>
</header>

<div class="container">

    <!-- PRODUCT FORM -->

    <div class="card">

        <div class="title" id="formTitle">
            Add New Product
        </div>

        <div class="form-grid">

            <input
                id="name"
                type="text"
                placeholder="Product name">

            <input
                id="category"
                type="text"
                placeholder="Category">

            <input
                id="buyingPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="Buying price">

            <input
                id="sellingPrice"
                type="number"
                min="0"
                step="0.01"
                placeholder="Selling price">

            <input
                id="quantity"
                type="number"
                min="0"
                step="1"
                placeholder="Stock quantity">

            <input
                id="lowStock"
                type="number"
                min="0"
                step="1"
                value="5"
                placeholder="Low stock level">

        </div>

        <div class="buttons">

            <button
                class="save"
                id="saveButton"
                onclick="saveProduct()">
                + Add Product
            </button>

            <button
                class="cancel"
                id="cancelButton"
                onclick="cancelEdit()">
                Cancel
            </button>

            <button
                class="export"
                onclick="exportInventory()">
                Export CSV
            </button>

        </div>

        <div id="message"></div>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-card">
            <h3>PRODUCTS</h3>
            <strong id="totalProducts">0</strong>
        </div>

        <div class="summary-card">
            <h3>TOTAL STOCK</h3>
            <strong id="totalStock">0</strong>
        </div>

        <div class="summary-card">
            <h3>STOCK VALUE</h3>
            <strong id="stockValue">KSh 0</strong>
        </div>

        <div class="summary-card">
            <h3>POTENTIAL PROFIT</h3>
            <strong id="profitValue">KSh 0</strong>
        </div>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <input
            id="search"
            class="search-box"
            type="search"
            placeholder="🔎 Search product or category..."
            autocomplete="off">

    </div>


    <!-- PRODUCTS -->

    <div class="card">

        <div class="title">
            Products
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Buying</th>
                        <th>Selling</th>
                        <th>Stock</th>
                        <th>Profit</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="inventoryBody"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOLDBIZNA INVENTORY
   Shared storage with POS
===================================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];
let editingId = null;


/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return Number(value || 0).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD
===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(INVENTORY_KEY);

        if(!saved){

            inventory=[];

            return;

        }

        const data =
            JSON.parse(saved);

        if(Array.isArray(data)){

            inventory=data.map(normalizeProduct);

        }else{

            inventory=[];

        }

    }catch(error){

        console.error(error);

        inventory=[];

    }

}


/* =====================================================
   NORMALIZE PRODUCT
   Keeps POS and Inventory compatible
===================================================== */

function normalizeProduct(product){

    return {

        id:
            product.id ??
            Date.now()+Math.random(),

        name:
            String(product.name || ""),

        category:
            String(product.category || ""),

        buyingPrice:
            Number(
                product.buyingPrice ??
                product.buy ??
                0
            ),

        sellingPrice:
            Number(
                product.sellingPrice ??
                product.sell ??
                product.price ??
                0
            ),

        quantity:
            Number(
                product.quantity ??
                product.qty ??
                product.stock ??
                0
            ),

        lowStock:
            Number(
                product.lowStock ??
                5
            ),

        created:
            product.created ||
            new Date().toLocaleString()

    };

}


/* =====================================================
   SAVE
===================================================== */

function saveInventory(){

    localStorage.setItem(
        INVENTORY_KEY,
        JSON.stringify(inventory)
    );

}


/* =====================================================
   ADD / UPDATE
===================================================== */

function saveProduct(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const buying =
        Number(
            document.getElementById("buyingPrice").value
        );

    const selling =
        Number(
            document.getElementById("sellingPrice").value
        );

    const quantity =
        Number(
            document.getElementById("quantity").value
        );

    const lowStock =
        Number(
            document.getElementById("lowStock").value
        );


    /* VALIDATION */

    if(!name){

        alert("Enter the product name.");

        document.getElementById("name").focus();

        return;

    }

    if(!category){

        alert("Enter the category.");

        document.getElementById("category").focus();

        return;

    }

    if(!Number.isFinite(buying) || buying<0){

        alert("Enter a valid buying price.");

        return;

    }

    if(!Number.isFinite(selling) || selling<0){

        alert("Enter a valid selling price.");

        return;

    }

    if(!Number.isInteger(quantity) || quantity<0){

        alert("Enter a valid stock quantity.");

        return;

    }

    if(!Number.isInteger(lowStock) || lowStock<0){

        alert("Enter a valid low-stock level.");

        return;

    }


    /* DUPLICATE */

    const duplicate =
        inventory.some(function(product){

            return(
                product.name.toLowerCase() ===
                name.toLowerCase() &&
                String(product.id) !==
                String(editingId)
            );

        });


    if(duplicate){

        alert("That product already exists.");

        return;

    }


    /* UPDATE */

    if(editingId !== null){

        const index =
            inventory.findIndex(function(product){

                return String(product.id) ===
                       String(editingId);

            });


        if(index !== -1){

            inventory[index] = {

                ...inventory[index],

                name:name,

                category:category,

                buyingPrice:buying,

                sellingPrice:selling,

                quantity:quantity,

                lowStock:lowStock

            };

        }

        showMessage("✓ Product updated successfully.");

    }

    /* NEW */

    else{

        inventory.push({

            id:
                Date.now().toString(),

            name:name,

            category:category,

            buyingPrice:buying,

            sellingPrice:selling,

            quantity:quantity,

            lowStock:lowStock,

            created:
                new Date().toLocaleString()

        });

        showMessage("✓ Product saved instantly.");

    }


    /* SAVE */

    saveInventory();


    /* REFRESH */

    editingId=null;

    clearForm();

    displayProducts();


    /*
       Put cursor back into product name
       so another product can be entered quickly.
    */

    document.getElementById("name").focus();

}


/* =====================================================
   DISPLAY
===================================================== */

function displayProducts(){

    const body =
        document.getElementById("inventoryBody");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        inventory.filter(function(product){

            return(
                product.name
                .toLowerCase()
                .includes(search)
                ||
                product.category
                .toLowerCase()
                .includes(search)
            );

        });


    if(filtered.length===0){

        body.innerHTML=`

            <tr>
                <td colspan="9" class="empty">
                    ${
                        inventory.length===0
                        ? "No products yet. Add your first product above."
                        : "No products match your search."
                    }
                </td>
            </tr>

        `;

    }else{

        body.innerHTML =
            filtered.map(function(product,index){

                const stock =
                    Number(product.quantity);

                const buying =
                    Number(product.buyingPrice);

                const selling =
                    Number(product.sellingPrice);

                const profitPerItem =
                    selling-buying;

                const totalProfit =
                    profitPerItem*stock;

                const low =
                    stock <=
                    Number(product.lowStock);


                return `

                    <tr>

                        <td>
                            ${index+1}
                        </td>

                        <td>
                            <strong>
                                ${escapeHTML(product.name)}
                            </strong>
                        </td>

                        <td>
                            ${escapeHTML(product.category)}
                        </td>

                        <td>
                            KSh ${money(buying)}
                        </td>

                        <td>
                            KSh ${money(selling)}
                        </td>

                        <td class="${low?"low":"good"}">
                            ${stock}
                        </td>

                        <td class="${totalProfit<0?"low":"good"}">
                            KSh ${money(totalProfit)}
                        </td>

                        <td class="${low?"low":"good"}">
                            ${
                                low
                                ? "LOW STOCK"
                                : "IN STOCK"
                            }
                        </td>

                        <td>

                            <button
                                class="edit"
                                onclick="editProduct('${String(product.id).replace(/'/g,"\\'")}')">
                                Edit
                            </button>

                            <button
                                class="delete"
                                onclick="deleteProduct('${String(product.id).replace(/'/g,"\\'")}')">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    updateSummary();

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    let totalStock=0;
    let stockValue=0;
    let profitValue=0;


    inventory.forEach(function(product){

        const quantity =
            Number(product.quantity);

        const buying =
            Number(product.buyingPrice);

        const selling =
            Number(product.sellingPrice);


        totalStock += quantity;

        stockValue +=
            buying*quantity;

        profitValue +=
            (selling-buying)*quantity;

    });


    document.getElementById(
        "totalProducts"
    ).textContent =
        inventory.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        totalStock;


    document.getElementById(
        "stockValue"
    ).textContent =
        "KSh "+money(stockValue);


    document.getElementById(
        "profitValue"
    ).textContent =
        "KSh "+money(profitValue);

}


/* =====================================================
   EDIT
===================================================== */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){
        return;
    }


    editingId=product.id;


    document.getElementById("name").value =
        product.name;

    document.getElementById("category").value =
        product.category;

    document.getElementById("buyingPrice").value =
        product.buyingPrice;

    document.getElementById("sellingPrice").value =
        product.sellingPrice;

    document.getElementById("quantity").value =
        product.quantity;

    document.getElementById("lowStock").value =
        product.lowStock;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "saveButton"
    ).textContent =
        "✓ Update Product";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    document.getElementById("name").focus();

}


/* =====================================================
   CANCEL
===================================================== */

function cancelEdit(){

    editingId=null;

    clearForm();

}


/* =====================================================
   CLEAR
=======================================
