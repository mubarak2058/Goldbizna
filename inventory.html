<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f5;
}

header{
background:#0b7a0b;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
color:#0b7a0b;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

button{
padding:12px 18px;
background:#0b7a0b;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#086108;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0b7a0b;
color:#fff;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.low{
color:red;
font-weight:bold;
}

.summary{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#0b7a0b;
}
</style>
</head>

<body>

<header>
Goldbizna Inventory
</header>

<div class="container">

<h2>Inventory Management</h2>

<div class="row">

<input id="name" type="text" placeholder="Product Name">

<input id="cat" type="text" placeholder="Category">

<input id="buy" type="number" placeholder="Buying Price">

<input id="sell" type="number" placeholder="Selling Price">

<input id="qty" type="number" placeholder="Quantity">

<button onclick="addItem()">
Save Product
</button>

</div>

<input
id="search"
type="text"
placeholder="Search products..."
onkeyup="render()">

<table>

<thead>

<tr>

<th>Product</th>
<th>Category</th>
<th>Buy</th>
<th>Sell</th>
<th>Quantity</th>
<th>Action</th>

</tr>

</thead>

<tbody id="tb">

</tbody>

</table>

<div class="summary">

Stock Value:
<span id="stockValue">KSh 0</span>

</div>

</div>

<script>

let items = JSON.parse(
localStorage.getItem("goldbizna_inventory") || "[]"
);

function save(){

localStorage.setItem(
"goldbizna_inventory",
JSON.stringify(items)
);

render();

  }
function addItem(){

const name=document.getElementById("name");
const cat=document.getElementById("cat");
const buy=document.getElementById("buy");
const sell=document.getElementById("sell");
const qty=document.getElementById("qty");

if(name.value.trim()==""){
alert("Please enter a product name.");
return;
}

items.push({
n:name.value.trim(),
c:cat.value.trim(),
b:Number(buy.value)||0,
s:Number(sell.value)||0,
q:Number(qty.value)||0
});

name.value="";
cat.value="";
buy.value="";
sell.value="";
qty.value="";

save();

alert("Product saved successfully!");

}

function editItem(index){

let item=items[index];

document.getElementById("name").value=item.n;
document.getElementById("cat").value=item.c;
document.getElementById("buy").value=item.b;
document.getElementById("sell").value=item.s;
document.getElementById("qty").value=item.q;

items.splice(index,1);

save();

}

function del(index){

if(confirm("Delete this product?")){

items.splice(index,1);

save();

}

  }
