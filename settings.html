<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna - Settings</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}
header{
    background:#0b7a0b;
    color:#fff;
    text-align:center;
    padding:15px;
    font-size:24px;
}
.container{
    max-width:700px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
h2{
    color:#0b7a0b;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#095f09;
}
a{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0b7a0b;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
Goldbizna Settings
</header>

<div class="container">

<h2>Business Information</h2>

<label>Business Name</label>
<input type="text" value="Goldbizna">

<label>Phone Number</label>
<input type="text" placeholder="+254">

<label>Email</label>
<input type="email" placeholder="business@email.com">

<label>Business Address</label>
<input type="text" placeholder="Enter Address">

<button onclick="saveSettings()">Save Settings</button>

<a href="dashboard.html">← Back to Dashboard</a>

</div>

<script>
function saveSettings(){
    alert("Settings saved successfully.");
}
</script>

</body>
</html>
