<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Settings</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6f3;color:#222}
header{background:#087a0b;color:#fff;padding:15px;font-size:20px;font-weight:bold}
nav{background:#075d08;padding:8px;display:flex;gap:6px;overflow:auto}
nav button{border:0;background:#fff;color:#075d08;padding:9px 13px;border-radius:6px;font-weight:bold}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:#fff;padding:15px;margin-bottom:12px;border-radius:10px;box-shadow:0 1px 5px #bbb}
h2{margin:0 0 12px;color:#087a0b;font-size:18px}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #bbb;border-radius:6px}
button{cursor:pointer}
.primary{background:#087a0b;color:white;border:0;padding:10px 15px;border-radius:6px;font-weight:bold}
.danger{background:#c62828;color:white;border:0;padding:7px 10px;border-radius:5px}
.gray{background:#777;color:#fff;border:0;padding:7px 10px;border-radius:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.perms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.perms label{background:#f1f4f1;padding:8px;border-radius:5px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.status{font-weight:bold}
@media(max-width:650px){.grid,.perms{grid-template-columns:1fr}table{font-size:11px}}
</style>
</head>

<body>
<header>MABROUK TRADER'S — Settings</header>

<nav>
<button onclick="show('users')">Users</button>
<button onclick="show('business')">Business</button>
<button onclick="show('pos')">POS</button>
<button onclick="show('system')">System</button>
<button onclick="show('activity')">Activity</button>
</nav>

<main>

<section id="users" class="card">
<h2>User Management</h2>

<div class="grid">
<input id="fullName" placeholder="Full Name">
<input id="username" placeholder="Username">
<input id="email" type="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<input id="password" type="password" placeholder="Password">
<select id="role">
<option>Owner/Admin</option>
<option>Manager</option>
<option>Cashier</option>
<option>Inventory Staff</option>
<option>Viewer</option>
</select>
</div>

<h3>Permissions</h3>
<div id="permissions" class="perms"></div>

<button class="primary" onclick="saveUser()">➕ Add User</button>
<button class="gray" onclick="clearUser()">Clear</button>

<hr>
<h3>Users</h3>
<div id="usersTable">Loading...</div>
</section>

<section id="business" class="card" style="display:none">
<h2>Business Settings</h2>
<div class="grid">
<input id="bizName" placeholder="Business Name">
<input id="bizPhone" placeholder="Phone">
<input id="bizEmail" placeholder="Email">
<input id="bizLocation" placeholder="Location">
</div>
<textarea id="bizAddress" placeholder="Business Address"></textarea>
<button class="primary" onclick="saveSettings('business')">Save Business</button>
</section>

<section id="pos" class="card" style="display:none">
<h2>POS & Receipt Settings</h2>
<div class="grid">
<input id="currency" placeholder="Currency e.g. KES">
<input id="till" placeholder="Default Till / Counter">
<input id="receiptTitle" placeholder="Receipt Title">
<input id="footerText" placeholder="Receipt Footer">
</div>
<label><input id="showLogo" type="checkbox"> Show logo on receipt</label><br><br>
<label><input id="showCustomer" type="checkbox"> Show customer details</label><br><br>
<button class="primary" onclick="saveSettings('pos')">Save POS Settings</button>
</section>

<section id="system" class="card" style="display:none">
<h2>System Settings</h2>
<div class="grid">
<select id="theme">
<option value="green">Green</option>
<option value="dark">Dark</option>
</select>
<select id="language">
<option>English</option>
<option>Arabic</option>
</select>
</div>
<label><input id="autoBackup" type="checkbox"> Enable automatic backup</label><br><br>
<button class="primary" onclick="saveSettings('system')">Save System</button>
</section>

<section id="activity" class="card" style="display:none">
<h2>Activity Log</h2>
<div id="activityLog">Loading...</div>
</section>

<section class="card">
<h2>Firebase Status</h2>
<div class="status" id="firebaseStatus">Connecting...</div>
</section>

</main>

<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{
getAuth,onAuthStateChanged,createUserWithEmailAndPassword,updateProfile,signOut
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{
getFirestore,doc,getDoc,setDoc,updateDoc,collection,getDocs,addDoc,serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA8XB6aY45-yHT0uZ6NU5gYqgwqOs",
authDomain:"goldbizna.firebaseapp.com",
projectId:"goldbizna",
storageBucket:"goldbizna.firebasestorage.app",
messagingSenderId:"559981054862",
appId:"1:559981054862:web:0635c689607d3baa3272df",
measurementId:"G-95XL3BNQJF"
};

const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const creatorApp=initializeApp(firebaseConfig,"UserCreator");
const creatorAuth=getAuth(creatorApp);

const permissionNames=[
"Dashboard","POS","Inventory","Customers","Sales History",
"Reports","Savings","Payments","Discounts","Refunds / Voids",
"Stock Adjustments","User Management","Settings","Backup & Restore"
];

let currentUser=null,editId=null;
let permissions={};

const pbox=document.getElementById("permissions");

permissionNames.forEach(p=>{
let id="p_"+p.replace(/[^a-z0-9]/gi,"");
pbox.innerHTML+=`<label><input type="checkbox" id="${id}" checked> ${p}</label>`;
permissions[p]=true;
});

function getPermissions(){
let x={};
permissionNames.forEach(p=>{
let id="p_"+p.replace(/[^a-z0-9]/gi,"");
x[p]=document.getElementById(id).checked;
});
return x;
}

function setPermissions(x={}){
permissionNames.forEach(p=>{
let id="p_"+p.replace(/[^a-z0-9]/gi,"");
document.getElementById(id).checked=x[p]!==false;
});
}

window.show=function(id){
["users","business","pos","system","activity"].forEach(x=>{
document.getElementById(x).style.display=x===id?"block":"none";
});
if(id==="activity")loadActivity();
};

window.clearUser=function(){
editId=null;
["fullName","username","email","phone","password"].forEach(x=>document.getElementById(x).value="");
document.getElementById("role").value="Cashier";
setPermissions({});
};

window.saveUser=async function(){
let name=fullName.value.trim(),
username=usernameInput(),
email=emailInput(),
phone=phoneInput(),
pass=password.value,
role=roleInput();

if(!name||!username||!email||(!editId&&!pass)){
alert(editId?"Name, username and email are required.":"Name, username, email and password are required.");
return;
}

try{
if(editId){
await updateDoc(doc(db,"users",editId),{
fullName:name,username,email,phone,role,permissions:getPermissions(),
updatedAt:serverTimestamp()
});
await addLog("Updated user: "+username);
alert("User updated successfully.");
}else{
let snap=await getDocs(collection(db,"users"));
let duplicate=[...snap.docs].some(d=>(d.data().username||"").toLowerCase()===username.toLowerCase());
if(duplicate){alert("Username already exists.");return}

let cred=await createUserWithEmailAndPassword(creatorAuth,email,pass);
await updateProfile(cred.user,{displayName:name});

await setDoc(doc(db,"users",cred.user.uid),{
uid:cred.user.uid,fullName:name,username,email,phone,role,
permissions:getPermissions(),active:true,createdAt:serverTimestamp()
});

await setDoc(doc(db,"usernames",username.toLowerCase()),{
uid:cred.user.uid,email
});

await addLog("Created user: "+username);
await signOut(creatorAuth);
alert("User created successfully.");
}

clearUser();
loadUsers();

}catch(e){
alert("Error: "+e.message);
try{await signOut(creatorAuth)}catch(_){}
}
};

function usernameInput(){return document.getElementById("username").value.trim()}
function emailInput(){return document.getElementById("email").value.trim()}
function phoneInput(){return document.getElementById("phone").value.trim()}
function roleInput(){return document.getElementById("role").value}

window.editUser=async function(id){
let s=await getDoc(doc(db,"users",id));
if(!s.exists())return;
let u=s.data();
editId=id;
fullName.value=u.fullName||"";
username.value=u.username||"";
email.value=u.email||"";
phone.value=u.phone||"";
role.value=u.role||"Cashier";
password.value="";
setPermissions(u.permissions||{});
window.show("users");
scrollTo(0,0);
};

window.toggleUser=async function(id,active){
await updateDoc(doc(db,"users",id),{active});
await addLog((active?"Enabled ":"Disabled ")+id);
loadUsers();
};

async function loadUsers(){
let snap=await getDocs(collection(db,"users"));
let html="<table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr>";

snap.forEach(d=>{
let u=d.data();
html+=`<tr>
<td>${u.fullName||""}</td>
<td>${u.username||""}</td>
<td>${u.role||""}</td>
<td>${u.active===false?"Disabled":"Active"}</td>
<td>
<button class="gray" onclick="editUser('${d.id}')">Edit</button>
<button class="${u.active===false?'primary':'danger'}"
onclick="toggleUser('${d.id}',${u.active===false})">
${u.active===false?"Enable":"Disable"}
</button>
</td></tr>`;
});

document.getElementById("usersTable").innerHTML=html+"</table>";
}

window.saveSettings=async function(type){
let data={updatedAt:serverTimestamp()};

if(type==="business")data={
name:bizName.value,phone:bizPhone.value,email:bizEmail.value,
location:bizLocation.value,address:bizAddress.value,updatedAt:serverTimestamp()
};

if(type==="pos")data={
currency:currency.value,till:till.value,receiptTitle:receiptTitle.value,
footerText:footerText.value,showLogo:showLogo.checked,
showCustomer:showCustomer.checked,updatedAt:serverTimestamp()
};

if(type==="system")data={
theme:theme.value,language:language.value,
autoBackup:autoBackup.checked,updatedAt:serverTimestamp()
};

await setDoc(doc(db,"settings",type),data,{merge:true});
await addLog("Updated "+type+" settings");
alert("Settings saved.");
};

async function loadSettings(){
for(let type of["business","pos","system"]){
let s=await getDoc(doc(db,"settings",type));
if(!s.exists())continue;
let x=s.data();

if(type==="business"){
bizName.value=x.name||"";bizPhone.value=x.phone||"";
bizEmail.value=x.email||"";bizLocation.value=x.location||"";
bizAddress.value=x.address||"";
}

if(type==="pos"){
currency.value=x.currency||"KES";till.value=x.till||"TILL 1";
receiptTitle.value=x.receiptTitle||"MABROUK TRADER'S";
footerText.value=x.footerText||"Thank you";
showLogo.checked=x.showLogo!==false;
showCustomer.checked=x.showCustomer!==false;
}

if(type==="system"){
theme.value=x.theme||"green";language.value=x.language||"English";
autoBackup.checked=!!x.autoBackup;
}
}
}

async function addLog(action){
if(!currentUser)return;
await addDoc(collection(db,"activityLog"),{
action,user:currentUser.email,createdAt:serverTimestamp()
});
}

async function loadActivity(){
let snap=await getDocs(collection(db,"activityLog"));
let rows=[];
snap.forEach(d=>rows.push(d.data()));
rows.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
rows=rows.slice(0,30);

document.getElementById("activityLog").innerHTML=rows.map(x=>
`<p><b>${x.action||""}</b><br><small>${x.user||""}</small></p>`
).join("")||"No activity yet.";
}

onAuthStateChanged(auth,async u=>{
if(!u){
location.href="login.html";
return;
}

currentUser=u;

try{
let profile=await getDoc(doc(db,"users",u.uid));

if(!profile.exists()){
alert("Your account profile was not found.");
location.href="login.html";
return;
}

firebaseStatus.textContent="● Firebase Connected";
firebaseStatus.style.color="green";

await loadUsers();
await loadSettings();

}catch(e){
firebaseStatus.textContent="Firebase Error";
firebaseStatus.style.color="red";
console.error(e);
}
});
</script>
</body>
</html>
