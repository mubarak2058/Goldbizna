name: Deploy Firebase Cloud Functions

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Cloud Functions JavaScript syntax
        run: node --check functions/index.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOLDBIZNA }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Deploy Cloud Functions only
        run: firebase deploy --only functions --project goldbizna --non-interactive
