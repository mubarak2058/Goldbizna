*{

body{

header{

nav{

.container{

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.card h2{
    color:#0b7a0b;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

.quick-actions{
    margin-top:30px;
}

.quick-actions h2{
    margin-bottom:15px;
    color:#0b7a0b;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.buttons a{
    background:#0b7a0b;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    border-radius:6px;
}

.buttons a:hover{
    background:#086108;
}

footer{
    margin-top:40px;
    background:#0b7a0b;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
