/* =====================================================
   GOLDBIZNA INVENTORY
   SHARED STORAGE WITH POS
   ===================================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];

let editingId = null;


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem("loggedIn");

    sessionStorage.removeItem("gb_login");

    window.location.href = "login.html";

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return Number(value || 0).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value == null ? "" : value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(INVENTORY_KEY);


        if(!saved){

            inventory = [];

            renderInventory();

            return;

        }


        const data =
            JSON.parse(saved);


        if(Array.isArray(data)){

            inventory = data;

        }

        else{

            inventory = [];

        }


    }

    catch(error){

        console.error(
            "Inventory loading error:",
            error
        );

        inventory = [];

    }


    renderInventory();

}


/* =====================================================
   SAVE INVENTORY
   ===================================================== */

function saveInventory(){

    try{

        localStorage.setItem(
            INVENTORY_KEY,
            JSON.stringify(inventory)
        );

        return true;

    }

    catch(error){

        console.error(
            "Inventory save error:",
            error
        );

        showMessage(
            "Could not save inventory. Your browser storage may be full.",
            "error"
        );

        return false;

    }

}


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById("message");


    message.className =
        "message " +
        type;


    message.innerText =
        text;


    setTimeout(function(){

        message.className =
            "message";

    },3000);

}


/* =====================================================
   GENERATE ID
   ===================================================== */

function generateId(){

    return "P-" +
        Date.now() +
        "-" +
        Math.floor(
            Math.random() * 10000
        );

}


/* =====================================================
   SAVE / ADD PRODUCT
   ===================================================== */

function saveProduct(){

    const name =
        document
        .getElementById("productName")
        .value
        .trim();


    const category =
        document
        .getElementById("productCategory")
        .value
        .trim();


    const buyingPrice =
        Number(
            document
            .getElementById("buyingPrice")
            .value
        );


    const sellingPrice =
        Number(
            document
            .getElementById("sellingPrice")
            .value
        );


    const quantity =
        Number(
            document
            .getElementById("quantity")
            .value
        );


    const lowStock =
        Number(
            document
            .getElementById("lowStock")
            .value
        );


    /* VALIDATION */

    if(!name){

        showMessage(
            "Please enter the product name.",
            "error"
        );

        document
        .getElementById("productName")
        .focus();

        return;

    }


    if(
        Number.isNaN(buyingPrice) ||
        buyingPrice < 0
    ){

        showMessage(
            "Please enter a valid buying price.",
            "error"
        );

        return;

    }


    if(
        Number.isNaN(sellingPrice) ||
        sellingPrice < 0
    ){

        showMessage(
            "Please enter a valid selling price.",
            "error"
        );

        return;

    }


    if(
        Number.isNaN(quantity) ||
        quantity < 0
    ){

        showMessage(
            "Please enter a valid quantity.",
            "error"
        );

        return;

    }


    if(
        Number.isNaN(lowStock) ||
        lowStock < 0
    ){

        showMessage(
            "Please enter a valid low-stock level.",
            "error"
        );

        return;

    }


    /* EDIT EXISTING */

    if(editingId !== null){

        const index =
            inventory.findIndex(function(product){

                return String(product.id) ===
                       String(editingId);

            });


        if(index !== -1){

            inventory[index] = {

                id:
                    inventory[index].id,

                name:
                    name,

                category:
                    category,

                buyingPrice:
                    buyingPrice,

                sellingPrice:
                    sellingPrice,

                quantity:
                    quantity,

                lowStock:
                    lowStock

            };

        }


        if(saveInventory()){

            showMessage(
                "Product updated successfully.",
                "success"
            );

        }


        editingId = null;

    }

    else{

        /* ADD NEW */

        const product = {

            id:
                generateId(),

            name:
                name,

            category:
                category,

            buyingPrice:
                buyingPrice,

            sellingPrice:
                sellingPrice,

            quantity:
                quantity,

            lowStock:
                lowStock

        };


        inventory.push(product);


        if(saveInventory()){

            showMessage(
                "Product added successfully.",
                "success"
            );

        }

    }


    clearForm();

    renderInventory();

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm(){

    document
    .getElementById("productName")
    .value = "";


    document
    .getElementById("productCategory")
    .value = "";


    document
    .getElementById("buyingPrice")
    .value = "";


    document
    .getElementById("sellingPrice")
    .value = "";


    document
    .getElementById("quantity")
    .value = "";


    document
    .getElementById("lowStock")
    .value = "5";


    editingId = null;


    document
    .getElementById("formTitle")
    .innerText =
        "➕ Add New Product";


    document
    .getElementById("saveButton")
    .innerText =
        "➕ ADD PRODUCT";


    document
    .getElementById("cancelButton")
    .style.display =
        "none";

}


/* =====================================================
   EDIT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        showMessage(
            "Product not found.",
            "error"
        );

        return;

    }


    editingId =
        product.id;


    document
    .getElementById("productName")
    .value =
        product.name || "";


    document
    .getElementById("productCategory")
    .value =
        product.category || "";


    document
    .getElementById("buyingPrice")
    .value =
        product.buyingPrice || 0;


    document
    .getElementById("sellingPrice")
    .value =
        product.sellingPrice || 0;


    document
    .getElementById("quantity")
    .value =
        product.quantity || 0;


    document
    .getElementById("lowStock")
    .value =
        product.lowStock ?? 5;


    document
    .getElementById("formTitle")
    .innerText =
        "✏️ Edit Product";


    document
    .getElementById("saveButton")
    .innerText =
        "💾 UPDATE PRODUCT";


    document
    .getElementById("cancelButton")
    .style.display =
        "inline-block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   CANCEL EDIT
   ===================================================== */

function cancelEdit(){

    clearForm();

}


/* =====================================================
   DELETE PRODUCT
   ===================================================== */

function deleteProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        return;

    }


    const confirmed =
        confirm(
            "Delete " +
            product.name +
            " from inventory?"
        );


    if(!confirmed){

        return;

    }


    inventory =
        inventory.filter(function(item){

            return String(item.id) !==
                   String(id);

        });


    if(saveInventory()){

        showMessage(
            "Product deleted successfully.",
            "success"
        );

    }


    renderInventory();

}


/* =====================================================
   RENDER INVENTORY
   ===================================================== */

function renderInventory(){

    const table =
        document.getElementById(
            "inventoryTable"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const results =
        inventory.filter(function(product){

            const name =
                String(
                    product.name || ""
                ).toLowerCase();


            const category =
                String(
                    product.category || ""
                ).toLowerCase();


            return(
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(results.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    No products found.

                </td>

            </tr>

        `;

    }

    else{

        let html = "";


        results.forEach(function(product){

            const quantity =
                Number(
                    product.quantity || 0
                );


            const lowStock =
                Number(
                    product.lowStock ?? 5
                );


            let stockClass =
                "stock-good";


            if(quantity <= 0){

                stockClass =
                    "stock-out";

            }

            else if(quantity <= lowStock){

                stockClass =
                    "stock-low";

            }


            let stockText =
                quantity;


            if(quantity <= 0){

                stockText =
                    "OUT";

            }


            html += `

                <tr>

                    <td>
                        <strong>
                            ${escapeHTML(product.name)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(
                            product.category ||
                            "-"
                        )}
                    </td>

                    <td>
                        KSh ${money(
                            product.buyingPrice
                        )}
                    </td>

                    <td>
                        KSh ${money(
                            product.sellingPrice
                        )}
                    </td>

                    <td
                        class="${stockClass}">

                        ${stockText}

                    </td>

                    <td>
                        ${lowStock}
                    </td>

                    <td>

                        <button
                            class="action-btn edit-btn"
                            onclick="editProduct('${escapeHTML(product.id)}')">

                            Edit

                        </button>

                        <button
                            class="action-btn d
