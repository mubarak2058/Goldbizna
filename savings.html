<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Savings</title>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f4;color:#222}
header{background:#087a0b;color:white;padding:16px;font-size:21px;font-weight:bold}
nav{background:#fff;padding:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #ddd}
nav a{padding:9px 12px;text-decoration:none;color:#176b1b;font-weight:bold;font-size:13px}
main{padding:15px;max-width:1200px;margin:auto}
h1{color:#087a0b}.card{background:white;padding:15px;margin:12px 0;border-radius:10px;border:1px solid #ddd}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select,textarea,button{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}
textarea{min-height:70px}button{background:#087a0b;color:white;border:0;font-weight:bold;cursor:pointer}
button.gray{background:#666}button.red{background:#c62828}button.orange{background:#b76b00}
table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}
th{background:#eef5ee}.table{overflow:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:white;padding:15px;border-radius:10px;border:1px solid #ddd}
.stat b{display:block;color:#087a0b;font-size:20px;margin-top:6px}
.status{font-weight:bold}.active{color:#087a0b}.withdrawn{color:#b76b00}.cancelled{color:#c62828}
.msg{padding:10px;margin:10px 0;border-radius:6px;background:#fff3cd;display:none}
@media(max-width:700px){.grid,.stats{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/3}}
@media(max-width:450px){.grid,.stats{grid-template-columns:1fr}.grid .wide{grid-column:auto}}
</style>
</head>

<body>

<header>
MABROUK TRADER'S — SAVINGS
<span id="cloud" style="float:right;font-size:12px">Connecting...</span>
</header>

<nav>
<a href="index.html">Home</a>
<a href="pos.html">POS</a>
<a href="inventory.html">Inventory</a>
<a href="customers.html">Customers</a>
<a href="sales.html">Sales</a>
<a href="savings.html">Savings</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>
</nav>

<main>

<h1>Savings</h1>

<div id="msg" class="msg"></div>

<div class="stats">
<div class="stat">Total Savings<b id="total">KSh 0</b></div>
<div class="stat">Customers<b id="count">0</b></div>
<div class="stat">Today's Deposits<b id="today">KSh 0</b></div>
<div class="stat">Active Accounts<b id="active">0</b></div>
</div>

<div class="card">

<h3>Add Saving</h3>

<div class="grid">

<div>
<label>Customer</label>
<input id="customer" placeholder="Customer name">
</div>

<div>
<label>Amount</label>
<input id="amount" type="number" step="0.01" placeholder="0.00">
</div>

<div>
<label>Date</label>
<input id="date" type="date">
</div>

<div>
<label>Reference</label>
<input id="reference" placeholder="Reference">
</div>

<div>
<label>Payment</label>
<select id="payment">
<option>Cash</option>
<option>M-Pesa</option>
<option>Bank</option>
<option>Card</option>
<option>Other</option>
</select>
</div>

<div>
<label>Status</label>
<select id="status">
<option>ACTIVE</option>
<option>WITHDRAWN</option>
<option>CANCELLED</option>
</select>
</div>

<div class="wide">
<label>Note</label>
<textarea id="note" placeholder="Optional note"></textarea>
</div>

</div>

<br>

<button id="save">Save Saving</button>
<br><br>
<button class="gray" id="clear">Clear</button>

</div>

<div class="card">

<h3>Savings History</h3>

<input id="search" placeholder="Search customer, reference, payment...">

<br><br>

<div class="table">

<table>
<thead>
<tr>
<th>Date</th>
<th>Customer</th>
<th>Amount</th>
<th>Payment</th>
<th>Reference</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="list">
<tr><td colspan="7">Connecting to Firebase...</td></tr>
</tbody>

</table>

</div>

</div>

</main>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{
getFirestore,collection,addDoc,getDocs,updateDoc,deleteDoc,doc
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA8XB6a45-yHT0uZ6NUhptMoNkYqgwqOs",
authDomain:"goldbizna.firebaseapp.com",
projectId:"goldbizna",
storageBucket:"goldbizna.firebasestorage.app",
messagingSenderId:"559981054862",
appId:"1:559981054862:web:0635c689607d3baa3272df"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let data=[],editing=null;

const $=id=>document.getElementById(id);

function money(n){
return Number(n||0).toLocaleString("en-KE",
{minimumFractionDigits:2});
}

function today(){
return new Date().toISOString().slice(0,10);
}

function name(x){
return x.customerName||x.customer||x.name||"";
}

function show(text){
$("msg").textContent=text;
$("msg").style.display="block";
setTimeout(()=>$("msg").style.display="none",3000);
}

function clearForm(){
editing=null;
$("customer").value="";
$("amount").value="";
$("date").value=today();
$("reference").value="";
$("payment").value="Cash";
$("status").value="ACTIVE";
$("note").value="";
$("save").textContent="Save Saving";
}

async function load(){

try{

$("cloud").textContent="Loading...";

const s=await getDocs(collection(db,"savings"));

data=s.docs.map(x=>({id:x.id,...x.data()}));

render();

$("cloud").textContent="Firebase ✓";

}catch(e){

console.error(e);

$("cloud").textContent="Firebase Error";

$("list").innerHTML=
`<tr><td colspan="7">
Firebase error: ${e.message}
</td></tr>`;

}

}

function render(){

let q=$("search").value.toLowerCase();

let rows=data.filter(x=>
(name(x)+" "+(x.reference||"")+" "+
(x.paymentMethod||"")+" "+(x.note||""))
.toLowerCase().includes(q)
);

$("list").innerHTML=rows.length?
rows.map(x=>{

let st=(x.status||"ACTIVE").toUpperCase();

return `<tr>
<td>${x.date||""}</td>
<td>${name(x)}</td>
<td><b>KSh ${money(x.amount)}</b></td>
<td>${x.paymentMethod||""}</td>
<td>${x.reference||""}</td>
<td class="${st.toLowerCase()}">${st}</td>
<td>
<button onclick="editSaving('${x.id}')">Edit</button>
<br><br>
${st==="ACTIVE"?
`<button class="orange" onclick="withdraw('${x.id}')">Withdraw</button><br><br>`:""}
<button class="red" onclick="removeSaving('${x.id}')">Delete</button>
</td>
</tr>`

}).join("")
:
`<tr><td colspan="7">No savings found.</td></tr>`;

let active=data.filter(x=>
(x.status||"ACTIVE").toUpperCase()==="ACTIVE"
);

let total=active.reduce(
(a,x)=>a+Number(x.amount||0),0
);

let td=active.filter(x=>x.date===today())
.reduce((a,x)=>a+Number(x.amount||0),0);

$("total").textContent="KSh "+money(total);
$("today").textContent="KSh "+money(td);
$("active").textContent=active.length;

$("count").textContent=
new Set(active.map(name).filter(Boolean)).size;

}

$("save").onclick=async()=>{

let customer=$("customer").value.trim();
let amount=Number($("amount").value);

if(!customer)return show("Enter customer name.");
if(!amount||amount<=0)return show("Enter a valid amount.");

let obj={
customerName:customer,
amount:amount,
date:$("date").value||today(),
reference:$("reference").value.trim(),
paymentMethod:$("payment").value,
status:$("status").value,
note:$("note").value.trim(),
recordedBy:
localStorage.getItem("goldbizna_username")||"User",
createdAt:new Date().toISOString()
};

try{

$("save").disabled=true;

if(editing){

await updateDoc(
doc(db,"savings",editing),obj
);

show("Saving updated.");

}else{

await addDoc(
collection(db,"savings"),obj
);

show("Saving added.");

}

clearForm();
await load();

}catch(e){

show("Error: "+e.message);

}finally{

$("save").disabled=false;

}

};

window.editSaving=id=>{

let x=data.find(a=>a.id===id);

if(!x)return;

editing=id;

$("customer").value=name(x);
$("amount").value=x.amount||"";
$("date").value=x.date||today();
$("reference").value=x.reference||"";
$("payment").value=x.paymentMethod||"Cash";
$("status").value=x.status||"ACTIVE";
$("note").value=x.note||"";

$("save").textContent="Update Saving";

window.scrollTo({top:0,behavior:"smooth"});

};

window.withdraw=async id=>{

if(!confirm("Withdraw this saving?"))return;

try{

await updateDoc(
doc(db,"savings",id),
{status:"WITHDRAWN"}
);

show("Saving withdrawn.");
load();

}catch(e){

show(e.message);

}

};

window.removeSaving=async id=>{

if(!confirm("Delete this saving permanently?"))return;

try{

await deleteDoc(
doc(db,"savings",id)
);

show("Saving deleted.");
load();

}catch(e){

show(e.message);

}

};

$("search").oninput=render;
$("clear").onclick=clearForm;

$("date").value=today();

load();

</script>

</body>
            </html>
