
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087a0b">

<title>MABROUK TRADER'S - Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#064f08,#087a0b,#0b9910);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-wrapper {
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.login-card {
  width: min(410px,100%);
  background: #fff;
  border-radius: 18px;
  padding: 30px 25px;
  box-shadow: 0 12px 40px rgba(0,0,0,.30);
  text-align: center;
}

.logo {
  width: 72px;
  height: 72px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: #087a0b;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}

h1 {
  color: #087a0b;
  font-size: 24px;
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 24px;
}

.field {
  text-align: left;
  margin-bottom: 15px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
  color: #333;
}

.field input {
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.field input:focus {
  border-color: #087a0b;
  box-shadow: 0 0 0 2px rgba(8,122,11,.12);
}

.login-btn {
  width: 100%;
  border: 0;
  background: #087a0b;
  color: #fff;
  padding: 14px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.login-btn:active {
  transform: scale(.98);
}

.login-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.error {
  display: none;
  background: #ffebee;
  color: #c62828;
  padding: 11px;
  border-radius: 7px;
  font-size: 13px;
  margin-bottom: 14px;
}

.footer {
  margin-top: 20px;
  font-size: 11px;
  color: #888;
}

.shield {
  margin-top: 15px;
  font-size: 11px;
  color: #087a0b;
  font-weight: bold;
}

@media(max-height:600px) {
  .login-card {
    padding: 20px;
  }

  .logo {
    width: 55px;
    height: 55px;
    font-size: 23px;
  }

  h1 {
    font-size: 20px;
  }

  .subtitle {
    margin-bottom: 15px;
  }
}
</style>
</head>

<body>

<div class="login-wrapper">

  <main class="login-card">

    <div class="logo">M</div>

    <h1>MABROUK TRADER'S</h1>

    <div class="subtitle">
      Secure Business Management System
    </div>

    <div
      id="loginError"
      class="error"
      role="alert"
      aria-live="polite">
    </div>

    <form id="loginForm">

      <div class="field">
        <label for="email">Email Address</label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email address"
          autocomplete="username"
          required>
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>
      </div>

      <button
        id="loginBtn"
        class="login-btn"
        type="submit">
        LOGIN
      </button>

    </form>

    <div class="shield">
      🔒 AUTHORIZED ACCESS ONLY
    </div>

    <div class="footer">
      MABROUK TRADER'S POS Pro
      <br>
      Digital • Fast • Organized
    </div>

  </main>

</div>

<script type="module" src="./auth.js"></script>

</body>
</html>
