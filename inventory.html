<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goldbizna Inventory</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f5f2;
    color:#222;
}

header{
    background:#087a0b;
    color:white;
    padding:15px;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:4px;
}

.logout{
    background:#c62828;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.menu{
    background:#075f08;
    overflow-x:auto;
    white-space:nowrap;
}

.menu-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
}

.menu a{
    color:white;
    text-decoration:none;
    padding:13px 15px;
    display:block;
    font-size:14px;
}

.menu a:hover{
    background:#087a0b;
}

.container{
    max-width:1400px;
    margin:20px auto;
    padding:0 12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px #00000015;
    text-align:center;
}

.stat-number{
    font-size:25px;
    font-weight:bold;
    color:#087a0b;
    margin-bottom:5px;
}

.stat-label{
    color:#666;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px #00000015;
}

.title{
    color:#087a0b;
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

.field input:focus{
    border-color:#087a0b;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:7px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn{
    background:#087a0b;
    color:white;
}

.clear-btn{
    background:#555;
    color:white;
}

.cancel-btn{
    background:#c62828;
    color:white;
    display:none;
}

.search{
    width:100%;
    padding:13px;
    border:2px solid #ccc;
    border-radius:7px;
    font-size:15px;
    margin-bottom:15px;
    outline:none;
}

.search:focus{
    border-color:#087a0b;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th{
    background:#087a0b;
    color:white;
    padding:11px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.low{
    color:#d32f2f;
    font-weight:bold;
}

.out{
    color:#b00020;
    font-weight:bold;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.edit-btn{
    background:#1976d2;
    color:white;
    margin-right:5px;
}

.delete-btn{
    background:#c62828;
    color:white;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

.message{
    display:none;
    padding:12px;
    margin-bottom:15px;
    border-radius:7px;
    font-weight:bold;
}

.success{
    background:#e8f5e9;
    color:#087a0b;
}

.error{
    background:#ffebee;
    color:#c62828;
}

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .brand{
        font-size:18px;
    }

    .card{
        padding:14px;
    }
}
</style>
</head>

<body>

<!-- LOGIN PROTECTION -->
<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}
</script>

<header>
    <div class="header-inner">

        <div>
            <div class="brand">GOLDBIZNA INVENTORY</div>
            <div class="subtitle">Professional Business Management</div>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>
</header>

<div class="menu">
    <div class="menu-inner">

        <a href="dashboard.html">Dashboard</a>
        <a href="pos.html">POS</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="sales.html">Sales</a>
        <a href="reports.html">Reports</a>
        <a href="savings.html">Savings</a>
        <a href="users.html">Users</a>
        <a href="settings.html">Settings</a>

    </div>
</div>

<div class="container">

    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat">
            <div id="productCount" class="stat-number">0</div>
            <div class="stat-label">Products</div>
        </div>

        <div class="stat">
            <div id="unitCount" class="stat-number">0</div>
            <div class="stat-label">Total Units</div>
        </div>

        <div class="stat">
            <div id="stockValue" class="stat-number">KSh 0</div>
            <div class="stat-label">Stock Value</div>
        </div>

    </div>


    <!-- ADD PRODUCT -->
    <div class="card">

        <div class="title">
            ➕ Add New Product
        </div>

        <div id="message" class="message"></div>

        <form id="productForm">

            <div class="form-grid">

                <div class="field">
                    <label>Product Name</label>
                    <input
                        id="productName"
                        type="text"
                        placeholder="Enter product name"
                        required>
                </div>

                <div class="field">
                    <label>Category</label>
                    <input
                        id="category"
                        type="text"
                        placeholder="Enter category"
                        required>
                </div>

                <div class="field">
                    <label>Buying Price (KSh)</label>
                    <input
                        id="buyingPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="0"
                        required>
                </div>

                <div class="field">
                    <label>Selling Price (KSh)</label>
                    <input
                        id="sellingPrice"
                        type="number"
                        min="0"
                        step="0.01"
                        placeholder="0"
                        required>
                </div>

                <div class="field">
                    <label>Quantity / Stock</label>
                    <input
                        id="quantity"
                        type="number"
                        min="0"
                        step="1"
                        placeholder="0"
                        required>
                </div>

                <div class="field">
                    <label>Low Stock Alert At</label>
                    <input
                        id="lowStock"
                        type="number"
                        min="0"
                        step="1"
                        value="5"
                        required>
                </div>

            </div>

            <div class="buttons">

                <button
                    type="submit"
                    class="add-btn"
                    id="saveButton">
                    ➕ ADD PRODUCT
                </button>

                <button
                    type="button"
                    class="clear-btn"
                    onclick="clearForm()">
                    CLEAR
                </button>

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelButton"
                    onclick="cancelEdit()">
                    CANCEL EDIT
                </button>

            </div>

        </form>

    </div>


    <!-- INVENTORY -->
    <div class="card">

        <div class="title">
            📦 Inventory Products
        </div>

        <input
            id="search"
            class="search"
            type="text"
            placeholder="Search products or categories...">

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Buying</th>
                        <th>Selling</th>
                        <th>Quantity</th>
                        <th>Low Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="inventoryTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GOLDBIZNA INVENTORY
   IMPORTANT:
   This is the SAME storage key used by POS.
   ===================================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];

let editingId = null;


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem("loggedIn");

    sessionStorage.removeItem("gb_login");

    window.location.href = "login.html";

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return Number(value || 0).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " +
        (type === "error"
            ? "error"
            : "success");

    box.style.display = "block";

    setTimeout(function(){

        box.style.display = "none";

    },3000);

}


/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(INVENTORY_KEY);

        if(!saved){

            inventory = [];

        }else{

            const data =
                JSON.parse(saved);

            inventory =
                Array.isArray(data)
                ? data
                : [];

        }

    }catch(error){

        console.error(error);

        inventory = [];

    }

    renderInventory();

}


/* =====================================================
   SAVE INVENTORY
   ===================================================== */

function saveInventory(){

    localStorage.setItem(
        INVENTORY_KEY,
        JSON.stringify(inventory)
    );

}


/* =====================================================
   ADD / EDIT PRODUCT
   ===================================================== */

document
.getElementById("productForm")
.addEventListener("submit",function(event){

    event.preventDefault();

    const name =
        document
        .getElementById("productName")
        .value
        .trim();

    const category =
        document
        .getElementById("category")
        .value
        .trim();

    const buyingPrice =
        Number(
            document
            .getElementById("buyingPrice")
            .value
        );

    const sellingPrice =
        Number(
            document
            .getElementById("sellingPrice")
            .value
        );

    const quantity =
        Number(
            document
            .getElementById("quantity")
            .value
        );

    const lowStock =
        Number(
            document
            .getElementById("lowStock")
            .value
        );


    /* VALIDATION */

    if(!name){

        showMessage(
            "Please enter the product name.",
            "error"
        );

        return;

    }

    if(!category){

        showMessage(
            "Please enter the category.",
            "error"
        );

        return;

    }

    if(
        !Number.isFinite(buyingPrice) ||
        buyingPrice < 0
    ){

        showMessage(
            "Please enter a valid buying price.",
            "error"
        );

        return;

    }

    if(
        !Number.isFinite(sellingPrice) ||
        sellingPrice < 0
    ){

        showMessage(
            "Please enter a valid selling price.",
            "error"
        );

        return;

    }

    if(
        !Number.isFinite(quantity) ||
        quantity < 0
    ){

        showMessage(
            "Please enter a valid quantity.",
            "error"
        );

        return;

    }

    if(
        !Number.isFinite(lowStock) ||
        lowStock < 0
    ){

        showMessage(
            "Please enter a valid low stock level.",
            "error"
        );

        return;

    }


    /* EDIT EXISTING PRODUCT */

    if(editingId !== null){

        const index =
            inventory.findIndex(function(product){

                return String(product.id) ===
                       String(editingId);

            });


        if(index !== -1){

            inventory[index].name =
                name;

            inventory[index].category =
                category;

            inventory[index].buyingPrice =
                buyingPrice;

            inventory[index].sellingPrice =
                sellingPrice;

            inventory[index].quantity =
                quantity;

            inventory[index].lowStock =
                lowStock;


            saveInventory();

            showMessage(
                "Product updated successfully.",
                "success"
            );

        }

    }

    /* ADD NEW PRODUCT */

    else{

        const product = {

            id:
                "P-" +
                Date.now() +
                "-" +
                Math.random()
                .toString(36)
                .substring(2,8),

            name:
                name,

            category:
                category,

            buyingPrice:
                buyingPrice,

            sellingPrice:
                sellingPrice,

            quantity:
                quantity,

            lowStock:
                lowStock

        };


        inventory.push(product);

        saveInventory();


        showMessage(
            "Product added successfully! POS can now see it.",
            "success"
        );

    }


    clearForm();

    renderInventory();

});


/* =====================================================
   RENDER INVENTORY
   ===================================================== */

function renderInventory(){

    const table =
        document.getElementById(
            "inventoryTable"
        );

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const results =
        inventory.filter(function(product){

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const category =
                String(
                    product.category || ""
                ).toLowerCase();

            return(
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(results.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No products found.
                </td>
            </tr>
        `;

    }else{

        let html = "";


        results.forEach(function(product){

            const quantity =
                Number(
                    product.quantity || 0
                );

            const lowStock =
                Number(
                    product.lowStock ?? 5
                );


            let stockClass =
                "good";


            if(quantity <= 0){

                stockClass =
                    "out";

            }

            else if(quantity <= lowStock){

                stockClass =
                    "low";

            }


            html += `

                <tr>

                    <td>
                        <strong>
                            ${escapeHTML(product.name)}
                        </strong>
                    </td>

                    <td>
                        ${escapeHTML(
                            product.category || "-"
                        )}
                    </td>

                    <td>
                        KSh ${money(
                            product.buyingPrice
                        )}
                    </td>

                    <td>
                        KSh ${money(
                            product.sellingPrice
                        )}
                    </td>

                    <td class="${stockClass}">
                        ${
                            quantity <= 0
                            ? "OUT OF STOCK"
                            : quantity
                        }
                    </td>

                    <td>
                        ${lowStock}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editProduct('${escapeHTML(String(product.id))}')">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteProduct('${escapeHTML(String(product.id))}')">
                            Delete
                        </button>

                    </td>

                </tr>

            `;

        });


        table.innerHTML = html;

    }


    updateStats();

}


/* =====================================================
   STATISTICS
   ===================================================== */

function updateStats(){

    let units = 0;

    let stockValue = 0;


    inventory.forEach(function(product){

        const quantity =
            Number(
                product.quantity || 0
            );

        const buyingPrice =
            Number(
                product.buyingPrice || 0
            );


        units += quantity;

        stockValue +=
            quantity *
            buyingPrice;

    });


    document.getElementById(
        "productCount"
    ).textContent =
        inventory.length;


    document.getElementById(
        "unitCount"
    ).textContent =
        units;


    document.getElementById(
        "stockValue"
    ).textContent =
        "KSh " +
        money(stockValue);

}


/* =====================================================
   SEARCH
   ===================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    renderInventory
);


/* =====================================================
   EDIT
   ===============
