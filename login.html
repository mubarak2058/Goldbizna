<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Goldbizna Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7f6;display:flex;align-items:center;justify-content:center;height:100vh}.box{width:min(390px,92%);background:#fff;padding:30px;border-radius:12px;box-shadow:0 5px 20px #0002}.brand{text-align:center;font-size:24px;font-weight:bold;color:#087a0b;margin-bottom:8px}.sub{text-align:center;color:#777;margin-bottom:25px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:#666;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px}.btn{width:100%;padding:12px;background:#087a0b;color:white;border:0;border-radius:7px;font-weight:bold;cursor:pointer}.error{color:#d92323;text-align:center;font-size:13px;margin-top:12px;display:none}.hint{text-align:center;color:#888;font-size:11px;margin-top:15px}</style></head><body><div class="box"><div class="brand">GOLDBIZNA POS PRO</div><div class="sub">Sign in to continue</div><div class="field"><label>User Name</label><input id="username" type="text" autocomplete="name" placeholder="Enter your name"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn" onclick="login()">Login</button><div id="error" class="error">Please enter your name and the correct password.</div><div class="hint">One system password is used for the whole Goldbizna website.</div></div><script>function login(){const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||p!=='1234'){document.getElementById('error').style.display='block';return}localStorage.setItem('goldbizna_logged_in','true');localStorage.setItem('goldbizna_username',u);location.href='index.html'}if(localStorage.getItem('goldbizna_logged_in')==='true'){};</script></body></html>
