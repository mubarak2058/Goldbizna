.checkout{

.empty{

}

.status-message{

    padding:15px;

    font-size:14px;

.success-message{

<script>

/* ==================================================
   GOLDBIZNA POS
   IMPORTANT:
   INVENTORY USES "goldbizna_inventory"
================================================== */

const INVENTORY_KEY = "goldbizna_inventory";
const SALES_KEY = "goldbizna_sales";

let inventory = [];
let cart = [];
let paymentMethod = "Cash";
let lastReceipt = "";


/* ==================================================
   MONEY
================================================== */

function money(value){
    return Number(value || 0).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );
}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==================================================
   LOAD INVENTORY
================================================== */

function loadInventory(){

    const products =
        localStorage.getItem(INVENTORY_KEY);

    if(!products){

        inventory = [];

        showInventoryMessage(
            "No products found. Add products in Inventory."
        );

        return;

    }

    try{

        const data = JSON.parse(products);

        if(!Array.isArray(data)){

            inventory = [];

        }else{

            inventory = data.map(function(item){

                return {

                    id:
                        item.id ??
                        Date.now() +
                        Math.random(),

                    name:
                        String(
                            item.name || "Unnamed Product"
                        ),

                    category:
                        String(
                            item.category || ""
                        ),

                    sell:
                        Number(
                            item.sellingPrice ??
                            item.sell ??
                            item.price ??
                            0
                        ),

                    buy:
                        Number(
                            item.buyingPrice ??
                            item.buy ??
                            0
                        ),

                    qty:
                        Number(
                            item.quantity ??
                            item.qty ??
                            item.stock ??
                            0
                        ),

                    lowStock:
                        Number(
                            item.lowStock ?? 5
                        )

                };

            });

        }

    }catch(error){

        console.error(
            "Inventory loading error:",
            error
        );

        inventory = [];

        showInventoryMessage(
            "Inventory data could not be loaded."
        );

        return;

    }

    displayProducts();

}


/* ==================================================
   DISPLAY PRODUCTS
================================================== */

function displayProducts(){

    const box =
        document.getElementById("products");

    const searchInput =
        document.getElementById("search");

    const search =
        searchInput
        ? searchInput.value
            .toLowerCase()
            .trim()
        : "";


    const filtered =
        inventory.filter(function(item){

            const name =
                String(item.name || "")
                .toLowerCase();

            const category =
                String(item.category || "")
                .toLowerCase();

            return (
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(inventory.length === 0){

        showInventoryMessage(
            "No products found. Add products in Inventory."
        );

        return;

    }


    if(filtered.length === 0){

        box.innerHTML =
        `
        <div class="empty">
            No product matches "${escapeHTML(search)}".
        </div>
        `;

        return;

    }


    box.innerHTML =
    `
    <div class="products">
    ${
        filtered.map(function(item){

            const low =
                Number(item.qty) <=
                Number(item.lowStock ?? 5);

            return `
            <div
                class="product"
                onclick="addProduct('${String(item.id).replace(/'/g,"\\'")}')">

                <div class="product-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="product-price">
                    KSh ${money(item.sell)}
                </div>

                <div class="stock ${low ? "low-stock" : ""}">
                    Stock: ${Number(item.qty)}
                </div>

            </div>
            `;

        }).join("")
    }
    </div>
    `;

}


/* ==================================================
   INVENTORY MESSAGE
================================================== */

function showInventoryMessage(message){

    document.getElementById("products").innerHTML =
    `
    <div class="status-message">
        ${escapeHTML(message)}
    </div>
    `;

}


/* ==================================================
   SEARCH
================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    displayProducts
);


/* ==================================================
   ADD PRODUCT TO CART
================================================== */

function addProduct(id){

    const item =
        inventory.find(function(product){

            return String(product.id) ===
                   String(id);

        });


    if(!item){

        alert("Product not found.");

        return;

    }


    const stock =
        Number(item.qty || 0);


    if(stock <= 0){

        alert(
            item.name +
            " is out of stock."
        );

        return;

    }


    const existing =
        cart.find(function(product){

            return String(product.id) ===
                   String(item.id);

        });


    if(existing){

        if(
            Number(existing.qty) >=
            stock
        ){

            alert(
                "No more stock available for " +
                item.name
            );

            return;

        }

        existing.qty++;

    }else{

        cart.push({

            id:item.id,

            name:item.name,

            price:Number(item.sell) || 0,

            buy:Number(item.buy) || 0,

            qty:1

        });

    }


    renderCart();

}


/* ==================================================
   CART
================================================== */

function renderCart(){

    const body =
        document.getElementById("cart");


    if(cart.length === 0){

        body.innerHTML =
        `
        <tr>
            <td
                colspan="5"
                class="empty">
                Cart is empty
            </td>
        </tr>
        `;

        updateSummary();

        return;

    }


    body.innerHTML =
    cart.map(function(item,index){

        return `
        <tr>

            <td>
                ${escapeHTML(item.name)}
            </td>

            <td>

                <div class="qty-controls">

                    <button
                        onclick="changeQty(${index},-1)">
                        −
                    </button>

                    <strong>
                        ${item.qty}
                    </strong>

                    <button
                        onclick="changeQty(${index},1)">
                        +
                    </button>

                </div>

            </td>

            <td>
                KSh ${money(item.price)}
            </td>

            <td>
                KSh ${money(item.price * item.qty)}
            </td>

            <td>

                <button
                    class="btn-red"
                    onclick="removeItem(${index})">
                    ×
                </button>

            </td>

        </tr>
        `;

    }).join("");


    updateSummary();

}


/* ==================================================
   CHANGE QUANTITY
================================================== */

function changeQty(index,amount){

    const item =
        cart[index];

    if(!item){
        return;
    }


    const stock =
        inventory.find(function(product){

            return String(product.id) ===
                   String(item.id);

        });


    const newQty =
        Number(item.qty) +
        Number(amount);


    if(newQty <= 0){

        cart.splice(index,1);

    }else if(
        stock &&
        newQty <= Number(stock.qty)
    ){

        item.qty =
            newQty;

    }else{

        alert(
            "Not enough stock available."
        );

    }


    renderCart();

}


/* ==================================================
   REMOVE
================================================== */

function removeItem(index){

    cart.splice(index,1);

    renderCart();

}


/* ==================================================
   CLEAR CART
================================================== */

function clearCart(){

    if(cart.length === 0){
        return;
    }


    if(
        confirm("Clear the entire cart?")
    ){

        cart = [];

        document.getElementById(
            "discount"
        ).value = 0;

        document.getElementById(
            "cashReceived"
        ).value = "";

        renderCart();

    }

}


/* ==================================================
   SUBTOTAL
================================================== */

function subtotal(){

    return cart.reduce(
        function(total,item){

            return total +
                Number(item.price) *
                Number(item.qty);

        },
        0
    );

}


/* ==================================================
   DISCOUNT
================================================== */

function getDiscount(){

    let discount =
        Number(
            document.getElementById(
                "discount"
            ).value
        ) || 0;


    if(discount < 0){
        discount = 0;
    }


    return Math.min(
        discount,
        subtotal()
    );

}


/* ==================================================
   TOTAL
================================================== */

function grandTotal(){

    return subtotal() -
           getDiscount();

}


/* ==================================================
   SUMMARY
================================================== */

function updateSummary(){

    const sub =
        subtotal();

    const discount =
        getDiscount();

    const total =
        sub - discount;


    document.getElementById(
        "subtotal"
    ).textContent =
        "KSh " + money(sub);


    document.getElementById(
        "discountDisplay"
    ).textContent =
        "KSh " + money(discount);


    document.getElementById(
        "total"
    ).textContent =
        "KSh " + money(total);


    calculateChange();

}


/* ==================================================
   PAYMENT
================================================== */

function selectPayment(method){

    paymentMethod = method;


    document
    .querySelectorAll(".payment-btn")
    .forEach(function(button){

        button.classList.remove(
            "active"
        );

    });


    const ids = {

        Cash:"cashBtn",

        "M-Pesa":"mpesaBtn",

        Card:"cardBtn",

        Credit:"creditBtn"

    };


    document
    .getElementById(ids[method])
    .classList.add("active");


    document.getElementById(
        "cashBox"
    ).style.display =
        method === "Cash"
        ? "block"
        : "none";

}


/* =======
