<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sales History</title>
<style>body{font-family:Arial;background:#f4f4f4;margin:0}header{background:#0b7a0b;color:#fff;padding:15px;text-align:center}.c{max-width:1000px;margin:20px auto;background:#fff;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}th{background:#0b7a0b;color:#fff}input{padding:8px;width:100%;margin-bottom:10px}</style>
</head><body><header>Goldbizna Sales History</header><div class='c'><input id='s' placeholder='Search...' oninput='render()'><table><thead><tr><th>Date</th><th>Items</th><th>Total</th></tr></thead><tbody id='tb'></tbody></table></div>
<script>
let sales=JSON.parse(localStorage.getItem('goldbizna_sales')||'[]');
function render(){let q=s.value.toLowerCase();tb.innerHTML='';sales.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).forEach(x=>tb.innerHTML+=`<tr><td>${x.date}</td><td>${x.items}</td><td>${x.total}</td></tr>`)}
render();
</script></body></html>
