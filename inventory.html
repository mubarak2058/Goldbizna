<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#087a0b;
    color:white;
    padding:16px;
}

.header{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:4px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

.dashboard{
    background:#075c07;
    color:white;
}

.logout{
    background:#c62828;
    color:white;
}

.container{
    max-width:1200px;
    margin:20px auto;
    padding:0 12px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
    color:#087a0b;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#087a0b;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.add{
    background:#087a0b;
    color:white;
}

.cancel{
    background:#777;
    color:white;
}

.export{
    background:#1565c0;
    color:white;
}

.message{
    margin-top:14px;
    min-height:22px;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.summary-card h3{
    color:#087a0b;
    margin-bottom:8px;
}

.summary-card strong{
    font-size:25px;
}

.search{
    margin-bottom:15px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#087a0b;
    color:white;
    padding:11px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.low{
    color:#c62828;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>
<div class="logo">GOLDBIZNA INVENTORY PRO</div>
<div class="subtitle">
Fast Business Inventory Management
</div>
</div>

<div class="header-buttons">

<button
class="dashboard"
id="dashboardButton">
Dashboard
</button>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<div class="container">


<!-- ADD PRODUCT -->

<div class="card">

<div class="title" id="formTitle">
Add New Product
</div>

<div class="form-grid">

<input
id="productName"
type="text"
placeholder="Product Name">

<input
id="productCategory"
type="text"
placeholder="Category">

<input
id="buyingPrice"
type="number"
min="0"
step="0.01"
placeholder="Buying Price">

<input
id="sellingPrice"
type="number"
min="0"
step="0.01"
placeholder="Selling Price">

<input
id="quantity"
type="number"
min="0"
step="1"
placeholder="Stock Quantity">

<input
id="lowStock"
type="number"
min="0"
value="5"
placeholder="Low Stock Alert">

</div>


<div class="actions">

<button
type="button"
class="add"
id="addButton">
➕ Add Product
</button>

<button
type="button"
class="cancel"
id="cancelButton"
style="display:none;">
Cancel
</button>

<button
type="button"
class="export"
id="exportButton">
⬇ Export CSV
</button>

</div>

<div
id="message"
class="message">
</div>

</div>


<!-- SUMMARY -->

<div class="summary">

<div class="summary-card">

<h3>Total Products</h3>

<strong id="totalProducts">0</strong>

</div>

<div class="summary-card">

<h3>Total Stock</h3>

<strong id="totalStock">0</strong>

</div>

<div class="summary-card">

<h3>Stock Value</h3>

<strong id="stockValue">KSh 0</strong>

</div>

</div>


<!-- SEARCH -->

<div class="card">

<div class="title">
Search Inventory
</div>

<input
id="search"
class="search"
type="search"
placeholder="🔎 Search product or category..."
autocomplete="off">

</div>


<!-- PRODUCTS -->

<div class="card">

<div class="title">
Products
</div>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>#</th>
<th>Product</th>
<th>Category</th>
<th>Buying</th>
<th>Selling</th>
<th>Stock</th>
<th>Profit</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="inventoryBody">

</tbody>

</table>

</div>

</div>

</div>


<script>

/*
====================================================
GOLDBIZNA INVENTORY PRO
====================================================
IMPORTANT:
This uses the same storage key as the POS:
goldbizna_inventory
====================================================
*/

var STORAGE_KEY = "goldbizna_inventory";

var inventory = [];

var editingId = null;


/* ================================
   GET ELEMENT
================================ */

function get(id){
    return document.getElementById(id);
}


/* ================================
   SHOW MESSAGE
================================ */

function message(text,type){

    var box = get("message");

    box.textContent = text;

    if(type === "success"){
        box.style.color = "#087a0b";
    }

    else if(type === "error"){
        box.style.color = "#c62828";
    }

    else{
        box.style.color = "#1565c0";
    }

}


/* ================================
   LOAD INVENTORY
================================ */

function loadInventory(){

    var saved;

    try{

        saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){

            inventory = [];

        }else{

            var data =
                JSON.parse(saved);

            if(Array.isArray(data)){

                inventory = data;

            }else{

                inventory = [];

            }

        }

    }catch(error){

        console.error(error);

        inventory = [];

        message(
            "Inventory could not be loaded.",
            "error"
        );

    }

    displayProducts();

}


/* ================================
   SAVE INVENTORY
================================ */

function saveInventory(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(inventory)
        );

        return true;

    }catch(error){

        console.error(error);

        message(
            "Could not save inventory.",
            "error"
        );

        return false;

    }

}


/* ================================
   ADD PRODUCT
================================ */

function saveProduct(){

    var name =
        get("productName").value.trim();

    var category =
        get("productCategory").value.trim();

    var buying =
        Number(
            get("buyingPrice").value
        );

    var selling =
        Number(
            get("sellingPrice").value
        );

    var quantity =
        Number(
            get("quantity").value
        );

    var lowStock =
        Number(
            get("lowStock").value
        );


    /* VALIDATION */

    if(name === ""){

        message(
            "Please enter the product name.",
            "error"
        );

        get("productName").focus();

        return;

    }


    if(category === ""){

        message(
            "Please enter the category.",
            "error"
        );

        get("productCategory").focus();

        return;

    }


    if(
        isNaN(buying) ||
        buying < 0
    ){

        message(
            "Enter a valid buying price.",
            "error"
        );

        return;

    }


    if(
        isNaN(selling) ||
        selling < 0
    ){

        message(
            "Enter a valid selling price.",
            "error"
        );

        return;

    }


    if(
        isNaN(quantity) ||
        quantity < 0
    ){

        message(
            "Enter a valid quantity.",
            "error"
        );

        return;

    }


    if(
        isNaN(lowStock) ||
        lowStock < 0
    ){

        message(
            "Enter a valid low-stock level.",
            "error"
        );

        return;

    }


    /* ================================
       EDIT EXISTING PRODUCT
    ================================= */

    if(editingId !== null){

        var editIndex = -1;

        for(
            var i = 0;
            i < inventory.length;
            i++
        ){

            if(
                String(inventory[i].id)
                ===
                String(editingId)
            ){

                editIndex = i;

                break;

            }

        }


        if(editIndex === -1){

            message(
                "Product was not found.",
                "error"
            );

            return;

        }


        inventory[editIndex].name =
            name;

        inventory[editIndex].category =
            category;

        inventory[editIndex].buyingPrice =
            buying;

        inventory[editIndex].sellingPrice =
            selling;

        inventory[editIndex].quantity =
            quantity;

        inventory[editIndex].lowStock =
            lowStock;


        if(!saveInventory()){

            return;

        }


        message(
            "✓ Product updated successfully!",
            "success"
        );


        editingId = null;

        clearForm();

        updateForm();

        displayProducts();

        return;

    }


    /* ================================
       DUPLICATE CHECK
    ================================= */

    for(
        var d = 0;
        d < inventory.length;
        d++
    ){

        if(
            String(
                inventory[d].name
            ).toLowerCase()
            ===
            name.toLowerCase()
        ){

            message(
                "This product already exists.",
                "error"
            );

            return;

        }

    }


    /* ================================
       NEW PRODUCT
    ================================= */

    var product = {

        id:
            Date.now().toString()
            +
            Math.random()
            .toString(36)
            .substring(2,7),

        name:name,

        category:category,

        buyingPrice:buying,

        sellingPrice:selling,

        quantity:quantity,

        lowStock:lowStock,

        created:
            new Date().toISOString()

    };


    inventory.push(product);


    /* SAVE */

    if(!saveInventory()){

        inventory.pop();

        return;

    }


    /* SUCCESS */

    message(
        "✓ Product added successfully!",
        "success"
    );


    clearForm();

    displayProducts();

}


/* ================================
   CLEAR FORM
================================ */

function clearForm(){

    get("productName").value = "";

    get("productCategory").value = "";

    get("buyingPrice").value = "";

    get("sellingPrice").value = "";

    get("quantity").value = "";

    get("lowStock").value = "5";

}


/* ================================
   UPDATE FORM
================================ */

function updateForm(){

    if(editingId === null){

        get("formTitle").textContent =
            "Add New Product";

        get("addButton").textContent =
            "➕ Add Product";

        get("cancelButton").style.display =
            "none";

    }else{

        get("formTitle").textContent =
            "Edit Product";

        get("addButton").textContent =
            "💾 Update Product";

        get("cancelButton").style.display =
            "inline-block";

    }

}


/* ================================
   DISPLAY PRODUCTS
================================ */

function displayProducts(){

    var body =
        get("inventoryBody");

    var search =
        get("search").value
        .toLowerCase()
        .trim();


    body.innerHTML = "";


    var results = [];


    for(
        var i = 0;
        i < inventory.length;
        i++
    ){

        var product =
            inventory[i];

        var name =
            String(
                product.name || ""
            ).toLowerCase();

        var category =
            String(
                product.category || ""
            ).toLowerCase();


        if(
            name.indexOf(search) !== -1
            ||
            category.indexOf(search) !== -1
        ){

            results.push(product);

        }

    }


    if(results.length === 0){

        body.innerHTML =
            '<tr>' +
            '<td colspan="9" class="empty">' +
            (
                inventory.length === 0
                ?
                "No products yet. Add your first product above."
                :
                "No products match your search."
            ) +
            '</td>' +
            '</tr>';

        updateSummary();

        return;

    }


    for(
        var r = 0;
        r < results.length;
        r++
    ){

        var item =
            results[r];

        var stock =
            Number(item.quantity) || 0;

        var buying =
            Number(item.buyingPrice) || 0;

        var selling =
            Number(item.sellingPrice) || 0;

        var low =
            Number(item.lowStock);

        if(isNaN(low)){
            low = 5;
        }


        var profit =
            (selling - buying)
            * stock;


        var status =
            stock <= low
            ?
            '<span class="low">LOW STOCK</span>'
            :
            '<span class="good">IN STOCK</span>';


        var row =
            document.createElement("tr");


        row.innerHTML =

            "<td>" +
            (r + 1) +
            "</td>" +

            "<td><strong>" +
            escapeHTML(item.name) +
            "</strong></td>" +

            "<td>" +
            escapeHTML(item.category) +
            "</td>" +

            "<td>KSh " +
            money(buying) +
            "</td>" +

            "<td>KSh " +
            money(selling) +
            "</td>" +

            '<td class="' +
            (stock <= low ? "low" : "good") +
            '">' +
            stock +
            "</td>" +

            '<td class="' +
            (profit >= 0 ? "good" : "low") +
            '">' +
            "KSh " +
            money(profit) +
            "</td>" +

            "<td>" +
            status +
            "</td>" +

            "<td>" +

            '<button class="edit" ' +
            'data-edit="' +
            escapeHTML(item.id) +
            '">' +
            "Edit" +
            "</button>" +

            '<button class="delete" ' +
            'data-delete="' +
            escapeHTML(item.id) +
            '">' +
            "Delete" +
            "</button>" +

            "</td>";


        body.appendChild(row);

    }


    updateSummary();

}


/* ================================
   MONEY
================================ */

function money(value){

    return Number(value || 0)
        .toLocaleString(
            "en-KE",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   SUMMARY
================================ */

function updateSummary(){

    var totalStock = 0;

    var stockValue = 0;


    for(
        var i = 0;
        i < inventory.length;
        i++
    ){

        var quantity =
            Number(
                inventory[i].quantity
            ) || 0;

        var buying =
            Number(
                inventory[i].buyingPrice
            ) || 0;


        totalStock += quantity;

        stockValue +=
            quantity * buying;

    }


    get("totalProducts")
        .textContent =
        inventory.length;


    get("totalStock")
        .textContent =
        totalStock;


    get("stockValue")
        .textContent =
        "KSh " +
        money(stockValue);

}


/* ================================
   EDIT
================================ */

function editProduct(id){

    var product = null;


    for(
        var i = 0;
        i < inventory.length;
        i++
    ){

        if(
            String(inventory[i].id)
            ===
            String(id)
        ){

            product =
                inventory[i];

            break;

        }

    }


    if(!product){

        message(
            "Product not found.",
            "error"
        );

        return;

    }


    editingId =
        product.id;


    get("productName").value =
        product.name || "";

    get("productCategory").value =
        product.category || "";

    get("buyingPrice").value =
        product.buyingPrice || "";

    get("sellingPrice").value =
        product.sellingPrice || "";

    get("quantity").value =
        product.quantity || "";

    get("lowStock").value =
        product.lowStock || 5;


    updateForm();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================================
   DELETE
================================ */

function deleteProduct(id){

    var product = null;


    for(
        var i = 0;
        i < inventory.length;
        i++
    ){

        if(
            String(inventory[i].id)
            ===
            String(id)
        ){

            product =
                inventory[i];

            break;

        }

    }


    if(!product){
        return;
    }


    if(
        !confirm(
            "Delete " +
            product.name +
            "?"
        )
    ){

        return;

    }


    var oldInventory =
        inventory.slice();


    inventory =
        inventory.filter(
            function(item){

                return String(item.id)
                    !==
                    String(id);

            }
        );


    if(!saveInventory()){

        inventory =
            oldInventory;

        return;

    }


    message(
        "Product deleted.",
        "success"
    );

    displayProducts();

}


/* ================================
   EXPORT
================================ */

function exportInventory(){

    if(inventory.length === 0){

        message(
            "There are no products to export.",
            "error"
        );

        return;

    }


    var csv =
        "Product,Category,Buying Price,Selling Price,Stock,Low Stock\n";


    for(
        var i = 0;
        i < inventory.length;
        i++
    ){

        var p =
            inventory[i];


        csv +=
            csvEscape(p.name) + "," +
            csvEscape(p.category) + "," +
            csvEscape(p.buyingPrice) + "," +
            csvEscape(p.sellingPrice) + "," +
            csvEscape(p.quantity) + "," +
            csvEscape(p.lowStock) +
            "\n";

    }


    var blob =
        new Blob(
            [csv],
            {
                type:
