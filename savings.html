<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Goldbizna Savings</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
}

header{
    background:#0b7a0b;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.header-buttons button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.dashboard-btn{
    background:#075c07;
}

.logout-btn{
    background:#c62828;
}

.export-btn{
    background:#1565c0;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.title,
.form-box,
.summary-card,
.search-box,
.table-box{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.title{
    padding:20px;
    margin-bottom:20px;
}

.title h1{
    color:#0b7a0b;
    margin-bottom:5px;
}

.form-box{
    padding:20px;
    margin-bottom:20px;
}

.form-box h2{
    color:#0b7a0b;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
    background:white;
}

.full{
    grid-column:1/-1;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    border:none;
    padding:11px 17px;
    border-radius:5px;
    cursor:pointer;
}

.save-btn{
    background:#0b7a0b;
    color:white;
}

.cancel-btn{
    background:#777;
    color:white;
    display:none;
}

#message{
    margin-top:12px;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    padding:20px;
    text-align:center;
}

.summary-card h3{
    color:#0b7a0b;
    margin-bottom:8px;
}

.summary-card p{
    font-size:24px;
    font-weight:bold;
}

.search-box{
    padding:15px;
    margin-bottom:20px;
}

.table-box{
    padding:20px;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    background:#0b7a0b;
    color:white;
    padding:11px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

.edit-btn{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete-btn{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .summary{
        grid-template-columns:1fr;
    }

    header{
        gap:12px;
    }

    .logo{
        font-size:21px;
    }
}
</style></head><body><!-- LOGIN PROTECTION --><script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}
</script><header><div class="logo">
    Goldbizna Savings
</div>

<div class="header-buttons">

    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

    <button
        class="export-btn"
        onclick="exportCSV()">
        Export CSV
    </button>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</div>

</header><div class="container"><div class="title">

    <h1>Savings Tracker</h1>

    <p>
        Record and monitor business savings month by month.
    </p>

</div>


<!-- SAVINGS FORM -->
<div class="form-box">

    <h2 id="formTitle">Add Savings</h2>

    <div class="form-grid">

        <input
            type="text"
            id="saverName"
            placeholder="Saver / Account Name"
        >

        <input
            type="month"
            id="month"
        >

        <input
            type="number"
            id="amount"
            placeholder="Savings Amount"
            min="0"
            step="0.01"
        >

        <select id="method">

            <option value="">
                Select Payment Method
            </option>

            <option value="Cash">
                Cash
            </option>

            <option value="M-Pesa">
                M-Pesa
            </option>

            <option value="Bank">
                Bank
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <input
            class="full"
            type="text"
            id="note"
            placeholder="Note (optional)"
        >

    </div>

    <div class="buttons">

        <button
            class="save-btn"
            id="saveButton"
            onclick="saveSavings()">
            Add Savings
        </button>

        <button
            class="cancel-btn"
            id="cancelButton"
            onclick="cancelEdit()">
            Cancel
        </button>

    </div>

    <p id="message"></p>

</div>


<!-- SUMMARY -->
<div class="summary">

    <div class="summary-card">

        <h3>Total Savings</h3>

        <p id="totalSavings">
            KSh 0
        </p>

    </div>

    <div class="summary-card">

        <h3>Total Entries</h3>

        <p id="totalEntries">
            0
        </p>

    </div>

    <div class="summary-card">

        <h3>Average Entry</h3>

        <p id="averageSavings">
            KSh 0
        </p>

    </div>

</div>


<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Search saver, month, method or note..."
        oninput="displaySavings()"
    >

</div>


<!-- TABLE -->
<div class="table-box">

    <table>

        <thead>

            <tr>

                <th>#</th>
                <th>Saver</th>
                <th>Month</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Note</th>
                <th>Date Added</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="savingsBody"></tbody>

    </table>

</div>

</div><script>

let savings = JSON.parse(
    localStorage.getItem("goldbizna_savings") || "[]"
);

let editingIndex = -1;


/* DEFAULT MONTH */
if(!document.getElementById("month").value){

    const today = new Date();

    const month =
        today.getFullYear() +
        "-" +
        String(today.getMonth()+1).padStart(2,"0");

    document.getElementById("month").value =
        month;

}


/* SAVE SAVINGS */
function saveSavings(){

    const saverName =
        document.getElementById("saverName")
        .value
        .trim();

    const month =
        document.getElementById("month")
        .value;

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const method =
        document.getElementById("method").value;

    const note =
        document.getElementById("note")
        .value
        .trim();


    if(saverName === ""){

        alert("Please enter the saver or account name.");

        return;

    }


    if(month === ""){

        alert("Please select the savings month.");

        return;

    }


    if(amount <= 0){

        alert("Please enter a valid savings amount.");

        return;

    }


    if(method === ""){

        alert("Please select a payment method.");

        return;

    }


    const entry = {

        id:
            editingIndex === -1
            ? Date.now()
            : savings[editingIndex].id,

        saverName:saverName,

        month:month,

        amount:amount,

        method:method,

        note:note,

        dateAdded:
            editingIndex === -1
            ? new Date().toLocaleString()
            : savings[editingIndex].dateAdded

    };


    if(editingIndex === -1){

        savings.push(entry);

        showMessage(
            "Savings added successfully.",
            "green"
        );

    }else{

        savings[editingIndex]=entry;

        editingIndex=-1;

        showMessage(
            "Savings updated successfully.",
            "green"
        );

    }


    saveData();

    clearForm();

    displaySavings();

}


/* SAVE DATA */
function saveData(){

    localStorage.setItem(
        "goldbizna_savings",
        JSON.stringify(savings)
    );

}


/* DISPLAY */
function displaySavings(){

    const body =
        document.getElementById("savingsBody");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    body.innerHTML="";


    const filtered =
        savings.filter(function(item){

            return (

                item.saverName
                    .toLowerCase()
                    .includes(search)

                ||

                item.month
                    .toLowerCase()
                    .includes(search)

                ||

                item.method
                    .toLowerCase()
                    .includes(search)

                ||

                item.note
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(filtered.length === 0){

        body.innerHTML=`

            <tr>

                <td
                    colspan="8"
                    class="empty">
                    No savings records found.
                </td>

            </tr>

        `;

    }


    let total=0;


    filtered.forEach(function(item,index){

        total += Number(item.amount);


        const realIndex =
            savings.indexOf(item);


        const row =
            document.createElement("tr");


        row.innerHTML=`

            <td>${index + 1}</td>

            <td>
                ${escapeHTML(item.saverName)}
            </td>

            <td>
                ${escapeHTML(item.month)}
            </td>

            <td>
                KSh ${Number(item.amount)
                .toLocaleString()}
            </td>

            <td>
                ${escapeHTML(item.method)}
            </td>

            <td>
                ${escapeHTML(item.note || "-")}
            </td>

            <td>
                ${escapeHTML(item.dateAdded)}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editSavings(${realIndex})">
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteSavings(${realIndex})">
                    Delete
                </button>

            </td>

        `;


        body.appendChild(row);

    });


    /* ALL-TIME TOTAL */
    let allTotal=0;

    savings.forEach(function(item){

        allTotal += Number(item.amount);

    });


    document.getElementById("totalSavings").innerText =
        "KSh " + allTotal.toLocaleString();


    document.getElementById("totalEntries").innerText =
        savings.length;


    const average =
        savings.length > 0
        ? allTotal / savings.length
        : 0;


    document.getElementById("averageSavings").innerText =
        "KSh " + average.toLocaleString(
            undefined,
            {
                maximumFractionDigits:2
            }
        );

}


/* EDIT */
function editSavings(index){

    const item =
        savings[index];


    document.getElementById("saverName").value =
        item.saverName;

    document.getElementById("month").value =
        item.month;

    document.getElementById("amount").value =
        item.amount;

    document.getElementById("method").value =
        item.method;

    document.getElementById("note").value =
        item.note;


    editingIndex=index;


    document.getElementById("formTitle").innerText =
        "Edit Savings";


    document.getElementById("saveButton").innerText =
        "Update Savings";


    document.getElementById("cancelButton").style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* CANCEL */
function cancelEdit(){

    editingIndex=-1;

    clearForm();

}


/* DELETE */
function deleteSavings(index){

    const item =
        savings[index];


    if(!confirm(
        "Delete this savings record?"
    )){

        return;

    }


    savings.splice(index,1);

    saveData();

    displaySavings();


    showMessage(
        "Savings record deleted.",
        "red"
    );

}


/* CLEAR FORM */
function clearForm(){

    document.getElementById("saverName").value="";
    document.getElementById("amount").value="";
    document.getElementById("method").value="";
    document.getElementById("note").value="";


    const today = new Date();

    document.getElementById("month").value =
        today.getFullYear() +
        "-" +
        String(today.getMonth()+1).padStart(2,"0");


    document.getElementById("formTitle").innerText =
        "Add Savings";


    document.getElementById("saveButton").innerText =
        "Add Savings";


    document.getElementById("cancelButton").style.display =
        "none";

}


/* EXPORT CSV */
function exportCSV(){

    if(savings.length === 0){

        alert("There are no savings records to export.");

        return;

    }


    let csv =
        "Saver,Month,Amount,Payment Method,Note,Date Added\n";


    savings.forEach(function(item){

        csv +=
            csvEscape(item.saverName) + "," +
            csvEscape(item.month) + "," +
            csvEscape(item.amount) + "," +
            csvEscape(item.method) + "," +
            csvEscape(item.note) + "," +
            csvEscape(item.dateAdded) +
            "\n";

    });


    const blob =
        new Blob(
            [csv],
            {type:"text/csv;charset=utf-8;"}
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href=url;

    link.download =
        "goldbizna_savings.csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* CSV ESCAPE */
function csvEscape(value){

    const text =
        String(value ?? "");


    if(
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
    ){

        return '"' +
            text.replace(/"/g,'""') +
            '"';

    }


    return text;

}


/* MESSAGE */
function showMessage(text,color){

    const message =
        document.getElementById("message");


    message.innerText=text;

    message.style.color=color;


    setTimeout(function(){

        message.innerText="";

    },3000);

}


/* LOGOUT */
function logout(){

    localStorage.removeItem("loggedIn");

    window.location.href="login.html";

}


/* HTML ESCAPE */
function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* START */
displaySavings();

</script></body>
  </html>
