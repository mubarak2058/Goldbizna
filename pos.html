<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Goldbizna POS</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
}

/* HEADER */
header{
    background:#0b7a0b;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-buttons button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.dashboard-btn{
    background:#075c07;
}

.logout-btn{
    background:#c62828;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

/* TITLE */
.title{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.title h1{
    color:#0b7a0b;
    margin-bottom:5px;
}

/* POS GRID */
.pos-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

/* BOX */
.box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.box h2{
    color:#0b7a0b;
    margin-bottom:15px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    cursor:pointer;
}

/* ADD PRODUCT */
.add-btn{
    width:100%;
    padding:12px;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
}

.add-btn:hover{
    background:#086108;
}

/* CART */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#0b7a0b;
    color:white;
    padding:10px;
}

td{
    padding:9px;
    border:1px solid #ddd;
    text-align:center;
}

.remove-btn{
    background:#c62828;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:4px;
}

/* TOTAL */
.total-box{
    margin-top:20px;
    padding:15px;
    background:#f1f8f1;
    border-radius:7px;
}

.total-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    font-size:17px;
}

.grand-total{
    font-size:24px;
    font-weight:bold;
    color:#0b7a0b;
    border-top:1px solid #ccc;
    margin-top:8px;
    padding-top:12px;
}

/* PAYMENT */
.payment{
    margin-top:20px;
}

.complete-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:17px;
    font-weight:bold;
}

.clear-btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    background:#777;
    color:white;
    border:none;
    border-radius:5px;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:800px){

    .pos-grid{
        grid-template-columns:1fr;
    }

    header{
        gap:12px;
    }

    .logo{
        font-size:21px;
    }

    table{
        font-size:13px;
    }

    th,td{
        padding:7px 4px;
    }
}
</style></head><body><!-- LOGIN PROTECTION --><script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}
</script><header><div class="logo">
    Goldbizna POS
</div>

<div class="header-buttons">

    <button class="dashboard-btn"
    onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

    <button class="logout-btn"
    onclick="logout()">
        Logout
    </button>

</div>

</header><div class="container"><div class="title">
    <h1>Point of Sale</h1>
    <p>Create sales and manage customer purchases.</p>
</div>

<div class="pos-grid">

    <!-- PRODUCT SECTION -->
    <div class="box">

        <h2>Add Product</h2>

        <input
            type="text"
            id="productName"
            placeholder="Product name"
        >

        <input
            type="number"
            id="price"
            placeholder="Selling price"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="1"
            value="1"
        >

        <button
            class="add-btn"
            onclick="addToCart()">
            Add to Cart
        </button>

    </div>


    <!-- PAYMENT SECTION -->
    <div class="box">

        <h2>Payment</h2>

        <input
            type="text"
            id="customerName"
            placeholder="Customer name (optional)"
        >

        <input
            type="text"
            id="paymentMethod"
            placeholder="Payment method e.g. Cash / M-Pesa"
        >

        <input
            type="number"
            id="cashReceived"
            placeholder="Amount received"
            min="0"
            step="0.01"
            oninput="calculateChange()"
        >

        <div class="total-box">

            <div class="total-row">
                <span>Subtotal</span>
                <strong id="subtotal">KSh 0</strong>
            </div>

            <div class="total-row">
                <span>Items</span>
                <strong id="itemCount">0</strong>
            </div>

            <div class="total-row grand-total">
                <span>Total</span>
                <strong id="grandTotal">KSh 0</strong>
            </div>

            <div class="total-row">
                <span>Change</span>
                <strong id="change">KSh 0</strong>
            </div>

        </div>

        <button
            class="complete-btn"
            onclick="completeSale()">
            Complete Sale
        </button>

        <button
            class="clear-btn"
            onclick="clearCart()">
            Clear Cart
        </button>

        <p id="message"></p>

    </div>

</div>


<!-- CART -->
<div class="box" style="margin-top:20px;">

    <h2>Current Cart</h2>

    <table>

        <thead>

            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="cartBody">

        </tbody>

    </table>

</div>

</div><script>

let cart = [];


/* ADD PRODUCT */
function addToCart(){

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(document.getElementById("price").value);

    const quantity =
        Number(document.getElementById("quantity").value);


    if(name === ""){
        alert("Please enter the product name.");
        return;
    }

    if(price <= 0){
        alert("Please enter a valid selling price.");
        return;
    }

    if(quantity <= 0){
        alert("Please enter a valid quantity.");
        return;
    }


    cart.push({

        name:name,

        price:price,

        quantity:quantity,

        total:price * quantity

    });


    document.getElementById("productName").value="";
    document.getElementById("price").value="";
    document.getElementById("quantity").value=1;


    displayCart();

}


/* DISPLAY CART */
function displayCart(){

    const body =
        document.getElementById("cartBody");

    body.innerHTML="";


    let subtotal=0;
    let items=0;


    cart.forEach(function(item,index){

        subtotal += item.total;

        items += item.quantity;


        const row =
            document.createElement("tr");


        row.innerHTML=`

            <td>${escapeHTML(item.name)}</td>

            <td>KSh ${item.price.toLocaleString()}</td>

            <td>${item.quantity}</td>

            <td>KSh ${item.total.toLocaleString()}</td>

            <td>
                <button
                    class="remove-btn"
                    onclick="removeItem(${index})">
                    Remove
                </button>
            </td>

        `;


        body.appendChild(row);

    });


    document.getElementById("subtotal").innerText =
        "KSh " + subtotal.toLocaleString();


    document.getElementById("grandTotal").innerText =
        "KSh " + subtotal.toLocaleString();


    document.getElementById("itemCount").innerText =
        items;


    calculateChange();

}


/* REMOVE ITEM */
function removeItem(index){

    cart.splice(index,1);

    displayCart();

}


/* CALCULATE CHANGE */
function calculateChange(){

    const total =
        cart.reduce(function(sum,item){

            return sum + item.total;

        },0);


    const received =
        Number(
            document.getElementById("cashReceived").value
        );


    const change =
        received - total;


    document.getElementById("change").innerText =
        "KSh " +
        (change > 0 ? change : 0).toLocaleString();

}


/* COMPLETE SALE */
function completeSale(){

    if(cart.length === 0){

        alert("Your cart is empty.");

        return;

    }


    const total =
        cart.reduce(function(sum,item){

            return sum + item.total;

        },0);


    const customer =
        document.getElementById("customerName").value.trim()
        || "Walk-in Customer";


    const payment =
        document.getElementById("paymentMethod").value.trim()
        || "Cash";


    const received =
        Number(
            document.getElementById("cashReceived").value
        );


    if(received < total){

        alert(
            "Amount received is less than the total sale."
        );

        return;

    }


    const sale = {

        id:Date.now(),

        date:new Date().toLocaleString(),

        customer:customer,

        paymentMethod:payment,

        items:cart,

        total:total,

        amount:received,

        change:received-total

    };


    let sales =
        JSON.parse(
            localStorage.getItem("goldbizna_sales") || "[]"
        );


    sales.push(sale);


    localStorage.setItem(
        "goldbizna_sales",
        JSON.stringify(sales)
    );


    document.getElementById("message").style.color =
        "#0b7a0b";

    document.getElementById("message").innerText =
        "Sale completed successfully!";


    cart=[];

    document.getElementById("customerName").value="";
    document.getElementById("paymentMethod").value="";
    document.getElementById("cashReceived").value="";


    displayCart();

}


/* CLEAR CART */
function clearCart(){

    if(cart.length === 0){
        return;
    }


    if(confirm("Clear all items from the cart?")){

        cart=[];

        displayCart();

    }

}


/* LOGOUT */
function logout(){

    localStorage.removeItem("loggedIn");

    window.location.href="login.html";

}


/* BASIC HTML SECURITY */
function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* INITIAL DISPLAY */
displayCart();

</script></body>
</html>
