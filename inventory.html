<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
}

header{
    background:#0b7a0b;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-buttons button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.dashboard-btn{
    background:#075c07;
}

.logout-btn{
    background:#c62828;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.box{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h1,h2{
    color:#0b7a0b;
}

h2{
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    padding:11px 17px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

.add-btn{
    background:#0b7a0b;
    color:white;
}

.cancel-btn{
    background:#777;
    color:white;
    display:none;
}

.export-btn{
    background:#1565c0;
    color:white;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.summary-card h3{
    color:#0b7a0b;
    margin-bottom:8px;
}

.summary-card p{
    font-size:23px;
    font-weight:bold;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#0b7a0b;
    color:white;
    padding:11px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

.low{
    color:red;
    font-weight:bold;
}

.good{
    color:#0b7a0b;
    font-weight:bold;
}

.edit-btn{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete-btn{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

#message{
    margin-top:12px;
    font-weight:bold;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:21px;
    }

    header{
        gap:12px;
    }
}
</style></head><body><script>
/* LOGIN PROTECTION */
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}
</script><header><div class="logo">
    Goldbizna Inventory
</div>

<div class="header-buttons">

    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</div>

</header><div class="container"><div class="box">

    <h1>Inventory Management</h1>

    <p style="margin-top:5px;">
        Add and manage your business products.
    </p>

</div>

<!-- ADD PRODUCT -->

<div class="box">

    <h2 id="formTitle">
        Add Product
    </h2>

    <div class="form-grid">

        <input
            type="text"
            id="name"
            placeholder="Product Name">

        <input
            type="text"
            id="category"
            placeholder="Category">

        <input
            type="number"
            id="buyingPrice"
            placeholder="Buying Price"
            min="0"
            step="0.01">

        <input
            type="number"
            id="sellingPrice"
            placeholder="Selling Price"
            min="0"
            step="0.01">

        <input
            type="number"
            id="quantity"
            placeholder="Quantity / Stock"
            min="0"
            step="1">

        <input
            type="number"
            id="lowStock"
            placeholder="Low Stock Alert"
            min="0"
            value="5">

    </div>

    <div class="buttons">

        <button
            type="button"
            class="add-btn"
            id="saveButton"
            onclick="saveProduct()">
            Add Product
        </button>

        <button
            type="button"
            class="cancel-btn"
            id="cancelButton"
            onclick="cancelEdit()">
            Cancel
        </button>

        <button
            type="button"
            class="export-btn"
            onclick="exportInventory()">
            Export Inventory
        </button>

    </div>

    <p id="message"></p>

</div>

<!-- SUMMARY -->

<div class="summary">

    <div class="summary-card">
        <h3>Total Products</h3>
        <p id="totalProducts">0</p>
    </div>

    <div class="summary-card">
        <h3>Total Stock</h3>
        <p id="totalStock">0</p>
    </div>

    <div class="summary-card">
        <h3>Stock Value</h3>
        <p id="stockValue">KSh 0</p>
    </div>

</div>

<!-- SEARCH -->

<div class="box">

    <input
        type="text"
        id="search"
        placeholder="Search product or category..."
        oninput="displayProducts()">

</div>

<!-- TABLE -->

<div class="box table-container">

    <h2>Products</h2>

    <table>

        <thead>

            <tr>
                <th>#</th>
                <th>Product</th>
                <th>Category</th>
                <th>Buying Price</th>
                <th>Selling Price</th>
                <th>Stock</th>
                <th>Potential Profit</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody id="inventoryBody"></tbody>

    </table>

</div>

</div><script>

/* ==========================================
   GOLDBIZNA INVENTORY
   ========================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];
let editingIndex = -1;


/* ==========================================
   LOAD INVENTORY SAFELY
   ========================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(INVENTORY_KEY);

        if(!saved){
            inventory = [];
            return;
        }

        const parsed = JSON.parse(saved);

        if(Array.isArray(parsed)){
            inventory = parsed;
        }else{
            inventory = [];
        }

    }catch(error){

        console.error(
            "Inventory loading error:",
            error
        );

        inventory = [];

        localStorage.removeItem(
            INVENTORY_KEY
        );
    }

}


/* ==========================================
   SAVE INVENTORY
   ========================================== */

function saveInventory(){

    try{

        localStorage.setItem(
            INVENTORY_KEY,
            JSON.stringify(inventory)
        );

        return true;

    }catch(error){

        console.error(
            "Inventory saving error:",
            error
        );

        alert(
            "Could not save the product on this device."
        );

        return false;
    }

}


/* ==========================================
   ADD / UPDATE PRODUCT
   ========================================== */

function saveProduct(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const buyingPrice =
        parseFloat(
            document.getElementById("buyingPrice").value
        );

    const sellingPrice =
        parseFloat(
            document.getElementById("sellingPrice").value
        );

    const quantity =
        parseInt(
            document.getElementById("quantity").value,
            10
        );

    const lowStock =
        parseInt(
            document.getElementById("lowStock").value,
            10
        );


    /* VALIDATION */

    if(!name){
        alert("Please enter the product name.");
        return;
    }

    if(!category){
        alert("Please enter the category.");
        return;
    }

    if(
        isNaN(buyingPrice) ||
        buyingPrice < 0
    ){
        alert("Please enter a valid buying price.");
        return;
    }

    if(
        isNaN(sellingPrice) ||
        sellingPrice < 0
    ){
        alert("Please enter a valid selling price.");
        return;
    }

    if(
        isNaN(quantity) ||
        quantity < 0
    ){
        alert("Please enter a valid stock quantity.");
        return;
    }

    if(
        isNaN(lowStock) ||
        lowStock < 0
    ){
        alert("Please enter a valid low-stock level.");
        return;
    }


    /* DUPLICATE CHECK */

    const duplicate =
        inventory.some(function(product,index){

            return(
                String(product.name || "")
                .toLowerCase()
                ===
                name.toLowerCase()
                &&
                index !== editingIndex
            );

        });


    if(duplicate){

        alert(
            "This product already exists. Use Edit to change it."
        );

        return;
    }


    /* CREATE PRODUCT */

    const oldProduct =
        editingIndex >= 0
        ? inventory[editingIndex]
        : null;


    const product = {

        id:
            oldProduct?.id ||
            Date.now(),

        name:name,

        category:category,

        buyingPrice:buyingPrice,

        sellingPrice:sellingPrice,

        quantity:quantity,

        lowStock:lowStock,

        created:
            oldProduct?.created ||
            new Date().toLocaleString()

    };


    /* ADD */

    if(editingIndex === -1){

        inventory.push(product);

        if(saveInventory()){

            showMessage(
                "✓ Product added successfully!",
                "green"
            );

        }

    }

    /* UPDATE */

    else{

        inventory[editingIndex] =
            product;

        if(saveInventory()){

            showMessage(
                "✓ Product updated successfully!",
                "green"
            );

        }

        editingIndex = -1;

    }


    clearForm();

    displayProducts();

}


/* ==========================================
   DISPLAY PRODUCTS
   ========================================== */

function displayProducts(){

    const body =
        document.getElementById(
            "inventoryBody"
        );

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();


    body.innerHTML = "";


    const filtered =
        inventory.filter(function(product){

            const productName =
                String(
                    product.name || ""
                ).toLowerCase();

            const productCategory =
                String(
                    product.category || ""
                ).toLowerCase();

            return(
                productName.includes(search) ||
                productCategory.includes(search)
            );

        });


    if(filtered.length === 0){

        body.innerHTML = `

            <tr>
                <td colspan="9" class="empty">
                    No products found.
                </td>
            </tr>

        `;

    }


    filtered.forEach(function(product,index){

        const realIndex =
            inventory.indexOf(product);


        const stock =
            Number(product.quantity || 0);

        const buying =
            Number(product.buyingPrice || 0);

        const selling =
            Number(product.sellingPrice || 0);

        const lowStock =
            Number(
                product.lowStock ?? 5
            );


        const potentialProfit =
            (selling - buying) * stock;


        const isLow =
            stock <= lowStock;


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(product.name)}
            </td>

            <td>
                ${escapeHTML(product.category)}
            </td>

            <td>
                KSh ${buying.toLocaleString()}
            </td>

            <td>
                KSh ${selling.toLocaleString()}
            </td>

            <td class="${isLow ? "low" : "good"}">
                ${stock}
            </td>

            <td class="${potentialProfit >= 0 ? "good" : "low"}">
                KSh ${potentialProfit.toLocaleString()}
            </td>

            <td>

                ${
                    isLow
                    ?
                    '<span class="low">LOW STOCK</span>'
                    :
                    '<span class="good">IN STOCK</span>'
                }

            </td>

            <td>

                <button
                    type="button"
                    class="edit-btn"
                    onclick="editProduct(${realIndex})">
                    Edit
                </button>

                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteProduct(${realIndex})">
                    Delete
                </button>

            </td>

        `;


        body.appendChild(row);

    });


    updateSummary();

}


/* ==========================================
   SUMMARY
   ========================================== */

function updateSummary(){

    let totalStock = 0;
    let stockValue = 0;


    inventory.forEach(function(product){

        const quantity =
            Number(product.quantity || 0);

        const buying =
            Number(product.buyingPrice || 0);


        totalStock += quantity;

        stockValue +=
            quantity * buying;

    });


    document.getElementById(
        "totalProducts"
    ).innerText =
        inventory.length;


    document.getElementById(
        "totalStock"
    ).innerText =
        totalStock;


    document.getElementById(
        "stockValue"
    ).innerText =
        "KSh " +
        stockValue.toLocaleString();

}


/* ==========================================
   EDIT PRODUCT
   ========================================== */

function editProduct(index){

    const product =
        inventory[index];

    if(!product){
        return;
    }


    document.getElementById("name").value =
        product.name || "";

    document.getElementById("category").value =
        product.category || "";

    document.getElementById("buyingPrice").value =
        product.buyingPrice ?? "";

    document.getElementById("sellingPrice").value =
        product.sellingPrice ?? "";

    document.getElementById("quantity").value =
        product.quantity ?? "";

    document.getElementById("lowStock").value =
        product.lowStock ?? 5;


    editingIndex = index;


    document.getElementById(
        "formTitle"
    ).innerText =
        "Edit Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Update Product";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ==========================================
   CANCEL EDIT
   ========================================== */

function cancelEdit(){

    editingIndex = -1;

    clearForm();

}


/* ==========================================
   DELETE
   ========================================== */

function deleteProduct(index){

    const product =
        inventory[index];


    if(!product){
        return;
    }


    if(!confirm(
        "Delete " +
        product.name +
        " from inventory?"
    )){
        return;
    }


    inventory.splice(index,1);


    saveInventory();

    displayProducts();


    showMessage(
        "Product deleted.",
        "red"
    );

}


/* ==========================================
   CLEAR FORM
   ========================================== */

function clearForm(){

    document.getElementById("name").value = "";

    document.getElementById("category").value = "";

    document.getElementById("buyingPrice").value = "";

    document.getElementById("sellingPrice").value = "";

    document.getElementById("quantity").value = "";

    document.getElementById("lowStock").value = "5";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Add Product";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";

}


/* ==========================================
   EXPORT CSV
   ========================================== */

function exportInventory(){

    if(inventory.length === 0){

        alert(
            "There are no products to export."
        );

        return;
    }


    let csv =
        "Product,Category,Buying Price,Selling Price,Stock,Low Stock Level\n";


    inventory.forEach(function(product){

        csv +=
            csvEscape(product.name) + "," +
            csvEscape(product.category) + "," +
            csvEscape(product.buyingPrice) + "," +
            csvEscape(product.sellingPrice) + "," +
            csvEscape(product.quantity) + "," +
            csvEscape(product.lowStock) +
            "\n";

    });


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        "goldbizna_inventory.csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* ==========================================
   CSV ESCAPE
   ========================================== */

function csvEscape(value){

    const text =
        String(value ?? "");


    if(
        text.includes(",") ||
        text.includes('"') ||
        text.includes("\n")
    ){

        return(
            '"' +
            text.replace(/"/g,'""') +
            '"'
        );

    }


    return text;

}


/* ==========================================
   MESSAGE
   ========================================== */

function showMessage(text,color){

    const message =
        document.getElementById(
            "message"
        );


    message.innerText = text;

    message.style.color = color;


    setTimeout(function(){

        message.innerText = "";

    },3000);

}


/* ==========================================
   HTML SECURITY
   ========================================== */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   LOGOUT
   ========================================== */

function logout(){

    localStorage.removeItem(
        "loggedIn"
    );

    window.location.href =
        "login.html";

}


/* ==========================================
   START INVENTORY
   ========================================== */

loadInventory();

displayProducts();

</script></body>
    </html>
