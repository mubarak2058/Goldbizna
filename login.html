<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Goldbizna Login</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login{
background:#fff;
padding:30px;
width:320px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#0b7a0b;
}

input{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0b7a0b;
color:#fff;
border:none;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#086108;
}
</style>

</head>

<body>

<div class="login">

<h2>Goldbizna Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

const user=document.getElementById("username").value;
const pass=document.getElementById("password").value;

if(user==="admin" && pass==="1234"){

localStorage.setItem("goldbizna_logged_in","true");

window.location.href="dashboard.html";

}else{

alert("Invalid username or password.");

}

}

</script>

</body>
</html>
