<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna POS Professional</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f5;
}

header{
background:#0b7a0b;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:1400px;
margin:20px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.panel{
background:#fff;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
color:#0b7a0b;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

input,
select{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

button{
padding:12px 18px;
background:#0b7a0b;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#086108;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,
td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0b7a0b;
color:#fff;
}

.summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

.total{
font-size:30px;
color:#0b7a0b;
margin:15px 0;
}

.checkout button{
width:100%;
margin-top:10px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<header>
Goldbizna POS Professional
</header>
<div class="container">

<div class="panel">

<h2>New Sale</h2>

<div class="row">

<input
id="customer"
type="text"
placeholder="Customer Name">

<select id="product">

<option value="">Select Product</option>

</select>

<input
id="qty"
type="number"
value="1"
min="1">

<button onclick="addCart()">
Add Item
</button>

</div>

<table>

<thead>

<tr>

<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Action</th>

</tr>

</thead>

<tbody id="cartTable">

</tbody>

</table>

</div>

<div class="panel">

<h2>Checkout</h2>

<div class="summary">
Items:
<span id="itemsCount">0</span>
</div>

<div class="total">
KSh <span id="grandTotal">0.00</span>
</div>

<label>Payment Method</label>

<select id="payment">

<option value="Cash">Cash</option>

<option value="M-Pesa">M-Pesa</option>

</select>

<br><br>

<input
id="cash"
type="number"
placeholder="Cash Received"
oninput="calculateChange()">

<div class="summary">
Change:
KSh <span id="change">0.00</span>
</div>

<div class="checkout">

<button onclick="completeSale()">
Complete Sale
</button>

<button onclick="printReceipt()">
Print Receipt
</button>

</div>

</div>

</div>

<script>
// ===== Goldbizna POS =====

let inventory = JSON.parse(localStorage.getItem("goldbizna_inventory") || "[]");
let sales = JSON.parse(localStorage.getItem("goldbizna_sales") || "[]");
let cart = [];

// HTML Elements
const product = document.getElementById("product");
const qty = document.getElementById("qty");
const customer = document.getElementById("customer");
const cartTable = document.getElementById("cartTable");
const grandTotal = document.getElementById("grandTotal");
const itemsCount = document.getElementById("itemsCount");
const cash = document.getElementById("cash");
const change = document.getElementById("change");

// Load products into dropdown
function loadProducts(){

product.innerHTML = "<option value=''>Select Product</option>";

inventory.forEach(item=>{

if(Number(item.q)>0){

let option=document.createElement("option");

option.value=item.n;

option.textContent=
item.n+
" | KSh "+
item.s+
" | Stock: "+
item.q;

product.appendChild(option);

}

});

}

// Add product to cart
function addCart(){

if(product.value===""){

alert("Please select a product.");

return;

}

let item=inventory.find(x=>x.n===product.value);

let quantity=Number(qty.value);

if(quantity<=0){

alert("Enter a valid quantity.");

return;

}

if(quantity>Number(item.q)){

alert("Not enough stock.");

return;

}

cart.push({

name:item.n,

price:Number(item.s),

qty:quantity,

total:Number(item.s)*quantity

});

renderCart();

product.selectedIndex=0;

qty.value=1;

  }
// Render Cart
function renderCart(){

cartTable.innerHTML="";

let total=0;
let items=0;

cart.forEach((item,index)=>{

total+=item.total;
items+=item.qty;

cartTable.innerHTML+=`
<tr>
<td>${item.name}</td>
<td>${item.qty}</td>
<td>KSh ${item.price.toFixed(2)}</td>
<td>KSh ${item.total.toFixed(2)}</td>
<td>
<button onclick="removeItem(${index})">
Remove
</button>
</td>
</tr>
`;

});

itemsCount.textContent=items;
grandTotal.textContent=total.toFixed(2);

calculateChange();

}

// Remove Item
function removeItem(index){

cart.splice(index,1);

renderCart();

}

// Calculate Change
function calculateChange(){

let total=Number(grandTotal.textContent);

let paid=Number(cash.value||0);

let balance=paid-total;

change.textContent=balance.toFixed(2);

if(balance<0){

change.style.color="red";

}else{

change.style.color="green";

}

}
// Complete Sale
function completeSale(){

if(cart.length===0){
alert("Cart is empty.");
return;
}

let total=Number(grandTotal.textContent);

let sale={

date:new Date().toLocaleString(),

customer:customer.value.trim()==="" ? "Walk-in Customer" : customer.value,

payment:document.getElementById("payment").value,

items:[],

total:total

};

// Reduce stock
cart.forEach(cartItem=>{

let productItem=inventory.find(p=>p.n===cartItem.name);

if(productItem){

productItem.q=Number(productItem.q)-cartItem.qty;

}

sale.items.push({

name:cartItem.name,

qty:cartItem.qty,

price:cartItem.price,

total:cartItem.total

});

});

// Save inventory
localStorage.setItem(
"goldbizna_inventory",
JSON.stringify(inventory)
);

// Save sales
sales.push(sale);

localStorage.setItem(
"goldbizna_sales",
JSON.stringify(sales)
);

// Save last receipt
localStorage.setItem(
"goldbizna_last_receipt",
JSON.stringify(sale)
);

// Clear cart
cart=[];

customer.value="";
cash.value="";
product.selectedIndex=0;
qty.value=1;

renderCart();

loadProducts();

alert("Sale completed successfully.");

  }
// Print Receipt
function printReceipt(){

let receipt=JSON.parse(
localStorage.getItem("goldbizna_last_receipt") || "null"
);

if(!receipt){

alert("No receipt available.");

return;

}

let html=`
<html>
<head>
<title>Receipt</title>
<style>
body{
font-family:Arial;
padding:20px;
}
h2{
text-align:center;
}
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}
th,td{
border:1px solid #000;
padding:6px;
text-align:left;
}
</style>
</head>
<body>

<h2>Goldbizna POS</h2>

<p><strong>Date:</strong> ${receipt.date}</p>

<p><strong>Customer:</strong> ${receipt.customer}</p>

<p><strong>Payment:</strong> ${receipt.payment}</p>

<table>

<tr>

<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>

</tr>

${receipt.items.map(item=>`
<tr>
<td>${item.name}</td>
<td>${item.qty}</td>
<td>KSh ${item.price.toFixed(2)}</td>
<td>KSh ${item.total.toFixed(2)}</td>
</tr>
`).join("")}

</table>

<h3>Total: KSh ${Number(receipt.total).toFixed(2)}</h3>

<p style="text-align:center;">
Thank you for shopping with Goldbizna.
</p>

</body>
</html>
`;

let w=window.open("","Receipt","width=400,height=700");

w.document.open();
w.document.write(html);
w.document.close();

w.print();

}

// Start POS
loadProducts();

renderCart();

</script>

</body>
</html>
