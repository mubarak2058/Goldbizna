
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087a0b">
<title>MABROUK TRADER'S - Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%}
body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#064f08,#087a0b,#0b9910);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.login-card{
  width:min(420px,100%);
  background:white;
  border-radius:18px;
  padding:30px 25px;
  box-shadow:0 12px 40px rgba(0,0,0,.30);
  text-align:center;
}
.logo{
  width:72px;height:72px;
  margin:0 auto 14px;
  border-radius:50%;
  background:#087a0b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}
h1{color:#087a0b;font-size:24px;margin-bottom:5px}
.subtitle{color:#777;font-size:13px;margin-bottom:24px}
.field{text-align:left;margin-bottom:15px}
.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
  color:#333;
}
.field input{
  width:100%;
  padding:13px;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:16px;
  outline:none;
}
.field input:focus{
  border-color:#087a0b;
  box-shadow:0 0 0 2px rgba(8,122,11,.12);
}
.login-btn{
  width:100%;
  border:0;
  background:#087a0b;
  color:white;
  padding:14px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.error{
  display:none;
  background:#ffebee;
  color:#b71c1c;
  padding:11px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:13px;
  text-align:left;
  line-height:1.45;
}
.loading{
  display:none;
  color:#087a0b;
  font-size:13px;
  margin-top:12px;
}
.footer{margin-top:20px;font-size:11px;color:#888}
.shield{margin-top:13px;font-size:11px;color:#087a0b;font-weight:bold}
</style>
</head>

<body>

<main class="login-card">

<div class="logo">M</div>

<h1>MABROUK TRADER'S</h1>
<div class="subtitle">Secure Business Management System</div>

<div id="error" class="error" role="alert"></div>

<form id="loginForm">

<div class="field">
<label for="username">Username or Email</label>
<input
id="username"
type="text"
placeholder="Enter your username or email"
autocomplete="username"
autocapitalize="none"
spellcheck="false"
required>
</div>

<div class="field">
<label for="password">Shared Login Password</label>
<input
id="password"
type="password"
placeholder="Enter your password"
autocomplete="current-password"
required>
</div>

<button id="loginBtn" class="login-btn" type="submit">
LOGIN
</button>

<div id="loading" class="loading">
Verifying your account and permissions...
</div>

</form>

<div class="shield">🔒 One Login • Personal Access Permissions</div>
<div class="footer">MABROUK TRADER'S POS Pro</div>

</main>

<script type="module">

import { auth, db } from "./firebase.js";

import {
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
doc,
getDoc,
collection,
getDocs,
query,
where
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const form = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const errorBox = document.getElementById("error");
const loading = document.getElementById("loading");

let busy = false;
let redirecting = false;

const PAGE_PERMISSIONS = {
"index.html":"Dashboard",
"dashboard.html":"Dashboard",
"pos.html":"POS",
"inventory.html":"Inventory",
"customers.html":"Customers",
"sales.html":"Sales History",
"sales-history.html":"Sales History",
"reports.html":"Reports",
"savings.html":"Savings",
"payments.html":"Payments",
"settings.html":"Settings",
"users.html":"User Management"
};

function showError(message){
errorBox.textContent = message;
errorBox.style.display = "block";
}

function hideError(){
errorBox.textContent = "";
errorBox.style.display = "none";
}

function setBusy(value){
busy = value;
loginBtn.disabled = value;
loginBtn.textContent = value ? "PLEASE WAIT..." : "LOGIN";
loading.style.display = value ? "block" : "none";
}

function isAdmin(profile){
return ["Owner/Admin","Owner","Admin"].includes(profile.role);
}

async function findEmail(username){

const normalized = username.trim().toLowerCase();

if(normalized.includes("@")){
return normalized;
}

// Username index
try{

const usernameSnap = await getDoc(
doc(db,"usernames",normalized)
);

if(usernameSnap.exists()){

const data = usernameSnap.data();

if(data.email){
return data.email.trim().toLowerCase();
}
}

}catch(error){
console.warn("Username index:",error);
}

// Existing users collection
try{

const usersQuery = query(
collection(db,"users"),
where("username","==",normalized)
);

const result = await getDocs(usersQuery);

if(!result.empty){

const data = result.docs[0].data();

if(data.email){
return data.email.trim().toLowerCase();
}
}

}catch(error){
console.warn("Username search:",error);
}

return "";
}

async function verifyAccount(user){

const profileSnap = await getDoc(
doc(db,"users",user.uid)
);

if(!profileSnap.exists()){
throw new Error("STAFF_PROFILE_MISSING");
}

const profile = profileSnap.data();

if(
profile.active !== true &&
profile.status !== "active"
){
throw new Error("ACCOUNT_DISABLED");
}

return profile;
}

function hasAccess(profile,permission){

if(isAdmin(profile)) return true;

return profile.permissions?.[permission] === true;
}

function getFirstAllowedPage(profile){

if(isAdmin(profile)){
return "index.html";
}

if(hasAccess(profile,"Dashboard")){
return "index.html";
}

for(const [page,permission] of Object.entries(PAGE_PERMISSIONS)){

if(hasAccess(profile,permission)){
return page;
}

}

return null;
}

function redirect(page){

if(redirecting) return;

redirecting = true;
window.location.replace(page);

}

// ALREADY LOGGED IN
onAuthStateChanged(auth,async user=>{

if(busy || redirecting) return;

if(!user) return;

try{

const profile = await verifyAccount(user);
const destination = getFirstAllowedPage(profile);

if(destination){
redirect(destination);
}else{
await signOut(auth);
showError("No page permissions assigned. Contact the owner.");
}

}catch(error){

console.error(error);
await signOut(auth);

if(error.message === "ACCOUNT_DISABLED"){
showError("Your account is disabled.");
}else{
showError("Account verification failed. Contact the owner.");
}

}

});

// LOGIN
form.addEventListener("submit",async event=>{

event.preventDefault();

if(busy || redirecting) return;

hideError();

const username = usernameInput.value.trim();
const password = passwordInput.value;

if(!username || !password){
showError("Enter your username and password.");
return;
}

setBusy(true);

try{

const email = await findEmail(username);

if(!email){
throw new Error("USERNAME_NOT_FOUND");
}

const credential = await signInWithEmailAndPassword(
auth,
email,
password
);

const profile = await verifyAccount(credential.user);

const destination = getFirstAllowedPage(profile);

if(!destination){
throw new Error("NO_PERMISSION");
}

// Save display information only.
// Firebase Authentication remains the actual login authority.
localStorage.setItem(
"goldbizna_username",
profile.username || username
);

passwordInput.value = "";

redirect(destination);

}catch(error){

console.error("Login failed:",error);

if(auth.currentUser){
await signOut(auth);
}

let message = "Unable to log in. Please try again.";

if(error.message === "USERNAME_NOT_FOUND"){
message = "Username not found. Check your username or use your email.";
}

if(error.message === "ACCOUNT_DISABLED"){
message = "Your account is disabled. Contact the owner.";
}

if(error.message === "STAFF_PROFILE_MISSING"){
message = "Your staff profile is missing. Contact the owner.";
}

if(error.message === "NO_PERMISSION"){
message = "You have no assigned page permissions.";
}

if(error.code === "auth/invalid-credential"){
message = "Incorrect username or password.";
}

if(error.code === "auth/too-many-requests"){
message = "Too many attempts. Try again later.";
}

if(error.code === "auth/network-request-failed"){
message = "Internet connection problem.";
}

showError(message);

passwordInput.value = "";
setBusy(false);

}

});

</script>

</body>
</html>
