<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#087a0b,#003d06);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0005;text-align:center}
h2{color:#087a0b;margin:0 0 6px}
p{color:#666}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#087a0b;color:#fff;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
#msg{margin-top:15px;padding:12px;border-radius:8px;display:none;word-break:break-word}
</style>
</head>

<body>

<div class="card">
<h2>MABROUK TRADER'S</h2>
<p>Secure Business Login</p>

<input id="email" type="email"
placeholder="Email"
value="mubarakjumamasoud@gmail.com"
autocomplete="username">

<input id="password" type="password"
placeholder="Password"
autocomplete="current-password">

<button id="login">LOGIN</button>

<div id="msg"></div>
</div>

<script type="module">

import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getAuth,
signInWithEmailAndPassword
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getFirestore,
doc,
setDoc,
getDoc,
serverTimestamp
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA8XB6aY45-yHT0uZ6NUhptMoNkYqgwqOs",
authDomain:"goldbizna.firebaseapp.com",
projectId:"goldbizna",
storageBucket:"goldbizna.firebasestorage.app",
messagingSenderId:"559981054862",
appId:"1:559981054862:web:0635c689607d3baa3272df",
measurementId:"G-95XL3BNQJF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_UID="szplJ5HPQWbysc7mkBWN1KPVwC22";
const ADMIN_EMAIL="mubarakjumamasoud@gmail.com";

const permissions={
Dashboard:true,
POS:true,
Inventory:true,
Customers:true,
"Sales History":true,
Reports:true,
Savings:true,
Payments:true,
Discounts:true,
"Refunds/Voids":true,
"Stock Adjustments":true,
"User Management":true,
Settings:true,
"Backup & Restore":true
};

const email=document.getElementById("email");
const password=document.getElementById("password");
const btn=document.getElementById("login");
const msg=document.getElementById("msg");

function show(text,good=false){
msg.textContent=text;
msg.style.display="block";
msg.style.background=good?"#e5f7e7":"#ffe7e7";
msg.style.color=good?"#087a0b":"#b00000";
}

btn.onclick=async()=>{

const mail=email.value.trim();
const pass=password.value;

if(!mail||!pass){
show("Enter your email and password.");
return;
}

btn.disabled=true;
btn.textContent="LOGGING IN...";
msg.style.display="none";

try{

const result=await signInWithEmailAndPassword(
auth,
mail,
pass
);

const user=result.user;

if(user.uid===ADMIN_UID&&user.email===ADMIN_EMAIL){

await setDoc(
doc(db,"users",ADMIN_UID),
{
uid:ADMIN_UID,
fullName:"Mubarak",
username:"admin",
email:ADMIN_EMAIL,
phone:"",
role:"Owner/Admin",
status:"active",
permissions:permissions,
updatedAt:serverTimestamp()
},
{merge:true}
);

await setDoc(
doc(db,"usernames","admin"),
{
uid:ADMIN_UID,
email:ADMIN_EMAIL,
username:"admin",
updatedAt:serverTimestamp()
},
{merge:true}
);

localStorage.setItem("goldbizna_logged_in","true");
localStorage.setItem("goldbizna_uid",ADMIN_UID);
localStorage.setItem("goldbizna_username","admin");
localStorage.setItem("goldbizna_role","Owner/Admin");

show("✅ Welcome Mubarak — Owner/Admin",true);

setTimeout(()=>{
location.href="index.html";
},800);

return;
}

const profile=await getDoc(doc(db,"users",user.uid));

if(!profile.exists()){
show("❌ Your Firebase account has no user profile yet.");
btn.disabled=false;
btn.textContent="LOGIN";
return;
}

const data=profile.data();

if(data.status==="disabled"){
show("❌ This account is disabled.");
btn.disabled=false;
btn.textContent="LOGIN";
return;
}

localStorage.setItem("goldbizna_logged_in","true");
localStorage.setItem("goldbizna_uid",user.uid);
localStorage.setItem("goldbizna_username",data.username||"");
localStorage.setItem("goldbizna_role",data.role||"");

show("✅ Login successful",true);

setTimeout(()=>{
location.href="index.html";
},800);

}catch(error){

console.error(error);

if(error.code==="auth/invalid-credential"){
show("❌ Incorrect email or password.");
}else if(error.code==="auth/user-disabled"){
show("❌ This Firebase account is disabled.");
}else{
show("❌ "+error.code+" — "+error.message);
}

password.value="";
btn.disabled=false;
btn.textContent="LOGIN";

}

};

password.addEventListener("keydown",e=>{
if(e.key==="Enter")btn.click();
});

</script>

</body>
</html>
