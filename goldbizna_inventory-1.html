<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna POS - Inventory</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7f5;color:#222}
header{background:#0b7a0b;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header h1{font-size:22px}.back-btn{background:white;color:#0b7a0b;border:none;padding:9px 14px;border-radius:6px;font-weight:bold;cursor:pointer}
.container{max-width:1200px;margin:auto;padding:20px}.top-section{display:flex;justify-content:space-between;gap:15px;margin-bottom:20px;flex-wrap:wrap}
.search{flex:1;min-width:220px}.search input{width:100%;padding:13px;border:1px solid #ccc;border-radius:7px;font-size:15px}
.add-btn{background:#0b7a0b;color:white;border:none;padding:13px 20px;border-radius:7px;cursor:pointer;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card{background:white;padding:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{font-size:14px;color:#666;margin-bottom:8px}.card p{font-size:22px;font-weight:bold;color:#0b7a0b}
.table-box{background:white;border-radius:10px;overflow-x:auto;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px;border-bottom:1px solid #eee;text-align:left}th{background:#0b7a0b;color:white}
tr:hover{background:#f7faf7}.action-btn{border:none;padding:7px 10px;border-radius:5px;cursor:pointer;margin-right:4px;font-weight:bold}.edit{background:#e7f0ff;color:#1455b8}.delete{background:#ffe7e7;color:#c40000}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);justify-content:center;align-items:center;padding:15px;z-index:100}
.modal-content{background:white;width:100%;max-width:500px;padding:22px;border-radius:12px;max-height:90vh;overflow-y:auto}.modal-content h2{margin-bottom:18px;color:#0b7a0b}
.form-group{margin-bottom:13px}.form-group label{display:block;margin-bottom:6px;font-weight:bold}.form-group input{width:100%;padding:11px;border:1px solid #ccc;border-radius:6px;font-size:15px}
.modal-buttons{display:flex;gap:10px;margin-top:18px}.save-btn,.cancel-btn{flex:1;padding:12px;border:none;border-radius:6px;cursor:pointer;font-weight:bold}.save-btn{background:#0b7a0b;color:white}.cancel-btn{background:#ddd}
.empty{text-align:center;padding:30px;color:#777}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){header h1{font-size:18px}.container{padding:12px}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.card p{font-size:18px}.add-btn{width:100%}}
</style>
</head>
<body>
<header><h1>📦 Goldbizna Inventory</h1><button class="back-btn" onclick="goHome()">← Home</button></header>
<div class="container">
<div class="top-section"><div class="search"><input type="text" id="searchInput" placeholder="Search products..." oninput="displayInventory()"></div><button class="add-btn" onclick="openAddModal()">+ Add Product</button></div>
<div class="cards">
<div class="card"><h3>Total Products</h3><p id="totalProducts">0</p></div>
<div class="card"><h3>Total Stock</h3><p id="totalStock">0</p></div>
<div class="card"><h3>Stock Value</h3><p id="stockValue">KSh 0.00</p></div>
<div class="card"><h3>Low Stock</h3><p id="lowStock">0</p></div>
</div>
<div class="table-box"><table><thead><tr><th>#</th><th>Product</th><th>Category</th><th>Quantity</th><th>Buying Price</th><th>Selling Price</th><th>Stock Value</th><th>Actions</th></tr></thead><tbody id="inventoryTable"></tbody></table></div>
</div>
<div class="modal" id="productModal"><div class="modal-content">
<h2 id="modalTitle">Add Product</h2>
<div class="form-group"><label>Product Name</label><input type="text" id="productName" placeholder="e.g. Sugar"></div>
<div class="form-group"><label>Category</label><input type="text" id="category" placeholder="e.g. Food"></div>
<div class="form-group"><label>Quantity</label><input type="number" id="quantity" min="0" placeholder="0"></div>
<div class="form-group"><label>Buying Price (KSh)</label><input type="number" id="buyingPrice" min="0" step="0.01" placeholder="0"></div>
<div class="form-group"><label>Selling Price (KSh)</label><input type="number" id="sellingPrice" min="0" step="0.01" placeholder="0"></div>
<div class="modal-buttons"><button class="cancel-btn" onclick="closeModal()">Cancel</button><button class="save-btn" onclick="saveProduct()">Save Product</button></div>
</div></div>
<script>
const STORAGE_KEY="goldbizna_inventory";let inventory=[],editingIndex=-1;
function loadInventory(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){inventory=JSON.parse(saved);if(!Array.isArray(inventory))inventory=[]}}catch(e){inventory=[]}displayInventory()}
function saveInventory(){localStorage.setItem(STORAGE_KEY,JSON.stringify(inventory))}
function displayInventory(){
const table=document.getElementById("inventoryTable"),search=document.getElementById("searchInput").value.toLowerCase().trim();table.innerHTML="";
const filtered=inventory.filter(p=>String(p.name||"").toLowerCase().includes(search)||String(p.category||"").toLowerCase().includes(search));
filtered.forEach((p,i)=>{const realIndex=inventory.indexOf(p),q=Number(p.quantity)||0,b=Number(p.buyingPrice)||0,s=Number(p.sellingPrice)||0;
const row=document.createElement("tr");row.innerHTML=`<td>${i+1}</td><td><strong>${escapeHTML(p.name)}</strong></td><td>${escapeHTML(p.category||"-")}</td><td>${q}</td><td>KSh ${b.toFixed(2)}</td><td>KSh ${s.toFixed(2)}</td><td>KSh ${(q*b).toFixed(2)}</td><td><button class="action-btn edit" onclick="editProduct(${realIndex})">✏️</button><button class="action-btn delete" onclick="deleteProduct(${realIndex})">🗑️</button></td>`;table.appendChild(row)});
if(!filtered.length)table.innerHTML='<tr><td colspan="8" class="empty">No products found.</td></tr>';
document.getElementById("totalProducts").textContent=inventory.length;
document.getElementById("totalStock").textContent=inventory.reduce((a,p)=>a+(Number(p.quantity)||0),0);
document.getElementById("stockValue").textContent="KSh "+inventory.reduce((a,p)=>a+(Number(p.quantity)||0)*(Number(p.buyingPrice)||0),0).toFixed(2);
document.getElementById("lowStock").textContent=inventory.filter(p=>(Number(p.quantity)||0)<=5).length;
}
function openAddModal(){editingIndex=-1;document.getElementById("modalTitle").textContent="Add Product";clearForm();document.getElementById("productModal").style.display="flex"}
function editProduct(i){if(i<0||i>=inventory.length)return;editingIndex=i;const p=inventory[i];document.getElementById("modalTitle").textContent="Edit Product";document.getElementById("productName").value=p.name||"";document.getElementById("category").value=p.category||"";document.getElementById("quantity").value=p.quantity||0;document.getElementById("buyingPrice").value=p.buyingPrice||0;document.getElementById("sellingPrice").value=p.sellingPrice||0;document.getElementById("productModal").style.display="flex"}
function saveProduct(){
const name=document.getElementById("productName").value.trim(),category=document.getElementById("category").value.trim(),quantity=Number(document.getElementById("quantity").value),buyingPrice=Number(document.getElementById("buyingPrice").value),sellingPrice=Number(document.getElementById("sellingPrice").value);
if(!name)return alert("Please enter the product name.");if(isNaN(quantity)||quantity<0)return alert("Please enter a valid quantity.");if(isNaN(buyingPrice)||buyingPrice<0)return alert("Please enter a valid buying price.");if(isNaN(sellingPrice)||sellingPrice<0)return alert("Please enter a valid selling price.");
const p={name,category,quantity,buyingPrice,sellingPrice};if(editingIndex===-1)inventory.push(p);else inventory[editingIndex]=p;saveInventory();displayInventory();closeModal()
}
function deleteProduct(i){if(i<0||i>=inventory.length)return;if(confirm("Delete "+inventory[i].name+" from inventory?")){inventory.splice(i,1);saveInventory();displayInventory()}}
function closeModal(){document.getElementById("productModal").style.display="none";clearForm();editingIndex=-1}
function clearForm(){["productName","category","quantity","buyingPrice","sellingPrice"].forEach(id=>document.getElementById(id).value="")}
function escapeHTML(v){const d=document.createElement("div");d.textContent=v;return d.innerHTML}
function goHome(){window.location.href="index.html"}
document.getElementById("productModal").addEventListener("click",function(e){if(e.target===this)closeModal()});
loadInventory();
</script>
</body>
</html>
