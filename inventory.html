<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#087a0b;
    color:white;
    padding:16px;
}

.header{
    max-width:1300px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:4px;
}

.header-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
}

.dashboard{
    background:#075c07;
    color:white;
}

.logout{
    background:#c62828;
    color:white;
}

.container{
    max-width:1300px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
    color:#087a0b;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

input:focus{
    outline:none;
    border:2px solid #087a0b;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.add{
    background:#087a0b;
    color:white;
}

.cancel{
    background:#777;
    color:white;
    display:none;
}

.clear{
    background:#555;
    color:white;
}

.export{
    background:#1565c0;
    color:white;
}

.message{
    margin-top:15px;
    min-height:22px;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.summary-card h3{
    color:#087a0b;
    margin-bottom:8px;
}

.summary-card strong{
    font-size:25px;
}

.search{
    margin:0;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#087a0b;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.low{
    color:#c62828;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(max-width:850px){
    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .summary{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }
}
</style>
</head>

<body>

<header>
<div class="header">

<div>
<div class="logo">GOLDBIZNA INVENTORY PRO</div>
<div class="subtitle">Fast Business Inventory Management</div>
</div>

<div class="header-buttons">
<button type="button" id="dashboardButton" class="dashboard">
Dashboard
</button>

<button type="button" id="logoutButton" class="logout">
Logout
</button>
</div>

</div>
</header>


<div class="container">

<!-- FORM -->
<div class="card">

<div class="title" id="formTitle">
Add New Product
</div>

<div class="form-grid">

<div>
<label>Product Name</label>
<input id="productName" type="text" placeholder="e.g. Sugar">
</div>

<div>
<label>Category</label>
<input id="productCategory" type="text" placeholder="e.g. Food">
</div>

<div>
<label>Buying Price</label>
<input id="buyingPrice" type="number" min="0" step="0.01" placeholder="e.g. 120">
</div>

<div>
<label>Selling Price</label>
<input id="sellingPrice" type="number" min="0" step="0.01" placeholder="e.g. 150">
</div>

<div>
<label>Stock Quantity</label>
<input id="quantity" type="number" min="0" step="1" placeholder="e.g. 20">
</div>

<div>
<label>Low Stock Alert</label>
<input id="lowStock" type="number" min="0" step="1" value="5">
</div>

</div>

<div class="actions">

<button type="button" id="addButton" class="add">
➕ Add Product
</button>

<button type="button" id="cancelButton" class="cancel">
Cancel
</button>

<button type="button" id="clearButton" class="clear">
Clear
</button>

<button type="button" id="exportButton" class="export">
⬇ Export CSV
</button>

</div>

<div id="message" class="message"></div>

</div>


<!-- SUMMARY -->
<div class="summary">

<div class="summary-card">
<h3>Total Products</h3>
<strong id="totalProducts">0</strong>
</div>

<div class="summary-card">
<h3>Total Stock</h3>
<strong id="totalStock">0</strong>
</div>

<div class="summary-card">
<h3>Stock Value</h3>
<strong id="stockValue">KSh 0</strong>
</div>

</div>


<!-- SEARCH -->
<div class="card">

<div class="title">
Search Inventory
</div>

<input
id="search"
class="search"
type="search"
placeholder="🔎 Search product or category..."
autocomplete="off">

</div>


<!-- PRODUCTS -->
<div class="card">

<div class="title">
Products
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>#</th>
<th>Product</th>
<th>Category</th>
<th>Buying</th>
<th>Selling</th>
<th>Stock</th>
<th>Profit</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="inventoryBody"></tbody>

</table>

</div>
</div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

"use strict";

/* =========================================
   GOLD BIZNA STORAGE
   ========================================= */

const STORAGE_KEY = "goldbizna_inventory";

let inventory = [];
let editingId = null;


/* =========================================
   GET ELEMENT
   ========================================= */

function el(id){
    return document.getElementById(id);
}


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text,type){

    const box = el("message");

    box.textContent = text;

    if(type === "success"){
        box.style.color = "#087a0b";
    }
    else if(type === "error"){
        box.style.color = "#c62828";
    }
    else{
        box.style.color = "#1565c0";
    }
}


/* =========================================
   NUMBER
   ========================================= */

function number(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;
}


/* =========================================
   MONEY
   ========================================= */

function money(value){

    return number(value).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );
}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHTML(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   LOAD INVENTORY
   ========================================= */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved === null || saved === ""){

            inventory = [];

        }else{

            const parsed =
                JSON.parse(saved);

            if(Array.isArray(parsed)){

                inventory = parsed;

            }else{

                inventory = [];

            }
        }

        displayProducts();

        showMessage(
            "Inventory ready.",
            "info"
        );

    }catch(error){

        console.error(error);

        inventory = [];

        displayProducts();

        showMessage(
            "Inventory storage is unavailable. Products can still be entered, but your browser may be blocking storage.",
            "error"
        );
    }
}


/* =========================================
   SAVE INVENTORY
   ========================================= */

function saveInventory(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(inventory)
        );

        /* Verify that the browser actually saved it */

        const check =
            localStorage.getItem(STORAGE_KEY);

        if(check === null){

            throw new Error(
                "Storage verification failed"
            );
        }

        return true;

    }catch(error){

        console.error(error);

        showMessage(
            "Could not save inventory. Browser storage is blocked.",
            "error"
        );

        return false;
    }
}


/* =========================================
   SAVE PRODUCT
   ========================================= */

function saveProduct(){

    const name =
        el("productName").value.trim();

    const category =
        el("productCategory").value.trim();

    const buying =
        Number(el("buyingPrice").value);

    const selling =
        Number(el("sellingPrice").value);

    const quantity =
        Number(el("quantity").value);

    const lowStock =
        Number(el("lowStock").value);


    if(!name){

        showMessage(
            "Please enter the product name.",
            "error"
        );

        el("productName").focus();

        return;
    }


    if(!category){

        showMessage(
            "Please enter the category.",
            "error"
        );

        el("productCategory").focus();

        return;
    }


    if(!Number.isFinite(buying) || buying < 0){

        showMessage(
            "Please enter a valid buying price.",
            "error"
        );

        return;
    }


    if(!Number.isFinite(selling) || selling < 0){

        showMessage(
            "Please enter a valid selling price.",
            "error"
        );

        return;
    }


    if(!Number.isFinite(quantity) || quantity < 0){

        showMessage(
            "Please enter a valid stock quantity.",
            "error"
        );

        return;
    }


    if(!Number.isFinite(lowStock) || lowStock < 0){

        showMessage(
            "Please enter a valid low-stock level.",
            "error"
        );

        return;
    }


    /* =====================================
       EDIT PRODUCT
       ===================================== */

    if(editingId !== null){

        const index =
            inventory.findIndex(function(item){

                return String(item.id) ===
                       String(editingId);

            });


        if(index === -1){

            showMessage(
                "Product not found.",
                "error"
            );

            editingId = null;

            updateForm();

            return;
        }


        inventory[index].name = name;
        inventory[index].category = category;
        inventory[index].buyingPrice = buying;
        inventory[index].sellingPrice = selling;
        inventory[index].quantity = quantity;
        inventory[index].lowStock = lowStock;


        if(saveInventory()){

            showMessage(
                "✓ Product updated successfully!",
                "success"
            );

            editingId = null;

            clearForm();

            updateForm();

            displayProducts();
        }

        return;
    }


    /* =====================================
       DUPLICATE CHECK
       ===================================== */

    const duplicate =
        inventory.some(function(item){

            return String(item.name || "")
                .trim()
                .toLowerCase()
                ===
                name.toLowerCase();

        });


    if(duplicate){

        showMessage(
            "This product already exists.",
            "error"
        );

        return;
    }


    /* =====================================
       CREATE PRODUCT
       ===================================== */

    const product = {

        id:
            Date.now().toString() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8),

        name:name,

        category:category,

        buyingPrice:buying,

        sellingPrice:selling,

        quantity:quantity,

        lowStock:lowStock,

        created:
            new Date().toISOString()
    };


    inventory.push(product);


    if(!saveInventory()){

        inventory.pop();

        return;
    }


    showMessage(
        "✓ " + name + " added successfully!",
        "success"
    );


    clearForm();

    displayProducts();

    el("productName").focus();
}


/* =========================================
   CLEAR FORM
   ========================================= */

function clearForm(){

    el("productName").value = "";
    el("productCategory").value = "";
    el("buyingPrice").value = "";
    el("sellingPrice").value = "";
    el("quantity").value = "";
    el("lowStock").value = "5";
}


/* =========================================
   FORM MODE
   ========================================= */

function updateForm(){

    if(editingId === null){

        el("formTitle").textContent =
            "Add New Product";

        el("addButton").textContent =
            "➕ Add Product";

        el("cancelButton").style.display =
            "none";

    }else{

        el("formTitle").textContent =
            "Edit Product";

        el("addButton").textContent =
            "💾 Update Product";

        el("cancelButton").style.display =
            "inline-block";
    }
}


/* =========================================
   DISPLAY PRODUCTS
   ========================================= */

function displayProducts(){

    const body =
        el("inventoryBody");

    const search =
        el("search")
        .value
        .trim()
        .toLowerCase();


    body.innerHTML = "";


    const results =
        inventory.filter(function(product){

            const name =
                String(product.name || "")
                .toLowerCase();

            const category =
                String(product.category || "")
                .toLowerCase();

            return(
                name.includes(search) ||
                category.includes(search)
            );
        });


    if(results.length === 0){

        const row =
            document.createElement("tr");

        const cell =
            document.createElement("td");

        cell.colSpan = 9;

        cell.className = "empty";

        if(inventory.length === 0){

            cell.textContent =
                "No products yet. Add your first product above.";

        }else{

            cell.textContent =
                "No products match your search.";
        }

        row.appendChild(cell);

        body.appendChild(row);

        updateSummary();

        return;
    }


    results.forEach(function(product,index){

        const stock =
            number(product.quantity);

        const buying =
            number(product.buyingPrice);

        const selling =
            number(product.sellingPrice);

        const low =
            number(product.lowStock) || 5;

        const profit =
            (selling - buying) * stock;

        const isLow =
            stock <= low;


        const row =
            document.createElement("tr");


        row.innerHTML =

            "<td>" +
            (index + 1) +
            "</td>" +

            "<td><strong>" +
            escapeHTML(product.name) +
            "</strong></td>" +

            "<td>" +
            escapeHTML(product.category) +
            "</td>" +

            "<td>KSh " +
            money(buying) +
            "</td>" +

            "<td>KSh " +
            money(selling) +
            "</td>" +

            '<td class="' +
            (isLow ? "low" : "good") +
            '">' +
            stock +
            "</td>" +

            '<td class="' +
            (profit >= 0 ? "good" : "low") +
            '">' +
            "KSh " +
            money(profit) +
            "</td>" +

            '<td class="' +
            (isLow ? "low" : "good") +
            '">' +
            (isLow ? "LOW STOCK" : "IN STOCK") +
            "</td>" +

            "<td>" +

            '<button type="button" ' +
            'class="edit" ' +
            'data-edit="' +
            escapeHTML(product.id) +
            '">' +
            "Edit" +
            "</button>" +

            '<button type="button" ' +
            'class="delete" ' +
            'data-delete="' +
            escapeHTML(product.id) +
            '">' +
            "Delete" +
            "</button>" +

            "</td>";


        body.appendChild(row);

    });


    updateSummary();
}


/* =========================================
   SUMMARY
   ========================================= */

function updateSummary(){

    let totalStock = 0;
    let stockValue = 0;


    inventory.forEach(function(product){

        const quantity =
            number(product.quantity);

        const buying =
            number(product.buyingPrice);


        totalStock += quantity;

        stockValue +=
            quantity * buying;

    });


    el("totalProducts").textContent =
        inventory.length;

    el("totalStock").textContent =
        totalStock;

    el("stockValue").textContent =
        "KSh " + money(stockValue);
}


/* =========================================
   EDIT
   ========================================= */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        showMessage(
            "Product not found.",
            "error"
        );

        return;
    }


    editingId = product.id;


    el("productName").value =
        product.name || "";

    el("productCategory").value =
        product.category || "";

    el("buyingPrice").value =
        product.buyingPrice ?? "";

    el("sellingPrice").value =
        product.sellingPrice ?? "";

    el("quantity").value =
        product.quantity ?? "";

    el("lowStock").value =
        product.lowStock ?? 5;


    updateForm();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   DELETE
   ========================================= */

function deleteProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){
        return;
    }


    if(!confirm(
        "Delete " + product.name + "?"
    )){
        return;
    }


    const oldInventory =
        inventory.slice();


    inventory =
        inventory.filter(function(item){

            return String(item.id) !==
                   String(id);

        });


    if(!saveInventory()){

        inventory = oldInventory;

        return;
    }


    showMessage(
        "✓ Product deleted.",
        "success"
    );


    displayProducts();
}


/* =========================================
   EXPORT CSV
   ========================================= */

function exportInventory(){

    if(inventory.length === 0){

        showMessage(
            "There are no products to export.",
            "error"
        );

        return;
    }


    let csv =
