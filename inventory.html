<script>

/* =====================================================
   GOLDBIZNA INVENTORY
   SAME STORAGE AS POS
   ===================================================== */

const INVENTORY_KEY =
    "goldbizna_inventory";


let inventory = [];

let editingId = null;


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem("loggedIn");

    sessionStorage.removeItem("gb_login");

    window.location.href =
        "login.html";

}


/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(
                INVENTORY_KEY
            );


        if(!saved){

            inventory = [];

        }else{

            const data =
                JSON.parse(saved);


            inventory =
                Array.isArray(data)
                ? data
                : [];

        }

    }catch(error){

        console.error(error);

        inventory = [];

    }


    renderInventory();

}


/* =====================================================
   SAVE INVENTORY
   ===================================================== */

function saveInventory(){

    localStorage.setItem(
        INVENTORY_KEY,
        JSON.stringify(inventory)
    );

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return Number(value || 0)
        .toLocaleString(
            "en-KE",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(text,type){

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " + type;


    setTimeout(function(){

        message.className =
            "message";

    },3000);

}


/* =====================================================
   ADD / UPDATE PRODUCT
   ===================================================== */

function addProduct(){

    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const category =
        document.getElementById(
            "category"
        ).value.trim();


    const buyingPrice =
        Number(
            document.getElementById(
                "buyingPrice"
            ).value
        );


    const sellingPrice =
        Number(
            document.getElementById(
                "sellingPrice"
            ).value
        );


    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value
        );


    const lowStock =
        Number(
            document.getElementById(
                "lowStock"
            ).value
        );


    /* VALIDATION */

    if(!name){

        showMessage(
            "Please enter the product name.",
            "error"
        );

        return;

    }


    if(
        isNaN(buyingPrice) ||
        buyingPrice < 0
    ){

        showMessage(
            "Please enter a valid buying price.",
            "error"
        );

        return;

    }


    if(
        isNaN(sellingPrice) ||
        sellingPrice < 0
    ){

        showMessage(
            "Please enter a valid selling price.",
            "error"
        );

        return;

    }


    if(
        isNaN(quantity) ||
        quantity < 0
    ){

        showMessage(
            "Please enter a valid quantity.",
            "error"
        );

        return;

    }


    if(
        isNaN(lowStock) ||
        lowStock < 0
    ){

        showMessage(
            "Please enter a valid low-stock level.",
            "error"
        );

        return;

    }


    /* UPDATE EXISTING */

    if(editingId !== null){

        const product =
            inventory.find(function(item){

                return String(item.id) ===
                       String(editingId);

            });


        if(product){

            product.name =
                name;

            product.category =
                category;

            product.buyingPrice =
                buyingPrice;

            product.sellingPrice =
                sellingPrice;

            product.quantity =
                quantity;

            product.lowStock =
                lowStock;

        }


        saveInventory();

        showMessage(
            "Product updated successfully.",
            "success"
        );


        editingId = null;


        document.getElementById(
            "addButton"
        ).innerText =
            "➕ ADD PRODUCT";


        clearForm();

        renderInventory();

        return;

    }


    /* CREATE NEW PRODUCT */

    const product = {

        id:
            "P-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .substring(2,7),

        name:
            name,

        category:
            category,

        buyingPrice:
            buyingPrice,

        sellingPrice:
            sellingPrice,

        quantity:
            quantity,

        lowStock:
            lowStock

    };


    inventory.push(product);


    /* SAVE IMMEDIATELY */

    saveInventory();


    /* CONFIRM */

    showMessage(
        "✅ Product added successfully.",
        "success"
    );


    clearForm();


    renderInventory();

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm(){

    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "category"
    ).value = "";


    document.getElementById(
        "buyingPrice"
    ).value = "";


    document.getElementById(
        "sellingPrice"
    ).value = "";


    document.getElementById(
        "quantity"
    ).value = "";


    document.getElementById(
        "lowStock"
    ).value = "5";

}


/* =====================================================
   RENDER INVENTORY
   ===================================================== */

function renderInventory(){

    const table =
        document.getElementById(
            "inventoryTable"
        );


    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const results =
        inventory.filter(function(product){

            return(
                String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    product.category || ""
                )
                .toLowerCase()
                .includes(search)
            );

        });


    if(results.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    ${
                        inventory.length === 0
                        ? "No products yet. Add your first product above."
                        : "No products found."

                    }

                </td>

            </tr>

        `;

    }else{

        let html = "";


        results.forEach(function(product){

            const quantity =
                Number(
                    product.quantity || 0
                );


            const lowStock =
                Number(
                    product.lowStock ?? 5
                );


            let status =
                "GOOD STOCK";

            let statusClass =
                "stock-good";


            if(quantity <= 0){

                status =
                    "OUT OF STOCK";

                statusClass =
                    "stock-out";

            }

            else if(quantity <= lowStock){

                status =
                    "LOW STOCK";

                statusClass =
                    "stock-low";

            }


            html += `

                <tr>

                    <td>
                        <strong>
                            ${escapeHTML(
                                product.name
                            )}
                        </strong>
                    </td>


                    <td>
                        ${escapeHTML(
                            product.category ||
                            "No category"
                        )}
                    </td>


                    <td>
                        KSh ${money(
                            product.buyingPrice
                        )}
                    </td>


                    <td>
                        KSh ${money(
                            product.sellingPrice
                        )}
                    </td>


                    <td>
                        ${quantity}
                    </td>


                    <td class="${statusClass}">
                        ${status}
                    </td>


                    <td>

                        <button
                            class="action edit"
                            onclick="editProduct('${escapeHTML(product.id)}')">

                            Edit

                        </button>


                        <button
                            class="action delete"
                            onclick="deleteProduct('${escapeHTML(product.id)}')">

                            Delete

                        </button>

                    </td>

                </tr>

            `;

        });


        table.innerHTML =
            html;

    }


    updateSummary();

}


/* =====================================================
   EDIT PRODUCT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "category"
    ).value =
        product.category || "";


    document.getElementById(
        "buyingPrice"
    ).value =
        product.buyingPrice || 0;


    document.getElementById(
        "sellingPrice"
    ).value =
        product.sellingPrice || 0;


    document.getElementById(
        "quantity"
    ).value =
        product.quantity || 0;


    document.getElementById(
        "lowStock"
    ).value =
        product.lowStock ?? 5;


    editingId =
        product.id;


    document.getElementById(
        "addButton"
    ).innerText =
        "💾 UPDATE PRODUCT";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DELETE PRODUCT
   ===================================================== */

function deleteProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        return;

    }


    if(
        !confirm(
            "Delete " +
            product.name +
            " from inventory?"
        )
    ){

        return;

    }


    inventory =
        inventory.filter(function(item){

            return String(item.id) !==
                   String(id);

        });


    saveInventory();

    renderInventory();


    showMessage(
        "Product deleted successfully.",
        "success"
    );

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    let totalProducts =
        inventory.length;


    let totalStock = 0;

    let stockValue = 0;


    inventory.forEach(function(product){

        const quantity =
            Number(
                product.quantity || 0
            );


        totalStock +=
            quantity;


        stockValue +=
            quantity *
            Number(
                product.buyingPrice || 0
            );

    });


    document.getElementById(
        "totalProducts"
    ).innerText =
        totalProducts;


    document.getElementById(
        "totalStock"
    ).innerText =
        totalStock;


    document.getElementById(
        "stockValue"
    ).innerText =
        "KSh " +
        money(stockValue);

}


/* =====================================================
   SEARCH
   ===================================================== */

document
.getElementById("search")
.addEventListener
