<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goldbizna Inventory Pro</title><style>body{font-family:Arial;margin:0;background:#f4f7f5;color:#222}header{background:#087a0b;color:white;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.box{background:white;margin:18px auto;padding:18px;border-radius:12px;max-width:1200px;box-shadow:0 2px 10px #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input{padding:12px;width:100%;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}button{padding:10px 14px;border:0;border-radius:6px;color:white;font-weight:bold;margin:5px;background:#087a0b}.red{background:#c62828}.blue{background:#1976d2}table{width:100%;border-collapse:collapse;margin-top:15px}th{background:#087a0b;color:white}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.stats{display:flex;gap:12px}.stat{flex:1;text-align:center;background:white;padding:18px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}.stats{flex-direction:column}}</style></head><body><header><div class="head"><div><b>GOLDBIZNA INVENTORY PRO</b><small><br>Fast Business Inventory Management</small></div><div><button onclick="location.href='dashboard.html'">Dashboard</button><button class="red" onclick="logout()">Logout</button></div></div></header><div class="box"><h2>Add New Product</h2><div class="grid"><input id="name" placeholder="Product Name"><input id="cat" placeholder="Category"><input id="buy" type="number" placeholder="Buying Price"><input id="sell" type="number" placeholder="Selling Price"><input id="qty" type="number" placeholder="Stock Quantity"><input id="low" type="number" value="5" placeholder="Low Stock Alert"></div><button onclick="add()">➕ Add Product</button><button class="blue" onclick="exportCSV()">⬇ Export CSV</button><button onclick="clearForm()">Clear</button><p id="msg"></p></div><div class="stats"><div class="stat"><b>Total Products</b><h2 id="total">0</h2></div><div class="stat"><b>Total Stock</b><h2 id="stock">0</h2></div><div class="stat"><b>Stock Value</b><h2 id="value">KSh 0</h2></div></div><div class="box"><h2>Search Inventory</h2><input id="search" placeholder="Search product or category" oninput="render()"><h2>Products</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Product</th><th>Category</th><th>Buying</th><th>Selling</th><th>Stock</th><th>Profit</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></div><script>
const KEY="goldbizna_inventory";let items=[];function el(x){return document.getElementById(x)}function load(){try{items=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(items))items=[]}catch(e){items=[]}render()}function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){el("msg").textContent="Storage unavailable on this browser.";return false}}function clearForm(){["name","cat","buy","sell","qty"].forEach(x=>el(x).value="");el("low").value=5}function add(){let n=el("name").value.trim(),c=el("cat").value.trim(),b=Number(el("buy").value),s=Number(el("sell").value),q=Number(el("qty").value),l=Number(el("low").value);if(!n||!c||[b,s,q,l].some(x=>!Number.isFinite(x)||x<0)){el("msg").textContent="Please fill all fields correctly.";return}if(items.some(x=>String(x.name).toLowerCase()===n.toLowerCase())){el("msg").textContent="This product already exists.";return}items.push({id:Date.now()+"_"+Math.random(),name:n,category:c,buyingPrice:b,sellingPrice:s,quantity:q,lowStock:l});if(save()){clearForm();render();el("msg").textContent="✓ Product added successfully."}}function render(){let q=el("search").value.toLowerCase(),b=el("body");b.innerHTML="";let r=items.filter(x=>String(x.name).toLowerCase().includes(q)||String(x.category).toLowerCase().includes(q));r.forEach((x,i)=>{let tr=document.createElement("tr"),low=Number(x.quantity)<=Number(x.lowStock||5),profit=(Number(x.sellingPrice)-Number(x.buyingPrice))*Number(x.quantity);tr.innerHTML=`<td>${i+1}</td><td>${safe(x.name)}</td><td>${safe(x.category)}</td><td>KSh ${money(x.buyingPrice)}</td><td>KSh ${money(x.sellingPrice)}</td><td>${x.quantity}</td><td>KSh ${money(profit)}</td><td>${low?"LOW STOCK":"IN STOCK"}</td><td><button onclick="edit('${x.id}')">Edit</button><button class="red" onclick="del('${x.id}')">Delete</button></td>`;b.appendChild(tr)});if(!r.length)b.innerHTML='<tr><td colspan="9" style="text-align:center">No products yet.</td></tr>';el("total").textContent=items.length;el("stock").textContent=items.reduce((a,x)=>a+Number(x.quantity||0),0);el("value").textContent="KSh "+money(items.reduce((a,x)=>a+Number(x.quantity||0)*Number(x.buyingPrice||0),0))}function money(x){return Number(x||0).toLocaleString("en-KE")}function safe(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function del(id){let x=items.find(a=>String(a.id)===String(id));if(x&&confirm("Delete "+x.name+"?")){items=items.filter(a=>String(a.id)!==String(id));save();render()}}function edit(id){let x=items.find(a=>String(a.id)===String(id));if(!x)return;el("name").value=x.name;el("cat").value=x.category;el("buy").value=x.buyingPrice;el("sell").value=x.sellingPrice;el("qty").value=x.quantity;el("low").value=x.lowStock;items=items.filter(a=>String(a.id)!==String(id));save();render();el("msg").textContent="Edit the product and press Add Product to save it as a new record."}function exportCSV(){if(!items.length)return;let csv="Product,Category,Buying,Selling,Stock,Low Stock\n"+items.map(x=>[x.name,x.category,x.buyingPrice,x.sellingPrice,x.quantity,x.lowStock].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="goldbizna_inventory.csv";a.click()}function logout(){localStorage.removeItem("loggedIn");sessionStorage.removeItem("gb_login");location.href="login.html"}load();
</script></body></html>
