<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>Accept Company Invitation | MABROUK</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#090d14;color:#f5f3ed;font:15px system-ui,Arial}.card{width:min(480px,100%);padding:26px;border:1px solid #29364a;border-radius:18px;background:#121b28;box-shadow:0 20px 60px #0007}.brand{font-weight:900;letter-spacing:.1em;color:#dfb65f}.muted{color:#a1afc1;font-size:13px;line-height:1.5}h1{font-size:27px;margin:20px 0 8px}.field{margin:18px 0}.field label{display:block;font-size:12px;color:#a1afc1;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:9px;border:1px solid #34445b;background:#0a111b;color:#fff;font-size:16px}.btn{width:100%;border:0;border-radius:9px;padding:13px;background:linear-gradient(135deg,#f2d58e,#bd8d37);color:#171108;font-weight:800;font-size:15px}.btn:disabled{opacity:.55}.notice{margin-top:14px;padding:12px;border-radius:9px;background:#202c3b;color:#e7edf5;font-size:13px;line-height:1.5}.good{background:#10291e;color:#b5f0cf}.bad{background:#321a20;color:#ffc3c3}
</style></head><body><main class="card"><div class="brand">MABROUK · COMPANY ACCESS</div><h1>Accept your invitation</h1><p class="muted">Sign in with the same verified email address that received the company invitation. Ask the platform owner for your company ID.</p><div class="field"><label for="companyId">Company ID</label><input id="companyId" autocomplete="off" placeholder="Paste company ID"></div><button id="accept" class="btn" disabled>Checking sign-in…</button><div id="notice" class="notice">Checking your Firebase account…</div></main>
<script type="module">
import {auth} from "./firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";
const $=id=>document.getElementById(id);const functions=getFunctions(undefined,"us-central1");let currentUser=null;
function say(text,kind=""){const el=$("notice");el.textContent=text;el.className="notice"+(kind?" "+kind:"");}
onAuthStateChanged(auth,user=>{currentUser=user;$("accept").disabled=!user;$("accept").textContent=user?"Accept company invitation":"Sign in first";if(!user){say("You are not signed in. Please sign in to your MABROUK account first, then return here.");return;}say("Signed in as "+(user.email||"unknown email")+". Email verification: "+(user.emailVerified?"verified":"not verified")+".");});
$("accept").addEventListener("click",async()=>{if(!currentUser)return;const companyId=$("companyId").value.trim();if(!companyId){say("Enter the company ID supplied by the platform owner.","bad");return;}const button=$("accept");button.disabled=true;button.textContent="Accepting…";try{await currentUser.reload();if(!currentUser.emailVerified)throw new Error("Please verify your email address, then sign in again.");const result=await httpsCallable(functions,"acceptCompanyInvitation")({companyId});say("Invitation accepted. Company ID: "+result.data.companyId+". Your company administrator can now finish setting up your workspace.","good");button.textContent="Invitation accepted";}catch(e){say(e.message||e.code||"Could not accept invitation. Check that the company is active and the signed-in email matches the invitation.","bad");button.disabled=false;button.textContent="Try again";}});
</script></body></html>
