<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Goldbizna Inventory Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#087a0b;
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:100;
}

.header{
    max-width:1300px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    margin-top:4px;
    opacity:.9;
}

.header-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

button:active{
    transform:scale(.97);
}

.dashboard{
    background:#075c07;
    color:white;
}

.logout{
    background:#c62828;
    color:white;
}

.container{
    max-width:1300px;
    margin:20px auto;
    padding:0 14px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
    color:#087a0b;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    color:#444;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccd5cf;
    border-radius:7px;
    font-size:15px;
    background:white;
}

input:focus{
    outline:none;
    border:2px solid #087a0b;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.add{
    background:#087a0b;
    color:white;
}

.cancel{
    background:#777;
    color:white;
    display:none;
}

.export{
    background:#1565c0;
    color:white;
}

.clear{
    background:#555;
    color:white;
}

.message{
    margin-top:14px;
    min-height:22px;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:18px;
}

.summary-card{
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.summary-card h3{
    color:#087a0b;
    margin-bottom:8px;
}

.summary-card strong{
    font-size:25px;
}

.search{
    margin-bottom:0;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#087a0b;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f7faf7;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.low{
    color:#c62828;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

.loading{
    text-align:center;
    padding:25px;
    color:#087a0b;
}

@media(max-width:850px){

    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .summary{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .header-buttons{
        width:100%;
    }

    .header-buttons button{
        flex:1;
    }
}
</style>
</head>

<body>

<header>

<div class="header">

<div>
<div class="logo">GOLDBIZNA INVENTORY PRO</div>

<div class="subtitle">
Fast Business Inventory Management
</div>
</div>

<div class="header-buttons">

<button
type="button"
class="dashboard"
id="dashboardButton">
Dashboard
</button>

<button
type="button"
class="logout"
id="logoutButton">
Logout
</button>

</div>

</div>

</header>


<div class="container">


<!-- PRODUCT FORM -->

<div class="card">

<div class="title" id="formTitle">
Add New Product
</div>

<div class="form-grid">

<div class="input-group">
<label>Product Name</label>
<input
id="productName"
type="text"
placeholder="e.g. Sugar">
</div>

<div class="input-group">
<label>Category</label>
<input
id="productCategory"
type="text"
placeholder="e.g. Food">
</div>

<div class="input-group">
<label>Buying Price</label>
<input
id="buyingPrice"
type="number"
min="0"
step="0.01"
placeholder="e.g. 120">
</div>

<div class="input-group">
<label>Selling Price</label>
<input
id="sellingPrice"
type="number"
min="0"
step="0.01"
placeholder="e.g. 150">
</div>

<div class="input-group">
<label>Stock Quantity</label>
<input
id="quantity"
type="number"
min="0"
step="1"
placeholder="e.g. 20">
</div>

<div class="input-group">
<label>Low Stock Alert</label>
<input
id="lowStock"
type="number"
min="0"
step="1"
value="5">
</div>

</div>


<div class="actions">

<button
type="button"
class="add"
id="addButton">
➕ Add Product
</button>

<button
type="button"
class="cancel"
id="cancelButton">
Cancel
</button>

<button
type="button"
class="clear"
id="clearButton">
Clear
</button>

<button
type="button"
class="export"
id="exportButton">
⬇ Export CSV
</button>

</div>


<div
id="message"
class="message">
</div>

</div>


<!-- SUMMARY -->

<div class="summary">

<div class="summary-card">

<h3>Total Products</h3>

<strong id="totalProducts">0</strong>

</div>


<div class="summary-card">

<h3>Total Stock</h3>

<strong id="totalStock">0</strong>

</div>


<div class="summary-card">

<h3>Stock Value</h3>

<strong id="stockValue">KSh 0</strong>

</div>

</div>


<!-- SEARCH -->

<div class="card">

<div class="title">
Search Inventory
</div>

<input
id="search"
class="search"
type="search"
placeholder="🔎 Search product or category..."
autocomplete="off">

</div>


<!-- PRODUCTS -->

<div class="card">

<div class="title">
Products
</div>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>#</th>
<th>Product</th>
<th>Category</th>
<th>Buying</th>
<th>Selling</th>
<th>Stock</th>
<th>Profit</th>
<th>Status</th>
<th>Actions</th>
</tr>

</thead>

<tbody id="inventoryBody">

<tr>
<td
colspan="9"
class="loading">
Loading inventory...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>


<script>

/* =====================================================
   GOLDBIZNA INVENTORY PRO
   VERSION 2
   ===================================================== */

(function(){

"use strict";


/* =====================================================
   STORAGE
   ===================================================== */

const STORAGE_KEY = "goldbizna_inventory";


let inventory = [];

let editingId = null;


/* =====================================================
   ELEMENT HELPER
   ===================================================== */

function $(id){

    return document.getElementById(id);

}


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,type){

    const box = $("message");

    box.textContent = text;

    if(type === "success"){

        box.style.color = "#087a0b";

    }else if(type === "error"){

        box.style.color = "#c62828";

    }else{

        box.style.color = "#1565c0";

    }

}


/* =====================================================
   NUMBER
   ===================================================== */

function num(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return num(value).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){

            inventory = [];

        }else{

            const data =
                JSON.parse(saved);

            inventory =
                Array.isArray(data)
                ? data
                : [];

        }

    }catch(error){

        console.error(
            "Inventory load error:",
            error
        );

        inventory = [];

        showMessage(
            "Inventory data could not be loaded.",
            "error"
        );

    }

    displayProducts();

}


/* =====================================================
   SAVE
   ===================================================== */

function saveInventory(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(inventory)
        );

        return true;

    }catch(error){

        console.error(
            "Inventory save error:",
            error
        );

        showMessage(
            "Unable to save inventory on this device.",
            "error"
        );

        return false;

    }

}


/* =====================================================
   SAVE PRODUCT
   ===================================================== */

function saveProduct(){

    const name =
        $("productName")
        .value
        .trim();

    const category =
        $("productCategory")
        .value
        .trim();

    const buying =
        num($("buyingPrice").value);

    const selling =
        num($("sellingPrice").value);

    const quantity =
        Number($("quantity").value);

    const lowStock =
        Number($("lowStock").value);


    /* NAME */

    if(!name){

        showMessage(
            "Enter the product name.",
            "error"
        );

        $("productName").focus();

        return;

    }


    /* CATEGORY */

    if(!category){

        showMessage(
            "Enter the category.",
            "error"
        );

        $("productCategory").focus();

        return;

    }


    /* PRICES */

    if(
        !Number.isFinite(buying) ||
        buying < 0
    ){

        showMessage(
            "Enter a valid buying price.",
            "error"
        );

        $("buyingPrice").focus();

        return;

    }


    if(
        !Number.isFinite(selling) ||
        selling < 0
    ){

        showMessage(
            "Enter a valid selling price.",
            "error"
        );

        $("sellingPrice").focus();

        return;

    }


    /* QUANTITY */

    if(
        !Number.isFinite(quantity) ||
        quantity < 0
    ){

        showMessage(
            "Enter a valid stock quantity.",
            "error"
        );

        $("quantity").focus();

        return;

    }


    /* LOW STOCK */

    if(
        !Number.isFinite(lowStock) ||
        lowStock < 0
    ){

        showMessage(
            "Enter a valid low-stock level.",
            "error"
        );

        $("lowStock").focus();

        return;

    }


    /* =================================================
       EDIT
       ================================================= */

    if(editingId !== null){

        const index =
            inventory.findIndex(
                product =>
                String(product.id)
                ===
                String(editingId)
            );


        if(index === -1){

            showMessage(
                "Product not found.",
                "error"
            );

            editingId = null;

            updateForm();

            return;

        }


        inventory[index].name =
            name;

        inventory[index].category =
            category;

        inventory[index].buyingPrice =
            buying;

        inventory[index].sellingPrice =
            selling;

        inventory[index].quantity =
            quantity;

        inventory[index].lowStock =
            lowStock;


        if(!saveInventory()){

            return;

        }


        showMessage(
            "✓ Product updated successfully!",
            "success"
        );


        editingId = null;

        clearForm();

        updateForm();

        displayProducts();

        return;

    }


    /* =================================================
       DUPLICATE CHECK
       ================================================= */

    const duplicate =
        inventory.some(
            product =>
            String(product.name || "")
            .trim()
            .toLowerCase()
            ===
            name.toLowerCase()
        );


    if(duplicate){

        showMessage(
            "This product already exists.",
            "error"
        );

        return;

    }


    /* =================================================
       NEW PRODUCT
       ================================================= */

    const product = {

        id:
            Date.now().toString()
            +
            Math.random()
            .toString(36)
            .substring(2,9),

        name:name,

        category:category,

        buyingPrice:buying,

        sellingPrice:selling,

        quantity:quantity,

        lowStock:lowStock,

        created:
            new Date().toISOString()

    };


    inventory.push(product);


    /* =================================================
       SAVE
       ================================================= */

    if(!saveInventory()){

        inventory.pop();

        return;

    }


    /* =================================================
       SUCCESS
       ================================================= */

    showMessage(
        "✓ " + name + " added successfully!",
        "success"
    );


    clearForm();

    displayProducts();

    $("productName").focus();

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearForm(){

    $("productName").value = "";

    $("productCategory").value = "";

    $("buyingPrice").value = "";

    $("sellingPrice").value = "";

    $("quantity").value = "";

    $("lowStock").value = "5";

}


/* =====================================================
   UPDATE FORM
   ===================================================== */

function updateForm(){

    if(editingId === null){

        $("formTitle").textContent =
            "Add New Product";

        $("addButton").textContent =
            "➕ Add Product";

        $("cancelButton").style.display =
            "none";

    }else{

        $("formTitle").textContent =
            "Edit Product";

        $("addButton").textContent =
            "💾 Update Product";

        $("cancelButton").style.display =
            "inline-block";

    }

}


/* =====================================================
   DISPLAY
   ===================================================== */

function displayProducts(){

    const body =
        $("inventoryBody");

    const search =
        $("search")
        .value
        .trim()
        .toLowerCase();


    const results =
        inventory.filter(
            product => {

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();

                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();

                return(
                    name.includes(search)
                    ||
                    category.includes(search)
                );

            }
        );


    body.innerHTML = "";


    if(results.length === 0){

        const row =
            document.createElement("tr");

        row.innerHTML =
            `
            <td
                colspan="9"
                class="empty">
                ${
                    inventory.length === 0
                    ?
                    "No products yet. Add your first product above."
                    :
                    "No products match your search."
                }
            </td>
            `;

        body.appendChild(row);

        updateSummary();

        return;

    }


    results.forEach(
        function(product,index){

            const stock =
                num(product.quantity);

            const buying =
                num(product.buyingPrice);

            const selling =
                num(product.sellingPrice);

            const low =
                num(product.lowStock) || 5;

            const profit =
                (selling - buying)
                * stock;

            const lowStatus =
                stock <= low;


            const row =
                document.createElement("tr");


            row.innerHTML =
                `
                <td>${index + 1}</td>

                <td>
                    <strong>
                    ${escapeHTML(product.name)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(product.category)}
                </td>

                <td>
                    KSh ${money(buying)}
                </td>

                <td>
                    KSh ${money(selling)}
                </td>

                <td class="${lowStatus ? "low" : "good"}">
                    ${stock}
                </td>

                <td class="${profit >= 0 ? "good" : "low"}">
                    KSh ${money(profit)}
                </td>

                <td class="${lowStatus ? "low" : "good"}">
                    ${
                        lowStatus
                        ?
                        "LOW STOCK"
                        :
                        "IN STOCK"
                    }
                </td>

                <td>

                    <button
                        type="button"
                        class="edit"
                        data-edit="${escapeHTML(product.id)}">
                        Edit
                    </button>

                    <button
                        type="button"
                        class="delete"
                        data-delete="${escapeHTML(product.id)}">
                        Delete
                    </button>

                </td>
                `;


            body.appendChild(row);

        }
    );


    updateSummary();

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    let totalStock = 0;

    let stockValue = 0;


    inventory.forEach(
        function(product){

            const quantity =
                num(product.quantity);

            const buying =
                num(product.buyingPrice);


            totalStock += quantity;

            stockValue +=
                quantity * buying;

        }
    );


    $("totalProducts").textContent =
        inventory.length;

    $("totalStock").textContent =
        totalStock;

    $("stockValue").textContent =
        "KSh " + money(stockValue);

}


/* =====================================================
   EDIT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(
            item =>
            String(item.id)
            ===
            String(id)
        );


    if(!product){

        showMessage(
            "Product not found.",
