<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Settings</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#0b7a0b;
    color:white;
    text-align:center;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    margin-top:20px;
    padding:12px;
    width:100%;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#086108;
}
</style>
</head>

<body>

<header>Goldbizna Settings</header>

<div class="container">

<label>Business Name</label>
<input id="businessName" placeholder="Goldbizna">

<label>Business Phone</label>
<input id="businessPhone" placeholder="+254...">

<label>Business Email</label>
<input id="businessEmail" placeholder="info@goldbizna.com">

<label>Receipt Footer</label>
<input id="receiptFooter" placeholder="Thank you for shopping with us">

<button onclick="saveSettings()">Save Settings</button>

</div>

<script>
function saveSettings(){
const settings={
businessName:businessName.value,
businessPhone:businessPhone.value,
businessEmail:businessEmail.value,
receiptFooter:receiptFooter.value
};

localStorage.setItem("goldbizna_settings",JSON.stringify(settings));

alert("Settings saved successfully!");
}

const saved=JSON.parse(localStorage.getItem("goldbizna_settings"));

if(saved){
businessName.value=saved.businessName||"";
businessPhone.value=saved.businessPhone||"";
businessEmail.value=saved.businessEmail||"";
receiptFooter.value=saved.receiptFooter||"";
}
</script>

</body>
</html>
