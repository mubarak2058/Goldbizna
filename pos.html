<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Goldbizna POS</title><style>
body{font-family:Arial;margin:0;background:#f4f4f4}header{background:#0b7a0b;color:#fff;padding:15px;text-align:center}.c{max-width:1000px;margin:20px auto;background:#fff;padding:20px}select,input,button{padding:8px;margin:5px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px}th{background:#0b7a0b;color:#fff}
</style></head><body><header>Goldbizna POS</header><div class='c'>
<select id='p'></select><input id='q' type='number' value='1' min='1'><button onclick='add()'>Add</button>
<table><thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead><tbody id='cart'></tbody></table>
<h3 id='total'>Total: 0</h3><button onclick='checkout()'>Complete Sale</button></div>
<script>
let inv=JSON.parse(localStorage.getItem('goldbizna_inventory')||'[]'),items=[],sel=p;
function load(){sel.innerHTML='';inv.forEach((x,i)=>sel.innerHTML+=`<option value="${i}">${x.n} (${x.q})</option>`)}load();
function add(){let i=+sel.value,qq=+q.value;if(qq>+inv[i].q)return alert('Insufficient stock');items.push({i,qq});draw();}
function draw(){let t=0;cart.innerHTML='';items.forEach(x=>{let a=inv[x.i],s=x.qq*(+a.s||0);t+=s;cart.innerHTML+=`<tr><td>${a.n}</td><td>${x.qq}</td><td>${s}</td></tr>`});total.textContent='Total: '+t;}
function checkout()function checkout(){
    let sales = JSON.parse(localStorage.getItem("goldbizna_sales") || "[]");

    let total = 0;
    let soldItems = [];

    items.forEach(x => {
        let a = inv[x.i];
        inv[x.i].q = (+inv[x.i].q) - x.qq;

        let subtotal = x.qq * (+a.s || 0);
        total += subtotal;

        soldItems.push(a.n + " x" + x.qq);
    });

    localStorage.setItem("goldbizna_inventory", JSON.stringify(inv));

    sales.push({
        date: new Date().toLocaleString(),
        items: soldItems.join(", "),
        total: total
    });

    localStorage.setItem("goldbizna_sales", JSON.stringify(sales));

    alert("Sale completed successfully!");

    items = [];
    load();
    draw();
}
</script></body></html>
