<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MABROUK TRADER'S - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#087a0b,#0b5d18);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:430px;background:#fff;border-radius:16px;padding:30px;box-shadow:0 15px 45px #0005}
.logo{text-align:center;color:#087a0b;font-size:27px;font-weight:900;margin-bottom:6px}
.logo span{color:#d69f00}
.sub{text-align:center;color:#777;font-size:13px;margin-bottom:25px}
label{display:block;font-size:12px;font-weight:bold;color:#555;margin:14px 0 6px}
input{width:100%;padding:13px;border:1px solid #d5ddd5;border-radius:8px;outline:0;font-size:14px}
input:focus{border-color:#087a0b;box-shadow:0 0 0 3px #087a0b15}
.btn{width:100%;border:0;background:#087a0b;color:#fff;padding:13px;border-radius:8px;margin-top:20px;font-weight:bold;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:12px;border-radius:8px;font-size:12px;line-height:1.5}
.error{display:block;background:#ffe8e8;color:#a51d1d}
.success{display:block;background:#eaf6ed;color:#087a0b}
.loading{text-align:center;color:#777;font-size:12px;margin-top:15px}
.small{text-align:center;margin-top:18px;font-size:11px;color:#888}
.eye{position:relative}
.eye button{position:absolute;right:8px;top:7px;border:0;background:transparent;padding:8px;cursor:pointer}
.eye input{padding-right:45px}
</style>
</head>
<body>

<div class="card">
  <div class="logo">MABROUK <span>TRADER'S</span></div>
  <div class="sub">Secure Business Management System</div>

  <form id="loginForm">
    <label>Username or Email</label>
    <input id="loginUser" autocomplete="username" placeholder="Enter username or email" required>

    <label>Password</label>
    <div class="eye">
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password" required>
      <button type="button" onclick="togglePassword()">👁</button>
    </div>

    <button class="btn" id="loginBtn">LOGIN</button>
  </form>

  <div id="msg" class="msg"></div>
  <div id="loading" class="loading"></div>

  <div class="small">MABROUK TRADER'S • Secure Access</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{
 getFirestore,
 doc,
 getDoc
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyA8XB6aY45-yHT0uZ6NUhptMoNkYqgwqOs",
 authDomain:"goldbizna.firebaseapp.com",
 projectId:"goldbizna",
 storageBucket:"goldbizna.firebasestorage.app",
 messagingSenderId:"559981054862",
 appId:"1:559981054862:web:0635c689607d3baa3272df",
 measurementId:"G-95XL3BNQJF"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

function message(text,type="error"){
 const m=$("msg");
 m.textContent=text;
 m.className="msg "+type;
}

function clearMessage(){
 $("msg").className="msg";
 $("msg").textContent="";
}

function firebaseError(e){
 const c=e?.code||"";
 if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))
   return "Incorrect username/email or password.";
 if(c.includes("too-many-requests"))
   return "Too many login attempts. Please wait and try again.";
 if(c.includes("network"))
   return "Network problem. Check your internet connection.";
 return e?.message||"Login failed.";
}

window.togglePassword=()=>{
 const x=$("loginPass");
 x.type=x.type==="password"?"text":"password";
};

async function findEmail(username){
 const key=username.trim().toLowerCase();

 if(key.includes("@"))return key;

 const snap=await getDoc(doc(db,"usernames",key));

 if(!snap.exists())return null;

 return snap.data()?.email||null;
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 clearMessage();

 const username=$("loginUser").value.trim();
 const password=$("loginPass").value;

 if(!username||!password)return message("Enter your username and password.");

 $("loginBtn").disabled=true;
 $("loading").textContent="Signing in...";

 try{
   const email=await findEmail(username);

   if(!email){
     throw new Error("Username not found.");
   }

   const cred=await signInWithEmailAndPassword(auth,email,password);

   const userSnap=await getDoc(doc(db,"users",cred.user.uid));

   if(!userSnap.exists()){
     await auth.signOut();
     throw new Error("Your account profile was not found.");
   }

   const data=userSnap.data();

   if(data.status==="disabled"){
     await auth.signOut();
     throw new Error("Your account has been disabled. Contact the Owner.");
   }

   localStorage.setItem("goldbizna_username",data.username||username);
   localStorage.setItem("goldbizna_uid",cred.user.uid);

   message("Login successful. Opening MABROUK TRADER'S...","success");

   setTimeout(()=>{
     location.href="index.html";
   },500);

 }catch(e){
   console.error(e);
   message(firebaseError(e));
 }finally{
   $("loginBtn").disabled=false;
   $("loading").textContent="";
 }
});

onAuthStateChanged(auth,user=>{
 if(user){
   $("loading").textContent="Checking account...";
 }
});
</script>

</body>
</html>
