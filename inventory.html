<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Goldbizna Inventory</title><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    color:#333;
}

/* HEADER */
header{
    background:#0b7a0b;
    color:white;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-buttons button{
    border:none;
    padding:10px 15px;
    border-radius:5px;
    color:white;
    cursor:pointer;
}

.dashboard-btn{
    background:#075c07;
}

.logout-btn{
    background:#c62828;
}

/* CONTAINER */
.container{
    width:95%;
    max-width:1250px;
    margin:20px auto;
}

/* TITLE */
.title{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.title h1{
    color:#0b7a0b;
    margin-bottom:5px;
}

/* FORM */
.form-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.form-box h2{
    color:#0b7a0b;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.full{
    grid-column:1 / -1;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

.save-btn{
    background:#0b7a0b;
    color:white;
}

.cancel-btn{
    background:#777;
    color:white;
    display:none;
}

/* SUMMARY */
.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.summary-card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.summary-card h3{
    color:#0b7a0b;
    margin-bottom:8px;
}

.summary-card p{
    font-size:24px;
    font-weight:bold;
}

/* SEARCH */
.search-box{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

/* TABLE */
.table-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#0b7a0b;
    color:white;
    padding:11px;
}

td{
    padding:10px;
    border:1px solid #ddd;
    text-align:center;
}

.low{
    color:red;
    font-weight:bold;
}

.good{
    color:#0b7a0b;
    font-weight:bold;
}

.edit-btn{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete-btn{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

/* MESSAGE */
#message{
    margin-top:12px;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .summary{
        grid-template-columns:1fr;
    }

    header{
        gap:12px;
    }

    .logo{
        font-size:21px;
    }
}
</style></head><body><!-- LOGIN PROTECTION --><script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href="login.html";
}
</script><header><div class="logo">
    Goldbizna Inventory
</div>

<div class="header-buttons">

    <button
        class="dashboard-btn"
        onclick="window.location.href='dashboard.html'">
        Dashboard
    </button>

    <button
        class="logout-btn"
        onclick="logout()">
        Logout
    </button>

</div>

</header><div class="container"><div class="title">

    <h1>Inventory Management</h1>

    <p>
        Add products, monitor stock and manage prices.
    </p>

</div>


<!-- PRODUCT FORM -->
<div class="form-box">

    <h2 id="formTitle">Add New Product</h2>

    <div class="form-grid">

        <input
            type="text"
            id="productName"
            placeholder="Product Name"
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
        >

        <input
            type="number"
            id="buyingPrice"
            placeholder="Buying Price"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            id="sellingPrice"
            placeholder="Selling Price"
            min="0"
            step="0.01"
        >

        <input
            type="number"
            id="quantity"
            placeholder="Stock Quantity"
            min="0"
        >

        <input
            type="number"
            id="lowStock"
            placeholder="Low Stock Alert Level"
            min="0"
            value="5"
        >

    </div>

    <div class="buttons">

        <button
            class="save-btn"
            onclick="saveProduct()"
            id="saveButton">
            Add Product
        </button>

        <button
            class="cancel-btn"
            onclick="cancelEdit()"
            id="cancelButton">
            Cancel
        </button>

    </div>

    <p id="message"></p>

</div>


<!-- SUMMARY -->
<div class="summary">

    <div class="summary-card">

        <h3>Total Products</h3>

        <p id="totalProducts">0</p>

    </div>

    <div class="summary-card">

        <h3>Total Stock</h3>

        <p id="totalStock">0</p>

    </div>

    <div class="summary-card">

        <h3>Stock Value</h3>

        <p id="stockValue">KSh 0</p>

    </div>

</div>


<!-- SEARCH -->
<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="Search product or category..."
        oninput="displayProducts()"
    >

</div>


<!-- TABLE -->
<div class="table-box">

    <table>

        <thead>

            <tr>

                <th>#</th>
                <th>Product</th>
                <th>Category</th>
                <th>Buying Price</th>
                <th>Selling Price</th>
                <th>Stock</th>
                <th>Stock Value</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="inventoryBody">

        </tbody>

    </table>

</div>

</div><script>

let inventory = JSON.parse(
    localStorage.getItem("goldbizna_inventory") || "[]"
);

let editingIndex = -1;


/* SAVE PRODUCT */
function saveProduct(){

    const name =
        document.getElementById("productName").value.trim();

    const category =
        document.getElementById("category").value.trim();

    const buyingPrice =
        Number(document.getElementById("buyingPrice").value);

    const sellingPrice =
        Number(document.getElementById("sellingPrice").value);

    const quantity =
        Number(document.getElementById("quantity").value);

    const lowStock =
        Number(document.getElementById("lowStock").value);


    if(name === ""){

        alert("Please enter the product name.");

        return;

    }


    if(category === ""){

        alert("Please enter the category.");

        return;

    }


    if(buyingPrice < 0 || sellingPrice < 0){

        alert("Prices cannot be negative.");

        return;

    }


    if(quantity < 0){

        alert("Stock quantity cannot be negative.");

        return;

    }


    if(lowStock < 0){

        alert("Low stock level cannot be negative.");

        return;

    }


    const product = {

        name:name,

        category:category,

        buyingPrice:buyingPrice,

        sellingPrice:sellingPrice,

        quantity:quantity,

        lowStock:lowStock,

        updatedAt:new Date().toLocaleString()

    };


    if(editingIndex === -1){

        inventory.push(product);

        showMessage(
            "Product added successfully.",
            "green"
        );

    }else{

        inventory[editingIndex]=product;

        showMessage(
            "Product updated successfully.",
            "green"
        );

        editingIndex=-1;

    }


    saveInventory();

    clearForm();

    displayProducts();

}


/* SAVE TO LOCAL STORAGE */
function saveInventory(){

    localStorage.setItem(
        "goldbizna_inventory",
        JSON.stringify(inventory)
    );

}


/* DISPLAY PRODUCTS */
function displayProducts(){

    const body =
        document.getElementById("inventoryBody");

    const search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();


    body.innerHTML="";


    let totalStock=0;

    let stockValue=0;


    const filtered =
        inventory.filter(function(product){

            return (

                product.name
                    .toLowerCase()
                    .includes(search)

                ||

                product.category
                    .toLowerCase()
                    .includes(search)

            );

        });


    filtered.forEach(function(product,index){

        totalStock += Number(product.quantity);

        stockValue +=
            Number(product.buyingPrice) *
            Number(product.quantity);


        const realIndex =
            inventory.indexOf(product);


        const row =
            document.createElement("tr");


        let status="In Stock";

        let statusClass="good";


        if(Number(product.quantity) <=
           Number(product.lowStock)){

            status="Low Stock";

            statusClass="low";

        }


        row.innerHTML=`

            <td>${index + 1}</td>

            <td>${escapeHTML(product.name)}</td>

            <td>${escapeHTML(product.category)}</td>

            <td>
                KSh ${Number(product.buyingPrice)
                .toLocaleString()}
            </td>

            <td>
                KSh ${Number(product.sellingPrice)
                .toLocaleString()}
            </td>

            <td>${Number(product.quantity)}</td>

            <td>
                KSh ${(Number(product.buyingPrice) *
                Number(product.quantity))
                .toLocaleString()}
            </td>

            <td class="${statusClass}">
                ${status}
            </td>

            <td>

                <button
                    class="edit-btn"
                    onclick="editProduct(${realIndex})">
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${realIndex})">
                    Delete
                </button>

            </td>

        `;


        body.appendChild(row);

    });


    document.getElementById("totalProducts").innerText =
        inventory.length;


    document.getElementById("totalStock").innerText =
        totalStock;


    document.getElementById("stockValue").innerText =
        "KSh " + stockValue.toLocaleString();

}


/* EDIT PRODUCT */
function editProduct(index){

    const product =
        inventory[index];


    document.getElementById("productName").value =
        product.name;

    document.getElementById("category").value =
        product.category;

    document.getElementById("buyingPrice").value =
        product.buyingPrice;

    document.getElementById("sellingPrice").value =
        product.sellingPrice;

    document.getElementById("quantity").value =
        product.quantity;

    document.getElementById("lowStock").value =
        product.lowStock;


    editingIndex=index;


    document.getElementById("formTitle").innerText =
        "Edit Product";


    document.getElementById("saveButton").innerText =
        "Update Product";


    document.getElementById("cancelButton").style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* CANCEL EDIT */
function cancelEdit(){

    editingIndex=-1;

    clearForm();

    document.getElementById("formTitle").innerText =
        "Add New Product";

    document.getElementById("saveButton").innerText =
        "Add Product";

    document.getElementById("cancelButton").style.display =
        "none";

}


/* DELETE PRODUCT */
function deleteProduct(index){

    const product =
        inventory[index];


    if(!confirm(
        "Delete " + product.name + " from inventory?"
    )){

        return;

    }


    inventory.splice(index,1);

    saveInventory();

    displayProducts();


    showMessage(
        "Product deleted.",
        "red"
    );

}


/* CLEAR FORM */
function clearForm(){

    document.getElementById("productName").value="";
    document.getElementById("category").value="";
    document.getElementById("buyingPrice").value="";
    document.getElementById("sellingPrice").value="";
    document.getElementById("quantity").value="";
    document.getElementById("lowStock").value="5";


    document.getElementById("formTitle").innerText =
        "Add New Product";


    document.getElementById("saveButton").innerText =
        "Add Product";


    document.getElementById("cancelButton").style.display =
        "none";

}


/* MESSAGE */
function showMessage(text,color){

    const message =
        document.getElementById("message");


    message.innerText=text;

    message.style.color=color;


    setTimeout(function(){

        message.innerText="";

    },3000);

}


/* LOGOUT */
function logout(){

    localStorage.removeItem("loggedIn");

    window.location.href="login.html";

}


/* HTML ESCAPE */
function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* START */
displayProducts();

</script></body>
</html>
