.summary-box{

    border-radius:10px;

.summary-number{

}

/* TABLE */
.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;

    min-width:850px;
}

th{
    background:#087a0b;
    color:white;
    padding:11px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

tr:hover{
    background:#f5f8f5;
}

/* STOCK */
.good{
    color:#087a0b;
    font-weight:bold;
}

.low{
    color:#d35400;
    font-weight:bold;
}

.out{
    color:#c62828;
    font-weight:bold;
}

/* ACTIONS */
.edit{
    background:#1565c0;
    color:white;
    margin-right:5px;
}

.delete{

    color:white;
}

/* EMPTY */
.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

/* MOBILE */

    .form-grid{
        grid-template-columns:repeat(2,1fr);

@media(max-width:600px){

<script>

/* =====================================================
   GOLDBIZNA INVENTORY
   CONNECTED DIRECTLY TO POS

   SHARED STORAGE:
   goldbizna_inventory
   ===================================================== */

const INVENTORY_KEY =
    "goldbizna_inventory";

let inventory = [];

let editingId = null;


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem("loggedIn");

    sessionStorage.removeItem("gb_login");

    window.location.href =
        "login.html";

}


/* =====================================================
   CREATE ID
   ===================================================== */

function createProductId(){

    return "P-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,8);

}


/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(
                INVENTORY_KEY
            );

        if(!saved){

            inventory = [];

        }else{

            const data =
                JSON.parse(saved);

            inventory =
                Array.isArray(data)
                ? data
                : [];

        }

    }catch(error){

        console.error(
            "Inventory loading error:",
            error
        );

        inventory = [];

    }

    displayInventory();

    updateSummary();

}


/* =====================================================
   SAVE STORAGE
   ===================================================== */

function saveInventory(){

    localStorage.setItem(
        INVENTORY_KEY,
        JSON.stringify(inventory)
    );

}


/* =====================================================
   SAVE PRODUCT
   ===================================================== */

function saveProduct(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const category =
        document
        .getElementById("category")
        .value
        .trim();

    const buyingPrice =
        Number(
            document
            .getElementById("buyingPrice")
            .value
        );

    const sellingPrice =
        Number(
            document
            .getElementById("sellingPrice")
            .value
        );

    const quantity =
        Number(
            document
            .getElementById("quantity")
            .value
        );

    const lowStock =
        Number(
            document
            .getElementById("lowStock")
            .value
        );


    /* VALIDATION */

    if(!name){

        alert(
            "Please enter the product name."
        );

        return;

    }


    if(!category){

        alert(
            "Please enter the category."
        );

        return;

    }


    if(
        !Number.isFinite(buyingPrice) ||
        buyingPrice < 0
    ){

        alert(
            "Please enter a valid buying price."
        );

        return;

    }


    if(
        !Number.isFinite(sellingPrice) ||
        sellingPrice < 0
    ){

        alert(
            "Please enter a valid selling price."
        );

        return;

    }


    if(
        !Number.isFinite(quantity) ||
        quantity < 0
    ){

        alert(
            "Please enter a valid quantity."
        );

        return;

    }


    if(
        !Number.isFinite(lowStock) ||
        lowStock < 0
    ){

        alert(
            "Please enter a valid low-stock level."
        );

        return;

    }


    /* EDIT EXISTING */

    if(editingId){

        const product =
            inventory.find(function(item){

                return String(item.id) ===
                    String(editingId);

            });


        if(product){

            product.name =
                name;

            product.category =
                category;

            product.buyingPrice =
                buyingPrice;

            product.sellingPrice =
                sellingPrice;

            product.quantity =
                quantity;

            product.lowStock =
                lowStock;

        }

        editingId = null;

    }

    /* ADD NEW */

    else{

        const product = {

            id:
                createProductId(),

            name:
                name,

            category:
                category,

            buyingPrice:
                buyingPrice,

            sellingPrice:
                sellingPrice,

            quantity:
                quantity,

            lowStock:
                lowStock

        };


        inventory.push(product);

    }


    saveInventory();

    resetForm();

    displayInventory();

    updateSummary();


    alert(
        "Product saved successfully."
    );

}


/* =====================================================
   RESET FORM
   ===================================================== */

function resetForm(){

    document
    .getElementById("name")
    .value = "";

    document
    .getElementById("category")
    .value = "";

    document
    .getElementById("buyingPrice")
    .value = "";

    document
    .getElementById("sellingPrice")
    .value = "";

    document
    .getElementById("quantity")
    .value = "";

    document
    .getElementById("lowStock")
    .value = "5";

    editingId = null;

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   DISPLAY INVENTORY
   ===================================================== */

function displayInventory(){

    const table =
        document
        .getElementById(
            "inventoryTable"
        );


    const search =
        document
        .getElementById(
            "inventorySearch"
        )
        .value
        .toLowerCase()
        .trim();


    const results =
        inventory.filter(function(product){

            const name =
                String(
                    product.name || ""
                ).toLowerCase();

            const category =
                String(
                    product.category || ""
                ).toLowerCase();


            return(
                name.includes(search) ||
                category.includes(search)
            );

        });


    if(results.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    ${
                        inventory.length === 0
                        ? "No products added yet."
                        : "No matching products found."
                    }

                </td>

            </tr>

        `;

        return;

    }


    let html = "";


    results.forEach(function(product){

        const stock =
            Number(
                product.quantity || 0
            );


        const lowStock =
            Number(
                product.lowStock ?? 5
            );


        let status =
            "GOOD";

        let statusClass =
            "good";


        if(stock <= 0){

            status =
                "OUT OF STOCK";

            statusClass =
                "out";

        }

        else if(stock <= lowStock){

            status =
                "LOW STOCK";

            statusClass =
                "low";

        }


        html += `

            <tr>

                <td>
                    <strong>
                        ${escapeHTML(product.name)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(
                        product.category ||
                        "-"
                    )}
                </td>

                <td>
                    KSh ${money(
                        product.buyingPrice
                    )}
                </td>

                <td>
                    KSh ${money(
                        product.sellingPrice
                    )}
                </td>

                <td>
                    ${stock}
                </td>

                <td
                    class="${statusClass}">

                    ${status}

                </td>

                <td>

                    <button
                        class="edit"
                        onclick="editProduct('${escapeHTML(product.id)}')">

                        Edit

                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct('${escapeHTML(product.id)}')">

                        Delete

                    </button>

                </td>

            </tr>

        `;

    });


    table.innerHTML =
        html;

}


/* =====================================================
   EDIT PRODUCT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                String(id);

        });


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    document
    .getElementById("name")
    .value =
        product.name || "";


    document
    .getElementById("category")
    .value =
        product.category || "";


    document
    .getElementById("buyingPrice")
    .value =
        product.buyingPrice || 0;


    document
    .getElementById("sellingPrice")
    .value =
        product.sellingPrice || 0;


    document
    .getElementById("quantity")
    .value =
        product.quantity || 0;


    document
    .getElementById("lowStock")
    .value =
        product.lowStock ?? 5;


    editingId =
        product.id;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DELETE PRODUCT
   ===================================================== */

function deleteProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                String(id);

        });


    if(!product){

        return;

    }


    const confirmed =
        confirm(
            "Delete " +
            product.name +
            " from inventory?"
        );


    if(!confirmed){

        return;

    }


    inventory =
        inventory.filter(function(item){

            return String(item.id) !==
                String(id);

        });


    saveInventory();

    displayInventory();

    updateSummary();

}


/* =====================================================
   SEARCH
   ===================================================== */

document
.getElementById("inventorySearch")
.addEventListener(
    "input",
    displayInventory
);


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    const totalProducts =
        inventory.length;


    let totalStock = 0;

    let lowStockCount = 0;

    let outStockCount = 0;


    inventory.forEach(function(product){

        const stock =
            Number(
                product.quantity || 0
            );


        const lowStock =
            Number(
                product.lowStock ?? 5
            );


        totalStock +=
            stock;


        if(stock <= 0){

            outStockCount++;

        }

        else if(stock <= lowStock){

            lowStockCount++;

        }

    });


    document
    .getElementById(
        "totalProducts"
    )
    .innerText =
        totalProducts;


    document
    .getElementById(
        "totalStock"
    )
    .innerText =
        totalStock;


    document
    .getElementById(
        "lowStockCount"
    )
    .innerText =
        lowStockCount;


    document
    .getElementById(
        "outStockCount"
    )
    .innerText =
        outStockCount;

}


/* =====================================================
   INITIALIZE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadInventory();

    }
);

   UPDATE IF POS CHANGES INVENTORY
   ===================================================== */

    "storage",
    function(event){

        if(
