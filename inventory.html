<style>

*{

}

body{

header{

}

.logo{

}

.subtitle{

}

.header-buttons{

}

button{

.dashboard{

.card{

.summary-card h3{
    color:#087a0b;
    margin-bottom:8px;
}

.summary-card strong{
    font-size:25px;
}

.search{

}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{

    color:white;

td{

tr:hover{

}

.low{

    font-weight:bold;
}

.good{
    color:#087a0b;
    font-weight:bold;
}

.edit{
    background:#1976d2;
    color:white;
    padding:7px 10px;
}

.delete{
    background:#c62828;
    color:white;
    padding:7px 10px;
    margin-left:5px;
}

    padding:25px;
    color:#777;
}

    .header{

        align-items:flex-start;
    }

        grid-template-columns:1fr;
    }

}

<script>

/* =====================================================
   GOLDBIZNA INVENTORY PRO
   ===================================================== */

const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];

let editingId = null;


/* =====================================================
   SAFE NUMBER
   ===================================================== */

function number(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


/* =====================================================
   MONEY
   ===================================================== */

function money(value){

    return number(value).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD
   ===================================================== */

function loadInventory(){

    try{

        const saved =
            localStorage.getItem(INVENTORY_KEY);

        if(!saved){

            inventory=[];

            return;

        }

        const data =
            JSON.parse(saved);

        inventory =
            Array.isArray(data)
            ? data
            : [];

    }

    catch(error){

        console.error(error);

        inventory=[];

    }

}


/* =====================================================
   SAVE
   ===================================================== */

function saveInventory(){

    try{

        localStorage.setItem(
            INVENTORY_KEY,
            JSON.stringify(inventory)
        );

        return true;

    }

    catch(error){

        console.error(error);

        alert(
            "Unable to save inventory on this device."
        );

        return false;

    }

}


/* =====================================================
   ADD PRODUCT
   ===================================================== */

function saveProduct(){

    const name =
        document.getElementById("name")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const buyingPrice =
        number(
            document.getElementById(
                "buyingPrice"
            ).value
        );

    const sellingPrice =
        number(
            document.getElementById(
                "sellingPrice"
            ).value
        );

    const quantity =
        parseInt(
            document.getElementById(
                "quantity"
            ).value,
            10
        );

    const lowStock =
        parseInt(
            document.getElementById(
                "lowStock"
            ).value,
            10
        );


    /* VALIDATION */

    if(!name){

        alert("Enter the product name.");

        document.getElementById("name").focus();

        return;

    }


    if(!category){

        alert("Enter the category.");

        document.getElementById("category").focus();

        return;

    }


    if(
        buyingPrice < 0 ||
        !Number.isFinite(buyingPrice)
    ){

        alert("Enter a valid buying price.");

        return;

    }


    if(
        sellingPrice < 0 ||
        !Number.isFinite(sellingPrice)
    ){

        alert("Enter a valid selling price.");

        return;

    }


    if(
        !Number.isInteger(quantity) ||
        quantity < 0
    ){

        alert("Enter a valid stock quantity.");

        return;

    }


    if(
        !Number.isInteger(lowStock) ||
        lowStock < 0
    ){

        alert("Enter a valid low-stock level.");

        return;

    }


    /* DUPLICATE */

    const duplicate =
        inventory.some(function(product){

            return(
                String(product.name || "")
                .toLowerCase()
                ===
                name.toLowerCase()
                &&
                String(product.id)
                !==
                String(editingId)
            );

        });


    if(duplicate){

        alert(
            "This product already exists."
        );

        return;

    }


    /* PRODUCT */

    if(editingId === null){

        const product = {

            id:
                Date.now().toString()
                +
                Math.random()
                .toString(36)
                .substring(2,8),

            name:name,

            category:category,

            buyingPrice:buyingPrice,

            sellingPrice:sellingPrice,

            quantity:quantity,

            lowStock:lowStock,

            created:
                new Date().toISOString()

        };


        inventory.push(product);

    }

    else{

        const index =
            inventory.findIndex(
                p =>
                String(p.id)
                ===
                String(editingId)
            );


        if(index === -1){

            alert(
                "Product could not be found."
            );

            return;

        }


        inventory[index] = {

            ...inventory[index],

            name:name,

            category:category,

            buyingPrice:buyingPrice,

            sellingPrice:sellingPrice,

            quantity:quantity,

            lowStock:lowStock

        };

    }


    /* SAVE */

    if(!saveInventory()){

        return;

    }


    /* SUCCESS */

    showMessage(
        editingId === null
        ? "✓ Product added successfully!"
        : "✓ Product updated successfully!",
        "#087a0b"
    );


    clearForm();

    editingId = null;

    updateForm();

    displayProducts();

}


/* =====================================================
   DISPLAY
   ===================================================== */

function displayProducts(){

    const body =
        document.getElementById(
            "inventoryBody"
        );

    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        inventory.filter(function(product){

            const name =
                String(
                    product.name || ""
                )
                .toLowerCase();

            const category =
                String(
                    product.category || ""
                )
                .toLowerCase();

            return(
                name.includes(search)
                ||
                category.includes(search)
            );

        });


    body.innerHTML="";


    if(filtered.length === 0){

        body.innerHTML=`

        <tr>

        <td
        colspan="9"
        class="empty">

        ${
            inventory.length === 0
            ?
            "No products yet. Add your first product above."
            :
            "No products match your search."

        }

        </td>

        </tr>

        `;

        updateSummary();

        return;

    }


    filtered.forEach(function(product,index){

        const stock =
            number(product.quantity);

        const buying =
            number(product.buyingPrice);

        const selling =
            number(product.sellingPrice);

        const low =
            number(
                product.lowStock ?? 5
            );


        const profit =
            (selling-buying)*stock;


        const lowStock =
            stock <= low;


        const row =
            document.createElement("tr");


        row.innerHTML=`

        <td>
            ${index+1}
        </td>

        <td>
            <strong>
            ${escapeHTML(product.name)}
            </strong>
        </td>

        <td>
            ${escapeHTML(product.category)}
        </td>

        <td>
            KSh ${money(buying)}
        </td>

        <td>
            KSh ${money(selling)}
        </td>

        <td class="${lowStock?'low':'good'}">
            ${stock}
        </td>

        <td class="${profit>=0?'good':'low'}">
            KSh ${money(profit)}
        </td>

        <td class="${lowStock?'low':'good'}">

            ${
                lowStock
                ?
                "LOW STOCK"
                :
                "IN STOCK"
            }

        </td>

        <td>

        <button
        class="edit"
        onclick="editProduct('${String(product.id)}')">

        Edit

        </button>

        <button
        class="delete"
        onclick="deleteProduct('${String(product.id)}')">

        Delete

        </button>

        </td>

        `;


        body.appendChild(row);

    });


    updateSummary();

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    let totalStock=0;

    let stockValue=0;


    inventory.forEach(function(product){

        const quantity =
            number(product.quantity);

        const buying =
            number(product.buyingPrice);


        totalStock += quantity;

        stockValue +=
            quantity * buying;

    });


    document.getElementById(
        "totalProducts"
    ).textContent =
        inventory.length;


    document.getElementById(
        "totalStock"
    ).textContent =
        totalStock;


    document.getElementById(
        "stockValue"
    ).textContent =
        "KSh " + money(stockValue);

}


/* =====================================================
   EDIT
   ===================================================== */

function editProduct(id){

    const product =
        inventory.find(
            p =>
            String(p.id)
            ===
            String(id)
        );


    if(!product){

        alert("Product not found.");

        return;

    }


    editingId = product.id;


    document.getElementById(
        "name"
    ).value =
        product.name || "";


    document.getElementById(
        "category"
    ).value =
        product.category || "";


    document.getElementById(
        "buyingPrice"
    ).value =
        product.buyingPrice ?? "";


    document.getElementById(
        "sellingPrice"
    ).value =
        product.sellingPrice ?? "";


    document.getElementById(
        "quantity"
    ).value =
        product.quantity ?? "";


    document.getElementById(
        "lowStock"
    ).value =
        product.lowStock ?? 5;


    updateForm();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   UPDATE FORM
   ===================================================== */

function updateForm(){

    const title =
        document.getElementById(
            "formTitle"
        );

    const button =
        document.getElementById(
            "saveButton"
        );

    const cancel =
        document.getElementById(
            "cancelButton"
        );


    if(editingId === null){

        title.textContent =
            "Add New Product";

        button.textContent =
            "➕ Add Product";

        cancel.style.display =
            "none";

    }

    else{

        title.textContent =
            "Edit Product";

        button.textContent =
            "💾 Update Product";

        cancel.style.display =
            "inline-block";

    }

}


/* =====================================================
   CANCEL
   ===================================================== */

function cancelEdit(){

    editingId=null;

    clearForm();

    updateForm();

}


/* =====================================================
   CLEAR FORM
   ===================================================== */

function clearForm(){

    document.getElementById(
        "name"
    ).value="";

    document.getElementById(
        "category"
    ).value="";

    document.getElementById(
        "buyingPrice"
    ).value="";

    document.getElementById(
        "sellingPrice"
    ).value="";

    document.getElementById(
        "quantity"
    ).value="";

    document.getElementById(
        "lowStock"
    ).value="5";

}


/* =====================================================
   DELETE
   ===================================================== */

function deleteProduct(id){

    const product =
        inventory.find(
            p =>
            String(p.id)
            ===
            String(id)
        );


    if(!product){

        return;

    }


    if(
        !confirm(
            "Delete " +
            product.name +
            "?"
        )
    ){

        return;

    }


    inventory =
        inventory.filter(
            p =>
            String(p.id)
            !==
            String(id)
        );


    saveInventory();

    displayProducts();


    showMessage(
        "Product deleted.",
        "#c62828"
    );

}


/* =====================================================
   SEARCH
   ===================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    displayProducts
);


/* =====================================================
   ENTER KEY
   ===================================================== */

document
.querySelectorAll(
    "#name,#category,#buyingPrice,#sellingPrice,#quantity,#lowStock"
)
.forEach(function(input){

    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                saveProduct();

            }

        }
    );

});


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(text,color){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent=text;

    message.style.color=color;


    setTimeout(function(){

        message.textContent="";

    },3000);

}


/* =================================
