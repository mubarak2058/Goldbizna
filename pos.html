<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna POS Professional</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0b7a0b;
    color:#fff;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input,
select,
button{
    padding:10px;
    font-size:16px;
    border-radius:6px;
    border:1px solid #ccc;
}

input,
select{
    flex:1;
}

button{
    background:#0b7a0b;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#095f09;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,
