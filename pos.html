<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna POS Professional</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f5;
}

header{
background:#0b7a0b;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:1400px;
margin:20px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.panel{
background:#fff;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
color:#0b7a0b;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

input,
select{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

button{
padding:12px 18px;
background:#0b7a0b;
color:#fff;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#086108;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,
td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0b7a0b;
color:#fff;
}

.summary{
margin-top:20px;
font-size:18px;
font-weight:bold;
}

.total{
font-size:30px;
color:#0b7a0b;
margin:15px 0;
}

.checkout button{
width:100%;
margin-top:10px;
}

@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}
</style>

</head>

<body>

<header>
Goldbizna POS Professional
</header>
<div class="container">

<div class="panel">

<h2>New Sale</h2>

<div class="row">

<input
id="customer"
type="text"
placeholder="Customer Name">

<select id="product">

<option value="">Select Product</option>

</select>

<input
id="qty"
type="number"
value="1"
min="1">

<button onclick="addCart()">
Add Item
</button>

</div>

<table>

<thead>

<tr>

<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Action</th>

</tr>

</thead>

<tbody id="cartTable">

</tbody>

</table>

</div>

<div class="panel">

<h2>Checkout</h2>

<div class="summary">
Items:
<span id="itemsCount">0</span>
</div>

<div class="total">
KSh <span id="grandTotal">0.00</span>
</div>

<label>Payment Method</label>

<select id="payment">

<option value="Cash">Cash</option>

<option value="M-Pesa">M-Pesa</option>

</select>

<br><br>

<input
id="cash"
type="number"
placeholder="Cash Received"
oninput="calculateChange()">

<div class="summary">
Change:
KSh <span id="change">0.00</span>
</div>

<div class="checkout">

<button onclick="completeSale()">
Complete Sale
</button>

<button onclick="printReceipt()">
Print Receipt
</button>

</div>

</div>

</div>

<script>
