<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Customers</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}
header{
    background:#0b7a0b;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
}
.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:8px;
}
input{
    padding:10px;
    margin:5px;
    width:30%;
}
button{
    padding:10px 15px;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ccc;
    padding:8px;
}
th{
    background:#0b7a0b;
    color:white;
}
</style>
</head>

<body>

<header>Goldbizna Customers</header>

<div class="container">

<input id="customerName" placeholder="Customer Name">
<input id="customerPhone" placeholder="Phone Number">
<input id="customerEmail" placeholder="Email">

<button onclick="addCustomer()">Add Customer</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Action</th>
</tr>
</thead>

<tbody id="customerTable"></tbody>

</table>

</div>

<script>

let customers = JSON.parse(localStorage.getItem("goldbizna_customers") || "[]");

function saveCustomers(){
localStorage.setItem("goldbizna_customers", JSON.stringify(customers));
renderCustomers();
}

function addCustomer(){

if(customerName.value.trim()==""){
alert("Enter customer name");
return;
}

customers.push({
name:customerName.value,
phone:customerPhone.value,
email:customerEmail.value
});

customerName.value="";
customerPhone.value="";
customerEmail.value="";

saveCustomers();

}

function deleteCustomer(index){

if(confirm("Delete this customer?")){

customers.splice(index,1);

saveCustomers();

}

}

function renderCustomers(){

customerTable.innerHTML="";

customers.forEach((c,index)=>{

customerTable.innerHTML+=`
<tr>
<td>${c.name}</td>
<td>${c.phone}</td>
<td>${c.email}</td>
<td>
<button onclick="deleteCustomer(${index})">Delete</button>
</td>
</tr>
`;

});

}

renderCustomers();

</script>

</body>
</html>
