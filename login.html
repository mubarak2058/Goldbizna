<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Login</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b7a0b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.login-box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}
h2{
    text-align:center;
    color:#0b7a0b;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#0b7a0b;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#086108;
}
#msg{
    text-align:center;
    margin-top:10px;
    color:red;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Goldbizna Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import { getAuth, signInWithEmailAndPassword }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyA8XB6aY45-yHT0uZ6NUhptMoNkYqgwqOs",

authDomain: "goldbizna.firebaseapp.com",

projectId: "goldbizna",

storageBucket: "goldbizna.firebasestorage.app",

messagingSenderId: "559981054862",

appId: "1:559981054862:web:0635c689607d3baa3272df"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login=function(){

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

window.location="dashboard.html";

})

.catch((error)=>{

document.getElementById("msg").innerHTML=error.message;

});

}

</script>

</body>
</html>
