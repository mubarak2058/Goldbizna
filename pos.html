<script>
const INVENTORY_KEY = "goldbizna_inventory";

let inventory = [];
let cart = [];

/* LOAD INVENTORY */
function loadProducts(){

    const box = document.getElementById("products");

    box.innerHTML =
        '<div class="status">Loading products...</div>';

    try {

        const saved = localStorage.getItem(INVENTORY_KEY);

        console.log("POS inventory data:", saved);

        if (!saved) {
            inventory = [];
            showMessage("No products found. Add products in Inventory first.");
            return;
        }

        const data = JSON.parse(saved);

        if (!Array.isArray(data)) {
            inventory = [];
            showMessage("Inventory data is not valid.");
            return;
        }

        /*
        Convert the inventory into ONE format.
        This makes POS compatible with the working inventory.
        */

        inventory = data.map(function(product, index){

            return {
                id: String(
                    product.id ??
                    product.productId ??
                    ("product-" + index)
                ),

                name: String(
                    product.name ??
                    product.productName ??
                    ""
                ),

                category: String(
                    product.category ??
                    product.cat ??
                    ""
                ),

                buyingPrice: Number(
                    product.buyingPrice ??
                    product.buy ??
                    product.buyPrice ??
                    0
                ),

                sellingPrice: Number(
                    product.sellingPrice ??
                    product.sell ??
                    product.sellPrice ??
                    product.price ??
                    0
                ),

                quantity: Number(
                    product.quantity ??
                    product.qty ??
                    product.stock ??
                    0
                ),

                lowStock: Number(
                    product.lowStock ??
                    product.lowStockAlert ??
                    5
                )
            };

        });

        console.log(
            "POS products loaded:",
            inventory
        );

        displayProducts();

    }

    catch(error){

        console.error(
            "POS inventory error:",
            error
        );

        inventory = [];

        showMessage(
            "Unable to read inventory. Check the browser console."
        );

    }
}


/* MESSAGE */

function showMessage(message){

    document.getElementById("products").innerHTML = `
        <div class="empty">
            ${message}
        </div>
    `;

}


/* SEARCH + DISPLAY */

function displayProducts(){

    const box =
        document.getElementById("products");

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    console.log(
        "Searching for:",
        search
    );


    if(inventory.length === 0){

        showMessage(
            "No products found. Add products in Inventory first."
        );

        return;
    }


    /*
    SEARCH BY:
    Product name
    Category
    */

    const results =
        inventory.filter(function(product){

            const name =
                String(product.name || "")
                .toLowerCase();

            const category =
                String(product.category || "")
                .toLowerCase();

            return (
                name.includes(search) ||
                category.includes(search)
            );

        });


    console.log(
        "Search results:",
        results
    );


    if(results.length === 0){

        box.innerHTML = `
            <div class="empty">

                🔍 No product found for

                <br><br>

                <strong>
                    ${escapeHTML(search)}
                </strong>

            </div>
        `;

        return;
    }


    let html =
        '<div class="products">';


    results.forEach(function(product){

        const stock =
            Number(product.quantity || 0);


        let stockClass = "good";

        let stockText =
            "Stock: " + stock;


        if(stock <= 0){

            stockClass = "out";

            stockText =
                "OUT OF STOCK";

        }

        else if(
            stock <= Number(product.lowStock || 5)
        ){

            stockClass = "low";

        }


        html += `

            <div
                class="product"
                data-id="${escapeHTML(product.id)}"
                onclick="addProduct(this.dataset.id)"
            >

                <div class="product-name">
                    ${escapeHTML(product.name)}
                </div>

                <div class="product-category">
                    ${escapeHTML(
                        product.category ||
                        "No category"
                    )}
                </div>

                <div class="product-price">
                    KSh ${money(product.sellingPrice)}
                </div>

                <div class="product-stock ${stockClass}">
                    ${stockText}
                </div>

            </div>

        `;

    });


    html += "</div>";

    box.innerHTML = html;

}


/* SEARCH LISTENER */

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        displayProducts();

    }
);


/* ESCAPE HTML */

function escapeHTML(value){

    return String(
        value == null ? "" : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* MONEY */

function money(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-KE",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* ADD PRODUCT TO CART */

function addProduct(id){

    const product =
        inventory.find(function(item){

            return String(item.id) ===
                   String(id);

        });


    if(!product){

        alert("Product not found.");

        return;
    }


    const stock =
        Number(product.quantity || 0);


    if(stock <= 0){

        alert(
            product.name +
            " is out of stock."
        );

        return;
    }


    const existing =
        cart.find(function(item){

            return String(item.id) ===
                   String(product.id);

        });


    if(existing){

        if(existing.qty >= stock){

            alert(
                "Only " +
                stock +
                " units available."
            );

            return;
        }

        existing.qty++;

    }
    else{

        cart.push({

            id: product.id,

            name: product.name,

            price:
                Number(
                    product.sellingPrice || 0
                ),

            qty: 1

        });

    }


    renderCart();

}
</script>
