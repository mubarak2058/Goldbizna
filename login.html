<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087a0b">
<title>Goldbizna Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#f3f6f4;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:white;
    padding:30px 25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#087a0b;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    font-weight:bold;
}

h1{
    color:#087a0b;
    font-size:25px;
    margin-bottom:6px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    text-align:left;
    font-weight:bold;
    margin-bottom:7px;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

input:focus{
    border-color:#087a0b;
    box-shadow:0 0 0 2px rgba(8,122,11,.1);
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#087a0b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#065f08;
}

button:disabled{
    opacity:.7;
}

#error{
    display:none;
    margin-top:15px;
    padding:11px;
    border-radius:7px;
    background:#ffe9ed;
    color:#b00020;
    font-size:14px;
    font-weight:bold;
}

.success{
    display:none;
    margin-top:15px;
    color:#087a0b;
    font-weight:bold;
}

footer{
    margin-top:20px;
    color:#888;
    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">G</div>

    <h1>Goldbizna POS Pro</h1>
    <p class="subtitle">Secure Business Management System</p>

    <form id="loginForm">
        <label for="password">Enter Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button id="loginButton" type="submit">Login</button>

        <div id="error">Incorrect password. Please try again.</div>
        <div id="success" class="success">Password granted. Opening Goldbizna...</div>
    </form>

    <footer>Goldbizna POS Pro &copy; 2026</footer>

</div>

<script>
const CORRECT_PASSWORD = "1234";

document.getElementById("loginForm").addEventListener("submit", function(event){
    event.preventDefault();

    const password = document.getElementById("password").value.trim();
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const button = document.getElementById("loginButton");

    error.style.display = "none";
    success.style.display = "none";

    if(password !== CORRECT_PASSWORD){
        error.style.display = "block";
        document.getElementById("password").value = "";
        document.getElementById("password").focus();
        return;
    }

    localStorage.setItem("goldbizna_logged_in", "true");

    if(localStorage.getItem("goldbizna_logged_in") !== "true"){
        error.textContent = "Your browser blocked local storage. Please allow site storage and try again.";
        error.style.display = "block";
        return;
    }

    success.style.display = "block";
    button.disabled = true;
    button.textContent = "Opening...";

    setTimeout(function(){
        window.location.href = "./index.html";
    }, 400);
});
</script>

</body>
</html>
