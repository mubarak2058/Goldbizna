<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Goldbizna - Secure Login</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#063b08,#0b7a0b,#12a018);
    padding:20px;
}
.card{
    width:100%;
    max-width:390px;
    background:#fff;
    border-radius:24px;
    padding:34px 28px;
    box-shadow:0 20px 55px rgba(0,0,0,.28);
    text-align:center;
}
.logo{
    width:76px;
    height:76px;
    margin:0 auto 15px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b7a0b;
    color:#fff;
    font-size:38px;
    font-weight:900;
}
h1{
    margin:0;
    color:#0b7a0b;
    font-size:28px;
}
.subtitle{
    margin:7px 0 28px;
    color:#666;
    font-size:14px;
}
.label{
    display:block;
    text-align:left;
    font-weight:700;
    color:#333;
    margin:0 0 8px;
}
input{
    width:100%;
    height:54px;
    border:2px solid #ddd;
    border-radius:12px;
    padding:0 16px;
    font-size:22px;
    text-align:center;
    letter-spacing:7px;
    outline:none;
}
input:focus{border-color:#0b7a0b}
button{
    width:100%;
    height:54px;
    margin-top:16px;
    border:0;
    border-radius:12px;
    background:#0b7a0b;
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}
button:active{transform:scale(.98)}
#msg{
    min-height:22px;
    margin-top:14px;
    font-weight:700;
    font-size:14px;
}
.footer{
    margin-top:25px;
    color:#888;
    font-size:12px;
}
</style>
</head>
<body>
<div class="card">
    <div class="logo">G</div>
    <h1>Goldbizna</h1>
    <div class="subtitle">Professional Business Management</div>

    <form id="loginForm">
        <label class="label" for="password">Enter Password</label>
        <input id="password" type="password" inputmode="numeric"
               autocomplete="off" autofocus placeholder="••••••"
               aria-label="Goldbizna password">
        <button type="submit">🔐 Unlock Goldbizna</button>
        <div id="msg"></div>
    </form>

    <div class="footer">Secure access • Goldbizna POS Pro</div>
</div>

<script>
const PASSWORD = "1234"; // Change this to your preferred Goldbizna password.
const AUTH_KEY = "goldbizna_authenticated";

// Change this if your main dashboard uses a different filename.
const DASHBOARD = "dashboard.html";

const form = document.getElementById("loginForm");
const input = document.getElementById("password");
const msg = document.getElementById("msg");

function sound(success){
    try{
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = success ? 880 : 220;
        gain.gain.setValueAtTime(.0001,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);
        gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(success?.22:.3));

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime+(success?.22:.3));
    }catch(e){}
}

form.addEventListener("submit",function(e){
    e.preventDefault();

    const entered = input.value.trim();

    // Always clear the password after an attempt.
    input.value = "";

    if(entered === PASSWORD){
        sound(true);
        sessionStorage.setItem(AUTH_KEY,"true");
        msg.textContent = "Access granted";
        msg.style.color = "#0b7a0b";

        setTimeout(()=>{
            location.href = DASHBOARD;
        },300);
    }else{
        sound(false);
        msg.textContent = "Incorrect password";
        msg.style.color = "#c62828";
        input.focus();

        setTimeout(()=>{
            msg.textContent = "";
        },1500);
    }
});
</script>
</body>
</html>
