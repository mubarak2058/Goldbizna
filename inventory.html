<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Inventory</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f5;
}

header{
background:#0b7a0b;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h2{
color:#0b7a0b;
margin-bottom:15px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

input{
flex:1;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
font-size:15px;
}

button{
padding:12px 18px;
background:#0b7a0b;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#086108;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#0b7a0b;
color:#fff;
padding:10px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.low{
color:red;
font-weight:bold;
}

.summary{
margin-top:20px;
font-size:20px;
font-weight:bold;
color:#0b7a0b;
}
