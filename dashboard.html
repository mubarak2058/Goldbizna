<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#0b7a0b;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:95%;
max-width:1200px;
margin:20px auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
text-align:center;
}

.card h3{
color:#666;
margin-bottom:10px;
}

.card h1{
color:#0b7a0b;
font-size:32px;
}

.section{
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.section h2{
margin-bottom:15px;
color:#0b7a0b;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}

th{
background:#0b7a0b;
color:white;
}

.low{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<header>

Goldbizna Dashboard

</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<h1 id="products">0</h1>
</div>

<div class="card">
<h3>Total Customers</h3>
<h1 id="customers">0</h1>
</div>

<div class="card">
<h3>Total Sales</h3>
<h1 id="sales">KSh 0</h1>
</div>

<div class="card">
<h3>Stock Value</h3>
<h1 id="stock">KSh 0</h1>
</div>

</div>

<div class="section">

<h2>Low Stock Products</h2>

<table>

<thead>

<tr>

<th>Product</th>
<th>Category</th>
<th>Remaining</th>

</tr>

</thead>

<tbody id="lowStockTable">

</tbody>

</table>

</div>

<div class="section">

<h2>Recent Sales</h2>

<table>

<thead>

<tr>

<th>Date</th>
<th>Items</th>
<th>Total</th>

</tr>

</thead>

<tbody id="recentSales">

</tbody>

</table>

</div>

</script>
