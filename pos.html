<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f3f6f4;color:#222;padding:12px}
.container{max-width:1100px;margin:auto}
.header{background:#087a0b;color:#fff;padding:16px;border-radius:12px 12px 0 0}
.header h1{font-size:24px}
.customer-box,.pos-box{background:#fff;padding:15px;border-radius:0 0 12px 12px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.customer-box{border-radius:0 0 12px 12px}
label{font-weight:bold;display:block;margin-bottom:6px}
input,select,button{font-size:16px;padding:12px;border-radius:8px}
input,select{width:100%;border:1px solid #ccc}
.search{margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.products,.cart{border:1px solid #ddd;border-radius:10px;padding:12px}
.product{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}
.product:last-child{border-bottom:0}
.product button,.pay button{border:0;background:#087a0b;color:#fff;cursor:pointer}
.product button:hover,.pay button:hover{background:#065f08}
.cart-item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.qty button{padding:5px 9px;border:1px solid #ccc;background:#fff}
.total{font-size:22px;font-weight:bold;text-align:right;margin-top:15px}
.pay{margin-top:15px}
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pay button{width:100%}
.mpesa-box,.split-box{display:none;margin-top:12px;padding:12px;background:#f5faf5;border:1px solid #b8dcb9;border-radius:8px}
.confirm{margin-top:10px}
.receipt{display:none;background:#fff;padding:20px;margin-top:15px;border-radius:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.pay-grid{grid-template-columns:1fr 1fr}.product{align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Goldbizna POS</h1>
    <div id="servedBy">You were served by: —</div>
  </div>

  <div class="customer-box">
    <label for="customerName">Customer Name</label>
    <input id="customerName" type="text" placeholder="Enter customer name">
    <div style="height:10px"></div>
    <label for="customerPhone">Customer Phone</label>
    <input id="customerPhone" type="tel" placeholder="07XXXXXXXX">
  </div>

  <div class="pos-box">
    <h2>POS</h2>
    <div class="search">
      <input id="search" type="search" placeholder="🔎 Search products by name, SKU or barcode...">
    </div>

    <div class="grid">
      <div class="products">
        <h3>Products</h3>
        <div id="productsList">Loading inventory...</div>
      </div>

      <div class="cart">
        <h3>Cart</h3>
        <div id="cartList">Cart is empty.</div>
        <div class="total">Total: KSh <span id="total">0.00</span></div>

        <div class="pay">
          <strong>Payment Method</strong>
          <div class="pay-grid">
            <button onclick="choosePayment('M-Pesa')">M-Pesa</button>
            <button onclick="choosePayment('Cash')">Cash</button>
            <button onclick="choosePayment('Card')">Card</button>
            <button onclick="choosePayment('Bank')">Bank</button>
          </div>
          <button style="width:100%;margin-top:8px" onclick="choosePayment('Split')">Split Payment</button>

          <div id="mpesaBox" class="mpesa-box">
            <strong>M-Pesa Payment</strong>
            <p style="margin:8px 0">Waiting for the customer to pay the displayed total.</p>
            <button onclick="confirmMpesa()">Payment Received — Finalize Sale</button>
          </div>

          <div id="splitBox" class="split-box">
            <strong>Split Payment</strong>
            <input id="splitMpesa" type="number" min="0" placeholder="M-Pesa amount" style="margin-top:8px">
            <input id="splitCash" type="number" min="0" placeholder="Cash amount" style="margin-top:8px">
            <button onclick="finalizeSplit()" style="margin-top:8px;background:#087a0b;color:#fff;border:0;width:100%">Finalize Split Sale</button>
          </div>

          <button id="finalizeBtn" style="display:none;width:100%;margin-top:10px;background:#087a0b;color:#fff;border:0" onclick="finalizeSale()">Finalize Sale</button>
        </div>
      </div>
    </div>
  </div>

  <div id="receipt" class="receipt"></div>
</div>

<script>
const INVENTORY_KEY="goldbizna_inventory";
const SALES_KEY="goldbizna_sales";
let inventory=[];
let cart=[];
let paymentMethod="";

function money(n){return Number(n||0).toFixed(2)}

function getInventory(){
  try{
    const data=JSON.parse(localStorage.getItem(INVENTORY_KEY)||"[]");
    return Array.isArray(data)?data:[];
  }catch(e){return []}
}

function productName(p){return p.name||p.productName||p.title||"Unnamed Product"}
function productPrice(p){return Number(p.price||p.sellingPrice||p.salePrice||0)}
function productStock(p){return Number(p.stock??p.quantity??p.qty??0)}
function productCode(p){return p.sku||p.barcode||p.code||""}

function renderProducts(){
  inventory=getInventory();
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=document.getElementById("productsList");
  const found=inventory.filter(p=>
    productName(p).toLowerCase().includes(q) ||
    String(productCode(p)).toLowerCase().includes(q)
  );
  if(!found.length){
    list.innerHTML=inventory.length?"No matching products.":"No products found in inventory.";
    return;
  }
  list.innerHTML=found.map((p,i)=>{
    const original=inventory.indexOf(p);
    const stock=productStock(p);
    return `<div class="product">
      <div><strong>${escapeHtml(productName(p))}</strong><br>
      <small>${escapeHtml(productCode(p))} · Stock: ${stock} · KSh ${money(productPrice(p))}</small></div>
      <button onclick="addToCart(${original})" ${stock<=0?"disabled":""}>Add</button>
    </div>`;
  }).join("");
}

function addToCart(index){
  const p=inventory[index];
  if(!p)return;
  const stock=productStock(p);
  const existing=cart.find(x=>x.index===index);
  if(existing){
    if(existing.qty<stock)existing.qty++;
  }else{
    cart.push({index,qty:1});
  }
  renderCart();
}

function changeQty(index,delta){
  const item=cart.find(x=>x.index===index);
  if(!item)return;
  const stock=productStock(inventory[item.index]);
  item.qty+=delta;
  if(item.qty<=0)cart=cart.filter(x=>x!==item);
  else if(item.qty>stock)item.qty=stock;
  renderCart();
}

function removeItem(index){cart=cart.filter(x=>x.index!==index);renderCart()}

function renderCart(){
  const list=document.getElementById("cartList");
  if(!cart.length){list.innerHTML="Cart is empty.";document.getElementById("total").textContent="0.00";return}
  list.innerHTML=cart.map(item=>{
    const p=inventory[item.index], line=item.qty*productPrice(p);
    return `<div class="cart-item"><div><strong>${escapeHtml(productName(p))}</strong><br>KSh ${money(line)}</div>
    <div class="qty"><button onclick="changeQty(${item.index},-1)">−</button> ${item.qty} <button onclick="changeQty(${item.index},1)">+</button>
    <button onclick="removeItem(${item.index})">🗑</button></div></div>`;
  }).join("");
  document.getElementById("total").textContent=money(cart.reduce((s,i)=>s+i.qty*productPrice(inventory[i.index]),0));
}

function total(){return cart.reduce((s,i)=>s+i.qty*productPrice(inventory[i.index]),0)}

function choosePayment(method){
  paymentMethod=method;
  document.getElementById("mpesaBox").style.display=method==="M-Pesa"?"block":"none";
  document.getElementById("splitBox").style.display=method==="Split"?"block":"none";
  document.getElementById("finalizeBtn").style.display=["Cash","Card","Bank"].includes(method)?"block":"none";
}

function confirmMpesa(){
  const name=document.getElementById("customerName").value.trim()||"the customer";
  if(confirm(`Has ${name} paid KSh ${money(total())} through M-Pesa?\n\nYes = finalize sale\nNo = keep waiting`)) finalizeSale();
}

function finalizeSplit(){
  const m=Number(document.getElementById("splitMpesa").value||0);
  const c=Number(document.getElementById("splitCash").value||0);
  if(Math.abs(m+c-total())>0.009){alert("Split payment must equal the total.");return}
  finalizeSale("Split");
}

function finalizeSale(methodOverride){
  if(!cart.length){alert("Cart is empty.");return}
  const method=methodOverride||paymentMethod;
  if(!method){alert("Choose a payment method.");return}
  const customer=document.getElementById("customerName").value.trim()||"Walk-in Customer";
  const phone=document.getElementById("customerPhone").value.trim();
  const username=localStorage.getItem("goldbizna_username")||"User";
  const sale={
    id:"GB-"+Date.now(),
    date:new Date().toISOString(),
    customerName:customer,
    customerPhone:phone,
    servedBy:username,
    paymentMethod:method,
    total:total(),
    items:cart.map(i=>({name:productName(inventory[i.index]),qty:i.qty,price:productPrice(inventory[i.index])}))
  };

  inventory=inventory.map((p,index)=>{
    const item=cart.find(i=>i.index===index);
    if(!item)return p;
    const stock=productStock(p)-item.qty;
    const copy={...p};
    if("stock" in copy)copy.stock=stock;
    else if("quantity" in copy)copy.quantity=stock;
    else copy.stock=stock;
    return copy;
  });
  localStorage.setItem(INVENTORY_KEY,JSON.stringify(inventory));

  let sales=[];try{sales=JSON.parse(localStorage.getItem(SALES_KEY)||"[]")}catch(e){}
  if(!Array.isArray(sales))sales=[];
  sales.push(sale);
  localStorage.setItem(SALES_KEY,JSON.stringify(sales));

  showReceipt(sale);
  cart=[];renderProducts();renderCart();
  document.getElementById("finalizeBtn").style.display="none";
  document.getElementById("mpesaBox").style.display="none";
  document.getElementById("splitBox").style.display="none";
}

function showReceipt(sale){
  const box=document.getElementById("receipt");
  box.style.display="block";
  box.innerHTML=`<h2>Goldbizna POS</h2>
  <p>Customer: <strong>${escapeHtml(sale.customerName)}</strong></p>
  <p>You were served by: <strong>${escapeHtml(sale.servedBy)}</strong></p>
  <p>${new Date(sale.date).toLocaleString()}</p>
  <hr style="margin:10px 0">
  ${sale.items.map(i=>`<div>${escapeHtml(i.name)} × ${i.qty} — KSh ${money(i.qty*i.price)}</div>`).join("")}
  <hr style="margin:10px 0"><h3>Total: KSh ${money(sale.total)}</h3>
  <p>Payment: ${escapeHtml(sale.paymentMethod)}</p>
  <button onclick="window.print()" style="margin-top:12px;background:#087a0b;color:white;border:0;width:100%">Print Receipt</button>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

document.getElementById("search").addEventListener("input",renderProducts);
document.getElementById("servedBy").textContent="You were served by: "+(localStorage.getItem("goldbizna_username")||"—");
renderProducts();
renderCart();
</script>
</body>
</html>
