<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldbizna Reports</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}

header{
    background:#0b7a0b;
    color:white;
    text-align:center;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.card{
    background:#f9f9f9;
    border-left:6px solid #0b7a0b;
    padding:15px;
    margin:15px 0;
    border-radius:5px;
}

h2{
    color:#0b7a0b;
}

button{
    background:#0b7a0b;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>

<body>

<header>
Goldbizna Business Reports
</header>

<div class="container">

<div class="card">
<h2>Total Products</h2>
<h1 id="products">0</h1>
</div>

<div class="card">
<h2>Total Sales</h2>
<h1 id="sales">0</h1>
</div>

<div class="card">
<h2>Total Revenue (KES)</h2>
<h1 id="revenue">0</h1>
</div>

<button onclick="window.print()">
Print Report
</button>

</div>

<script>

let inventory =
JSON.parse(localStorage.getItem("goldbizna_inventory") || "[]");

let salesData =
JSON.parse(localStorage.getItem("goldbizna_sales") || "[]");

document.getElementById("products").innerHTML =
inventory.length;

document.getElementById("sales").innerHTML =
salesData.length;

let total = 0;

salesData.forEach(function(s){

total += Number(s.total || 0);

});

document.getElementById("revenue").innerHTML =
total.toLocaleString();

</script>

</body>
</html>
